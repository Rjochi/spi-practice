定価と売価の差です。割合の基準は定価5000円です。\n\n2. 式を立てる理由\n差額÷定価で、定価の何割を引いたかが分かります。\n\n3. 順番に計算する\n値引き額：5000−3750 = 1250円\n割引率：1250 ÷ 5000 × 100 = 25％\n\n4. 答えを確かめる\n売価は定価の75％。5000×0.75 = 3750円です。", "tip": "割引率を売価で割らないようにしましょう。", "steps": [{"title": "条件を整理する", "text": "値引き額は定価と売価の差です。割合の基準は定価5000円です。"}, {"title": "式を立てる理由", "text": "差額÷定価で、定価の何割を引いたかが分かります。"}, {"title": "順番に計算する", "text": "値引き額：5000−3750 = 1250円\n割引率：1250 ÷ 5000 × 100 = 25％"}, {"title": "答えを確かめる", "text": "売価は定価の75％。5000×0.75 = 3750円です。"}]}, {"id": "q453", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "品物を1個100円で40個仕入れました。1個200円で売り、売れ残りを廃棄するとき、全体で1000円以上の利益を出すには最低何個売る必要がありますか。", "choices": ["26個", "27個", "24個", "25個"], "answer": 3, "explanation": "1. 条件を整理する\n全体の仕入れ費は4000円。売れ残りも費用に含め、利益1000円を上乗せする売上が必要です。\n\n2. 式を立てる理由\n必要売上＝全仕入れ費＋目標利益。1個の売価で割って最低個数を求めます。\n\n3. 順番に計算する\n必要売上：4000+1000 = 5000円\n必要個数：5000 ÷ 200 = 25個\n\n4. 答えを確かめる\n24個では利益800円で不足。25個なら1000円になります。", "tip": "最低個数では、割り切れないときは切り上げます。", "steps": [{"title": "条件を整理する", "text": "全体の仕入れ費は4000円。売れ残りも費用に含め、利益1000円を上乗せする売上が必要です。"}, {"title": "式を立てる理由", "text": "必要売上＝全仕入れ費＋目標利益。1個の売価で割って最低個数を求めます。"}, {"title": "順番に計算する", "text": "必要売上：4000+1000 = 5000円\n必要個数：5000 ÷ 200 = 25個"}, {"title": "答えを確かめる", "text": "24個では利益800円で不足。25個なら1000円になります。"}]}, {"id": "q454", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "1個600円の商品は、6個セットなら3000円です。6個をばらで買う場合に比べ、セットは何％安いですか。", "choices": ["17％", "52/3％", "50/3％", "49/3％"], "answer": 2, "explanation": "1. 条件を整理する\nばら6個は3600円、セットは3000円です。\n\n2. 式を立てる理由\n安くなった額を、比較の基準であるばら購入の総額で割ります。\n\n3. 順番に計算する\n差額：3600−3000 = 600円\n割合：600 ÷ 3600 × 100 = 50/3％\n\n4. 答えを確かめる\nばら6個の代金のうち1個分が安くなるので、1/6＝50/3％です。", "tip": "比較の基準となる価格を先に決めます。", "steps": [{"title": "条件を整理する", "text": "ばら6個は3600円、セットは3000円です。"}, {"title": "式を立てる理由", "text": "安くなった額を、比較の基準であるばら購入の総額で割ります。"}, {"title": "順番に計算する", "text": "差額：3600−3000 = 600円\n割合：600 ÷ 3600 × 100 = 50/3％"}, {"title": "答えを確かめる", "text": "ばら6個の代金のうち1個分が安くなるので、1/6＝50/3％です。"}]}, {"id": "q455", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "原価3000円の商品に定価6000円をつけました。赤字を出さないための最大割引率は何％ですか。", "choices": ["60％", "50％", "70％", "40％"], "answer": 1, "explanation": "1. 条件を整理する\n赤字を出さない最低売価は原価3000円です。\n\n2. 式を立てる理由\n割引後の売価が原価と等しくなるところが限界です。定価から原価までの差を定価で割ります。\n\n3. 順番に計算する\n最大値引き額：6000−3000 = 3000円\n最大割引率：3000 ÷ 6000 × 100 = 50％\n\n4. 答えを確かめる\n50％引きなら売価は3000円で利益0円。それより割り引くと原価を下回ります。", "tip": "利益0円を赤字との境界として計算します。", "steps": [{"title": "条件を整理する", "text": "赤字を出さない最低売価は原価3000円です。"}, {"title": "式を立てる理由", "text": "割引後の売価が原価と等しくなるところが限界です。定価から原価までの差を定価で割ります。"}, {"title": "順番に計算する", "text": "最大値引き額：6000−3000 = 3000円\n最大割引率：3000 ÷ 6000 × 100 = 50％"}, {"title": "答えを確かめる", "text": "50％引きなら売価は3000円で利益0円。それより割り引くと原価を下回ります。"}]}, {"id": "q456", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "原価1200円の商品を2000円で販売しました。販売手数料として売価の10％を支払うと、手数料も差し引いた利益はいくらですか。", "choices": ["600円", "700円", "800円", "500円"], "answer": 0, "explanation": "1. 条件を整理する\n売上2000円から、原価と手数料の両方を引きます。\n\n2. 式を立てる理由\n手数料は売価を基準に計算します。売上の90％が受取額で、そこから原価を引きます。\n\n3. 順番に計算する\n手数料：2000×0.1 = 200円\n受取額：2000−200 = 1800円\n利益：1800−1200 = 600円\n\n4. 答えを確かめる\n原価1200円＋手数料200円＋利益600円＝売価2000円です。", "tip": "費用が複数ある場合はすべて差し引きます。", "steps": [{"title": "条件を整理する", "text": "売上2000円から、原価と手数料の両方を引きます。"}, {"title": "式を立てる理由", "text": "手数料は売価を基準に計算します。売上の90％が受取額で、そこから原価を引きます。"}, {"title": "順番に計算する", "text": "手数料：2000×0.1 = 200円\n受取額：2000−200 = 1800円\n利益：1800−1200 = 600円"}, {"title": "答えを確かめる", "text": "原価1200円＋手数料200円＋利益600円＝売価2000円です。"}]}, {"id": "q457", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "1個300円で30個仕入れ、半分を500円、残り半分を350円で売り切りました。全体の利益はいくらですか。", "choices": ["3850円", "3950円", "3650円", "3750円"], "answer": 3, "explanation": "1. 条件を整理する\n販売価格が2種類です。各価格の売上を足し、仕入れ総額を引きます。\n\n2. 式を立てる理由\n個数が同じなので平均売価でも計算できますが、まず価格ごとに売上を求めると確実です。\n\n3. 順番に計算する\n500円の売上：15×500 = 7500円\n350円の売上：15×350 = 5250円\n利益：7500+5250−9000 = 3750円\n\n4. 答えを確かめる\n平均売価は425円。1個平均の利益125円×30個＝3750円です。", "tip": "価格が異なるグループの売上を分けます。", "steps": [{"title": "条件を整理する", "text": "販売価格が2種類です。各価格の売上を足し、仕入れ総額を引きます。"}, {"title": "式を立てる理由", "text": "個数が同じなので平均売価でも計算できますが、まず価格ごとに売上を求めると確実です。"}, {"title": "順番に計算する", "text": "500円の売上：15×500 = 7500円\n350円の売上：15×350 = 5250円\n利益：7500+5250−9000 = 3750円"}, {"title": "答えを確かめる", "text": "平均売価は425円。1個平均の利益125円×30個＝3750円です。"}]}, {"id": "q458", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "定価2000円の品を20％引きにし、その値引き後の価格からさらに10％引きにしました。最終価格はいくらですか。", "choices": ["1540円", "1640円", "1440円", "1340円"], "answer": 2, "explanation": "1. 条件を整理する\n2回目の10％は元の定価ではなく、最初の値引き後の価格に掛かります。\n\n2. 式を立てる理由\n値引き後に残る倍率0.8と0.9を順に掛けます。合計30％引きにはなりません。\n\n3. 順番に計算する\n1回目：2000×0.8 = 1600円\n2回目：1600×0.9 = 1440円\n\n4. 答えを確かめる\n0.8×0.9＝0.72なので最終価格は定価の72％、合計では28％引きです。", "tip": "連続割引は割引率の足し算ではなく倍率の掛け算です。", "steps": [{"title": "条件を整理する", "text": "2回目の10％は元の定価ではなく、最初の値引き後の価格に掛かります。"}, {"title": "式を立てる理由", "text": "値引き後に残る倍率0.8と0.9を順に掛けます。合計30％引きにはなりません。"}, {"title": "順番に計算する", "text": "1回目：2000×0.8 = 1600円\n2回目：1600×0.9 = 1440円"}, {"title": "答えを確かめる", "text": "0.8×0.9＝0.72なので最終価格は定価の72％、合計では28％引きです。"}]}, {"id": "q459", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "売価1200円の品の利益は、売価の20％でした。この品の原価はいくらですか。", "choices": ["1060円", "960円", "1160円", "860円"], "answer": 1, "explanation": "1. 条件を整理する\n今回は「売価の20％」が利益です。原価の20％ではありません。\n\n2. 式を立てる理由\n売価＝原価＋利益なので、売価から利益を引きます。\n\n3. 順番に計算する\n利益：1200×0.2 = 240円\n原価：1200−240 = 960円\n\n4. 答えを確かめる\n原価960＋利益240＝売価1200。原価基準なら利益率25％となり、基準の違いも確認できます。", "tip": "利益率の基準が売価か原価かを必ず読みます。", "steps": [{"title": "条件を整理する", "text": "今回は「売価の20％」が利益です。原価の20％ではありません。"}, {"title": "式を立てる理由", "text": "売価＝原価＋利益なので、売価から利益を引きます。"}, {"title": "順番に計算する", "text": "利益：1200×0.2 = 240円\n原価：1200−240 = 960円"}, {"title": "答えを確かめる", "text": "原価960＋利益240＝売価1200。原価基準なら利益率25％となり、基準の違いも確認できます。"}]}, {"id": "q460", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "出店に固定費9000円がかかり、商品1個の材料費は100円、売価は250円です。固定費も回収して利益を0円以上にするには、最低何個売ればよいですか。", "choices": ["60個", "70個", "80個", "50個"], "answer": 0, "explanation": "1. 条件を整理する\n1個売るごとに材料費を引いた150円を固定費の回収に使えます。\n\n2. 式を立てる理由\n売上250xから材料費100xと固定費を引き、利益が0以上になる境界を求めます。\n\n3. 順番に計算する\n1個あたり回収額：250−100 = 150円\n必要個数：9000 ÷ 150 = 60個\n\n4. 答えを確かめる\n60個なら売上15000−材料費6000−固定費9000＝0円です。", "tip": "固定費と1個ごとの変動費を区別します。", "steps": [{"title": "条件を整理する", "text": "1個売るごとに材料費を引いた150円を固定費の回収に使えます。"}, {"title": "式を立てる理由", "text": "売上250xから材料費100xと固定費を引き、利益が0以上になる境界を求めます。"}, {"title": "順番に計算する", "text": "1個あたり回収額：250−100 = 150円\n必要個数：9000 ÷ 150 = 60個"}, {"title": "答えを確かめる", "text": "60個なら売上15000−材料費6000−固定費9000＝0円です。"}]}, {"id": "q461", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "長さ180mの列車が時速72kmで走っています。電柱の前を通り過ぎるのに何秒かかりますか。", "choices": ["10秒", "11秒", "8秒", "9秒"], "answer": 3, "explanation": "1. 条件を整理する\n列車の先頭が電柱に来てから最後尾が通過するまで、列車は自分の長さ180mだけ進みます。\n\n2. 式を立てる理由\n時速を秒速へ直し、距離÷秒速で秒数を求めます。\n\n3. 順番に計算する\n72km/時 = 72000m ÷ 3600秒 = 20m/秒\n時間：180 ÷ 20 = 9秒\n\n4. 答えを確かめる\n20 × 9 = 180m。列車の長さだけ進めています。", "tip": "km/時をm/秒へ直すには3.6で割ります。", "steps": [{"title": "条件を整理する", "text": "列車の先頭が電柱に来てから最後尾が通過するまで、列車は自分の長さ180mだけ進みます。"}, {"title": "式を立てる理由", "text": "時速を秒速へ直し、距離÷秒速で秒数を求めます。"}, {"title": "順番に計算する", "text": "72km/時 = 72000m ÷ 3600秒 = 20m/秒\n時間：180 ÷ 20 = 9秒"}, {"title": "答えを確かめる", "text": "20 × 9 = 180m。列車の長さだけ進めています。"}]}, {"id": "q462", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "長さ120mの列車が秒速25mで、長さ480mのトンネルを完全に通り抜けます。先頭が入り始めてから最後尾が出るまで何秒ですか。", "choices": ["25秒", "26秒", "24秒", "23秒"], "answer": 2, "explanation": "1. 条件を整理する\n必要な移動距離はトンネルの長さと列車の長さの合計です。\n\n2. 式を立てる理由\n先頭が出口に達しただけでは最後尾が残ります。列車の長さ分も足します。\n\n3. 順番に計算する\n移動距離：480+120 = 600m\n時間：600 ÷ 25 = 24秒\n\n4. 答えを確かめる\n24秒で先頭は600m進み、最後尾も出口に達します。", "tip": "完全通過では列車の長さを忘れないようにします。", "steps": [{"title": "条件を整理する", "text": "必要な移動距離はトンネルの長さと列車の長さの合計です。"}, {"title": "式を立てる理由", "text": "先頭が出口に達しただけでは最後尾が残ります。列車の長さ分も足します。"}, {"title": "順番に計算する", "text": "移動距離：480+120 = 600m\n時間：600 ÷ 25 = 24秒"}, {"title": "答えを確かめる", "text": "24秒で先頭は600m進み、最後尾も出口に達します。"}]}, {"id": "q463", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "静水時の速さが時速12kmの船が、時速3kmの流れを下ります。45km下るのに何時間かかりますか。", "choices": ["4時間", "3時間", "5時間", "2時間"], "answer": 1, "explanation": "1. 条件を整理する\n川の流れと同じ方向なので、地上から見た速さは船の速さと流れの速さの和です。\n\n2. 式を立てる理由\n下りは流れに押される分だけ速くなります。距離を合成した速さで割ります。\n\n3. 順番に計算する\n下りの速さ：12+3 = 15km/時\n時間：45 ÷ 15 = 3時間\n\n4. 答えを確かめる\n15 × 3 = 45kmです。静水時だけで割った場合より短い時間になります。", "tip": "下りは足し、上りは引きます。", "steps": [{"title": "条件を整理する", "text": "川の流れと同じ方向なので、地上から見た速さは船の速さと流れの速さの和です。"}, {"title": "式を立てる理由", "text": "下りは流れに押される分だけ速くなります。距離を合成した速さで割ります。"}, {"title": "順番に計算する", "text": "下りの速さ：12+3 = 15km/時\n時間：45 ÷ 15 = 3時間"}, {"title": "答えを確かめる", "text": "15 × 3 = 45kmです。静水時だけで割った場合より短い時間になります。"}]}, {"id": "q464", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "静水時の速さが時速10kmの船が、時速2kmの流れに逆らって24km上ります。何時間かかりますか。", "choices": ["3時間", "4時間", "5時間", "2時間"], "answer": 0, "explanation": "1. 条件を整理する\n上りでは川の流れの分だけ、地上から見た進む速さが遅くなります。\n\n2. 式を立てる理由\n有効な速さは静水時の速さ−流速。距離をこの速さで割ります。\n\n3. 順番に計算する\n上りの速さ：10−2 = 8km/時\n時間：24 ÷ 8 = 3時間\n\n4. 答えを確かめる\n8 × 3 = 24km。流れがある分、静水時の12/5時間より長くなります。", "tip": "流れに逆らう場合に速さを足さないよう注意します。", "steps": [{"title": "条件を整理する", "text": "上りでは川の流れの分だけ、地上から見た進む速さが遅くなります。"}, {"title": "式を立てる理由", "text": "有効な速さは静水時の速さ−流速。距離をこの速さで割ります。"}, {"title": "順番に計算する", "text": "上りの速さ：10−2 = 8km/時\n時間：24 ÷ 8 = 3時間"}, {"title": "答えを確かめる", "text": "8 × 3 = 24km。流れがある分、静水時の12/5時間より長くなります。"}]}, {"id": "q465", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "Aは時速4kmで出発し、その30分後にBが同じ場所から同じ道を時速6kmで追いかけます。Bが出発してから何分後に追いつきますか。", "choices": ["70分", "80分", "50分", "60分"], "answer": 3, "explanation": "1. 条件を整理する\nBの出発時にAが先に進んだ距離は4×1/2＝2kmです。\n\n2. 式を立てる理由\n先行距離を速さの差で割ります。求める時間の起点はAではなくBの出発です。\n\n3. 順番に計算する\n速さの差：6−4 = 2km/時\n時間：2 ÷ 2 = 1時間\n分へ換算：1×60 = 60分\n\n4. 答えを確かめる\nBが走った距離6×1と、Aが先行分を含めて進んだ4×(1+1/2)は等しくなります。", "tip": "「誰が出発してから」かを確認します。", "steps": [{"title": "条件を整理する", "text": "Bの出発時にAが先に進んだ距離は4×1/2＝2kmです。"}, {"title": "式を立てる理由", "text": "先行距離を速さの差で割ります。求める時間の起点はAではなくBの出発です。"}, {"title": "順番に計算する", "text": "速さの差：6−4 = 2km/時\n時間：2 ÷ 2 = 1時間\n分へ換算：1×60 = 60分"}, {"title": "答えを確かめる", "text": "Bが走った距離6×1と、Aが先行分を含めて進んだ4×(1+1/2)は等しくなります。"}]}, {"id": "q466", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "1周300mのコースを、Aは分速80m、Bは分速60mで同じ場所から同じ方向に同時に走り始めます。Aが初めてBに1周差をつけるのは何分後ですか。", "choices": ["16分", "17分", "15分", "14分"], "answer": 2, "explanation": "1. 条件を整理する\n1周差をつけるには、AがBより300m多く進む必要があります。\n\n2. 式を立てる理由\n1分で差が20m広がります。コース1周分の差を速さの差で割ります。\n\n3. 順番に計算する\n差の広がる速さ：80−60 = 20m/分\n時間：300 ÷ 20 = 15分\n\n4. 答えを確かめる\n進んだ距離の差は(80−60)×15 = 300mで、ちょうど1周です。", "tip": "同方向の周回では1周分の距離を速さの差で割ります。", "steps": [{"title": "条件を整理する", "text": "1周差をつけるには、AがBより300m多く進む必要があります。"}, {"title": "式を立てる理由", "text": "1分で差が20m広がります。コース1周分の差を速さの差で割ります。"}, {"title": "順番に計算する", "text": "差の広がる速さ：80−60 = 20m/分\n時間：300 ÷ 20 = 15分"}, {"title": "答えを確かめる", "text": "進んだ距離の差は(80−60)×15 = 300mで、ちょうど1周です。"}]}, {"id": "q467", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "全長12kmの道を、前半の距離は時速4km、後半の距離は時速6kmで進みます。全体で何時間かかりますか。", "choices": ["3時間", "5/2時間", "7/2時間", "2時間"], "answer": 1, "explanation": "1. 条件を整理する\n前半・後半は時間ではなく距離を半分に分けています。各区間は6kmです。\n\n2. 式を立てる理由\n各区間の距離÷速さで時間を出し、合計します。速さの単純平均は使いません。\n\n3. 順番に計算する\n前半：6 ÷ 4 = 3/2（1.5）時間\n後半：6 ÷ 6 = 1時間\n合計：3/2+1 = 5/2（2.5）時間\n\n4. 答えを確かめる\n平均の速さは12 ÷ 5/2 = 24/5km/時。4と6の間で、遅い区間の影響が大きくなります。", "tip": "区間ごとの時間を足してから平均を考えます。", "steps": [{"title": "条件を整理する", "text": "前半・後半は時間ではなく距離を半分に分けています。各区間は6kmです。"}, {"title": "式を立てる理由", "text": "各区間の距離÷速さで時間を出し、合計します。速さの単純平均は使いません。"}, {"title": "順番に計算する", "text": "前半：6 ÷ 4 = 3/2（1.5）時間\n後半：6 ÷ 6 = 1時間\n合計：3/2+1 = 5/2（2.5）時間"}, {"title": "答えを確かめる", "text": "平均の速さは12 ÷ 5/2 = 24/5km/時。4と6の間で、遅い区間の影響が大きくなります。"}]}, {"id": "q468", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "6kmの道を時速6kmで進み、途中で15分休憩しました。出発から到着まで何分ですか。", "choices": ["75分", "85分", "95分", "65分"], "answer": 0, "explanation": "1. 条件を整理する\n移動に掛かる時間と休憩時間を別々に計算します。\n\n2. 式を立てる理由\n休憩中は距離が増えませんが、所要時間には含めます。時間の単位を分にそろえて足します。\n\n3. 順番に計算する\n移動：6 ÷ 6時間 = 60分\n所要時間：60+15 = 75分\n\n4. 答えを確かめる\n休憩15分を引くと60分＝1時間。時速6kmで6km進みます。", "tip": "移動時間だけと、休憩込みの所要時間を区別します。", "steps": [{"title": "条件を整理する", "text": "移動に掛かる時間と休憩時間を別々に計算します。"}, {"title": "式を立てる理由", "text": "休憩中は距離が増えませんが、所要時間には含めます。時間の単位を分にそろえて足します。"}, {"title": "順番に計算する", "text": "移動：6 ÷ 6時間 = 60分\n所要時間：60+15 = 75分"}, {"title": "答えを確かめる", "text": "休憩15分を引くと60分＝1時間。時速6kmで6km進みます。"}]}, {"id": "q469", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "同じ船の下りの速さは時速18km、上りの速さは時速12kmです。静水時の速さは一定とすると、川の流速は時速何kmですか。", "choices": ["4km", "5km", "2km", "3km"], "answer": 3, "explanation": "1. 条件を整理する\n下り＝静水時＋流速、上り＝静水時−流速です。\n\n2. 式を立てる理由\n二つの速さを引くと、静水時の速さが消えて流速2個分になります。\n\n3. 順番に計算する\n下り−上り：18−12 = 6km/時\n流速：6 ÷ 2 = 3km/時\n\n4. 答えを確かめる\n静水時は(18+12)÷2 = 15km/時。これに流速3を足すと18、引くと12です。", "tip": "下りと上りの差は流速の2倍です。", "steps": [{"title": "条件を整理する", "text": "下り＝静水時＋流速、上り＝静水時−流速です。"}, {"title": "式を立てる理由", "text": "二つの速さを引くと、静水時の速さが消えて流速2個分になります。"}, {"title": "順番に計算する", "text": "下り−上り：18−12 = 6km/時\n流速：6 ÷ 2 = 3km/時"}, {"title": "答えを確かめる", "text": "静水時は(18+12)÷2 = 15km/時。これに流速3を足すと18、引くと12です。"}]}, {"id": "q470", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "自転車で最初の8kmを20分、次の6kmを30分で走りました。全体の平均の速さは時速何kmですか。", "choices": ["17km", "86/5km", "84/5km", "83/5km"], "answer": 2, "explanation": "1. 条件を整理する\n総距離14km、総時間50分です。\n\n2. 式を立てる理由\n平均の速さは総距離÷総時間。区間ごとの速さを平均するのではありません。\n\n3. 順番に計算する\n総時間：50分 = 50/60 = 5/6時間\n平均：14 ÷ (5/6)\n= 14×6/5 = 84/5（16.8）km/時\n\n4. 答えを確かめる\n答えの速さで5/6時間進むと84/5×5/6＝14kmになり、総距離と一致します。", "tip": "分数で割るときは逆数を掛けます。", "steps": [{"title": "条件を整理する", "text": "総距離14km、総時間50分です。"}, {"title": "式を立てる理由", "text": "平均の速さは総距離÷総時間。区間ごとの速さを平均するのではありません。"}, {"title": "順番に計算する", "text": "総時間：50分 = 50/60 = 5/6時間\n平均：14 ÷ (5/6)\n= 14×6/5 = 84/5（16.8）km/時"}, {"title": "答えを確かめる", "text": "答えの速さで5/6時間進むと84/5×5/6＝14kmになり、総距離と一致します。"}]}, {"id": "q471", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "長さ240mの列車が時速72kmで走っています。電柱の前を通り過ぎるのに何秒かかりますか。", "choices": ["13秒", "12秒", "14秒", "11秒"], "answer": 1, "explanation": "1. 条件を整理する\n列車の先頭が電柱に来てから最後尾が通過するまで、列車は自分の長さ240mだけ進みます。\n\n2. 式を立てる理由\n時速を秒速へ直し、距離÷秒速で秒数を求めます。\n\n3. 順番に計算する\n72km/時 = 72000m ÷ 3600秒 = 20m/秒\n時間：240 ÷ 20 = 12秒\n\n4. 答えを確かめる\n20 × 12 = 240m。列車の長さだけ進めています。", "tip": "km/時をm/秒へ直すには3.6で割ります。", "steps": [{"title": "条件を整理する", "text": "列車の先頭が電柱に来てから最後尾が通過するまで、列車は自分の長さ240mだけ進みます。"}, {"title": "式を立てる理由", "text": "時速を秒速へ直し、距離÷秒速で秒数を求めます。"}, {"title": "順番に計算する", "text": "72km/時 = 72000m ÷ 3600秒 = 20m/秒\n時間：240 ÷ 20 = 12秒"}, {"title": "答えを確かめる", "text": "20 × 12 = 240m。列車の長さだけ進めています。"}]}, {"id": "q472", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "長さ180mの列車が秒速25mで、長さ600mのトンネルを完全に通り抜けます。先頭が入り始めてから最後尾が出るまで何秒ですか。", "choices": ["156/5秒", "157/5秒", "158/5秒", "31秒"], "answer": 0, "explanation": "1. 条件を整理する\n必要な移動距離はトンネルの長さと列車の長さの合計です。\n\n2. 式を立てる理由\n先頭が出口に達しただけでは最後尾が残ります。列車の長さ分も足します。\n\n3. 順番に計算する\n移動距離：600+180 = 780m\n時間：780 ÷ 25 = 156/5（31.2）秒\n\n4. 答えを確かめる\n156/5秒で先頭は780m進み、最後尾も出口に達します。", "tip": "完全通過では列車の長さを忘れないようにします。", "steps": [{"title": "条件を整理する", "text": "必要な移動距離はトンネルの長さと列車の長さの合計です。"}, {"title": "式を立てる理由", "text": "先頭が出口に達しただけでは最後尾が残ります。列車の長さ分も足します。"}, {"title": "順番に計算する", "text": "移動距離：600+180 = 780m\n時間：780 ÷ 25 = 156/5（31.2）秒"}, {"title": "答えを確かめる", "text": "156/5秒で先頭は780m進み、最後尾も出口に達します。"}]}, {"id": "q473", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "静水時の速さが時速15kmの船が、時速3kmの流れを下ります。60km下るのに何時間かかりますか。", "choices": ["11/3時間", "4時間", "3時間", "10/3時間"], "answer": 3, "explanation": "1. 条件を整理する\n川の流れと同じ方向なので、地上から見た速さは船の速さと流れの速さの和です。\n\n2. 式を立てる理由\n下りは流れに押される分だけ速くなります。距離を合成した速さで割ります。\n\n3. 順番に計算する\n下りの速さ：15+3 = 18km/時\n時間：60 ÷ 18 = 10/3時間\n\n4. 答えを確かめる\n18 × 10/3 = 60kmです。静水時だけで割った場合より短い時間になります。", "tip": "下りは足し、上りは引きます。", "steps": [{"title": "条件を整理する", "text": "川の流れと同じ方向なので、地上から見た速さは船の速さと流れの速さの和です。"}, {"title": "式を立てる理由", "text": "下りは流れに押される分だけ速くなります。距離を合成した速さで割ります。"}, {"title": "順番に計算する", "text": "下りの速さ：15+3 = 18km/時\n時間：60 ÷ 18 = 10/3時間"}, {"title": "答えを確かめる", "text": "18 × 10/3 = 60kmです。静水時だけで割った場合より短い時間になります。"}]}, {"id": "q474", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "静水時の速さが時速12kmの船が、時速2kmの流れに逆らって30km上ります。何時間かかりますか。", "choices": ["4時間", "5時間", "3時間", "2時間"], "answer": 2, "explanation": "1. 条件を整理する\n上りでは川の流れの分だけ、地上から見た進む速さが遅くなります。\n\n2. 式を立てる理由\n有効な速さは静水時の速さ−流速。距離をこの速さで割ります。\n\n3. 順番に計算する\n上りの速さ：12−2 = 10km/時\n時間：30 ÷ 10 = 3時間\n\n4. 答えを確かめる\n10 × 3 = 30km。流れがある分、静水時の5/2時間より長くなります。", "tip": "流れに逆らう場合に速さを足さないよう注意します。", "steps": [{"title": "条件を整理する", "text": "上りでは川の流れの分だけ、地上から見た進む速さが遅くなります。"}, {"title": "式を立てる理由", "text": "有効な速さは静水時の速さ−流速。距離をこの速さで割ります。"}, {"title": "順番に計算する", "text": "上りの速さ：12−2 = 10km/時\n時間：30 ÷ 10 = 3時間"}, {"title": "答えを確かめる", "text": "10 × 3 = 30km。流れがある分、静水時の5/2時間より長くなります。"}]}, {"id": "q475", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "Aは時速5kmで出発し、その30分後にBが同じ場所から同じ道を時速7kmで追いかけます。Bが出発してから何分後に追いつきますか。", "choices": ["85分", "75分", "95分", "65分"], "answer": 1, "explanation": "1. 条件を整理する\nBの出発時にAが先に進んだ距離は5×1/2＝5/2（2.5）kmです。\n\n2. 式を立てる理由\n先行距離を速さの差で割ります。求める時間の起点はAではなくBの出発です。\n\n3. 順番に計算する\n速さの差：7−5 = 2km/時\n時間：5/2 ÷ 2 = 5/4（1.25）時間\n分へ換算：5/4×60 = 75分\n\n4. 答えを確かめる\nBが走った距離7×5/4と、Aが先行分を含めて進んだ5×(5/4+1/2)は等しくなります。", "tip": "「誰が出発してから」かを確認します。", "steps": [{"title": "条件を整理する", "text": "Bの出発時にAが先に進んだ距離は5×1/2＝5/2（2.5）kmです。"}, {"title": "式を立てる理由", "text": "先行距離を速さの差で割ります。求める時間の起点はAではなくBの出発です。"}, {"title": "順番に計算する", "text": "速さの差：7−5 = 2km/時\n時間：5/2 ÷ 2 = 5/4（1.25）時間\n分へ換算：5/4×60 = 75分"}, {"title": "答えを確かめる", "text": "Bが走った距離7×5/4と、Aが先行分を含めて進んだ5×(5/4+1/2)は等しくなります。"}]}, {"id": "q476", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "1周400mのコースを、Aは分速80m、Bは分速60mで同じ場所から同じ方向に同時に走り始めます。Aが初めてBに1周差をつけるのは何分後ですか。", "choices": ["20分", "21分", "22分", "19分"], "answer": 0, "explanation": "1. 条件を整理する\n1周差をつけるには、AがBより400m多く進む必要があります。\n\n2. 式を立てる理由\n1分で差が20m広がります。コース1周分の差を速さの差で割ります。\n\n3. 順番に計算する\n差の広がる速さ：80−60 = 20m/分\n時間：400 ÷ 20 = 20分\n\n4. 答えを確かめる\n進んだ距離の差は(80−60)×20 = 400mで、ちょうど1周です。", "tip": "同方向の周回では1周分の距離を速さの差で割ります。", "steps": [{"title": "条件を整理する", "text": "1周差をつけるには、AがBより400m多く進む必要があります。"}, {"title": "式を立てる理由", "text": "1分で差が20m広がります。コース1周分の差を速さの差で割ります。"}, {"title": "順番に計算する", "text": "差の広がる速さ：80−60 = 20m/分\n時間：400 ÷ 20 = 20分"}, {"title": "答えを確かめる", "text": "進んだ距離の差は(80−60)×20 = 400mで、ちょうど1周です。"}]}, {"id": "q477", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "全長18kmの道を、前半の距離は時速4km、後半の距離は時速6kmで進みます。全体で何時間かかりますか。", "choices": ["4時間", "17/4時間", "7/2時間", "15/4時間"], "answer": 3, "explanation": "1. 条件を整理する\n前半・後半は時間ではなく距離を半分に分けています。各区間は9kmです。\n\n2. 式を立てる理由\n各区間の距離÷速さで時間を出し、合計します。速さの単純平均は使いません。\n\n3. 順番に計算する\n前半：9 ÷ 4 = 9/4（2.25）時間\n後半：9 ÷ 6 = 3/2（1.5）時間\n合計：9/4+3/2 = 15/4（3.75）時間\n\n4. 答えを確かめる\n平均の速さは18 ÷ 15/4 = 24/5km/時。4と6の間で、遅い区間の影響が大きくなります。", "tip": "区間ごとの時間を足してから平均を考えます。", "steps": [{"title": "条件を整理する", "text": "前半・後半は時間ではなく距離を半分に分けています。各区間は9kmです。"}, {"title": "式を立てる理由", "text": "各区間の距離÷速さで時間を出し、合計します。速さの単純平均は使いません。"}, {"title": "順番に計算する", "text": "前半：9 ÷ 4 = 9/4（2.25）時間\n後半：9 ÷ 6 = 3/2（1.5）時間\n合計：9/4+3/2 = 15/4（3.75）時間"}, {"title": "答えを確かめる", "text": "平均の速さは18 ÷ 15/4 = 24/5km/時。4と6の間で、遅い区間の影響が大きくなります。"}]}, {"id": "q478", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "9kmの道を時速6kmで進み、途中で15分休憩しました。出発から到着まで何分ですか。", "choices": ["115分", "125分", "105分", "95分"], "answer": 2, "explanation": "1. 条件を整理する\n移動に掛かる時間と休憩時間を別々に計算します。\n\n2. 式を立てる理由\n休憩中は距離が増えませんが、所要時間には含めます。時間の単位を分にそろえて足します。\n\n3. 順番に計算する\n移動：9 ÷ 6時間 = 90分\n所要時間：90+15 = 105分\n\n4. 答えを確かめる\n休憩15分を引くと90分＝3/2時間。時速6kmで9km進みます。", "tip": "移動時間だけと、休憩込みの所要時間を区別します。", "steps": [{"title": "条件を整理する", "text": "移動に掛かる時間と休憩時間を別々に計算します。"}, {"title": "式を立てる理由", "text": "休憩中は距離が増えませんが、所要時間には含めます。時間の単位を分にそろえて足します。"}, {"title": "順番に計算する", "text": "移動：9 ÷ 6時間 = 90分\n所要時間：90+15 = 105分"}, {"title": "答えを確かめる", "text": "休憩15分を引くと90分＝3/2時間。時速6kmで9km進みます。"}]}, {"id": "q479", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "同じ船の下りの速さは時速24km、上りの速さは時速18kmです。静水時の速さは一定とすると、川の流速は時速何kmですか。", "choices": ["4km", "3km", "5km", "2km"], "answer": 1, "explanation": "1. 条件を整理する\n下り＝静水時＋流速、上り＝静水時−流速です。\n\n2. 式を立てる理由\n二つの速さを引くと、静水時の速さが消えて流速2個分になります。\n\n3. 順番に計算する\n下り−上り：24−18 = 6km/時\n流速：6 ÷ 2 = 3km/時\n\n4. 答えを確かめる\n静水時は(24+18)÷2 = 21km/時。これに流速3を足すと24、引くと18です。", "tip": "下りと上りの差は流速の2倍です。", "steps": [{"title": "条件を整理する", "text": "下り＝静水時＋流速、上り＝静水時−流速です。"}, {"title": "式を立てる理由", "text": "二つの速さを引くと、静水時の速さが消えて流速2個分になります。"}, {"title": "順番に計算する", "text": "下り−上り：24−18 = 6km/時\n流速：6 ÷ 2 = 3km/時"}, {"title": "答えを確かめる", "text": "静水時は(24+18)÷2 = 21km/時。これに流速3を足すと24、引くと18です。"}]}, {"id": "q480", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "自転車で最初の12kmを20分、次の9kmを30分で走りました。全体の平均の速さは時速何kmですか。", "choices": ["126/5km", "127/5km", "128/5km", "25km"], "answer": 0, "explanation": "1. 条件を整理する\n総距離21km、総時間50分です。\n\n2. 式を立てる理由\n平均の速さは総距離÷総時間。区間ごとの速さを平均するのではありません。\n\n3. 順番に計算する\n総時間：50分 = 50/60 = 5/6時間\n平均：21 ÷ (5/6)\n= 21×6/5 = 126/5（25.2）km/時\n\n4. 答えを確かめる\n答えの速さで5/6時間進むと126/5×5/6＝21kmになり、総距離と一致します。", "tip": "分数で割るときは逆数を掛けます。", "steps": [{"title": "条件を整理する", "text": "総距離21km、総時間50分です。"}, {"title": "式を立てる理由", "text": "平均の速さは総距離÷総時間。区間ごとの速さを平均するのではありません。"}, {"title": "順番に計算する", "text": "総時間：50分 = 50/60 = 5/6時間\n平均：21 ÷ (5/6)\n= 21×6/5 = 126/5（25.2）km/時"}, {"title": "答えを確かめる", "text": "答えの速さで5/6時間進むと126/5×5/6＝21kmになり、総距離と一致します。"}]}, {"id": "q481", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "Aだけなら12日、Bだけなら6日かかる仕事です。Aが先に3日作業し、その後はAとBが一緒に作業します。2人での作業には何日かかりますか。", "choices": ["4日", "5日", "2日", "3日"], "answer": 3, "explanation": "1. 条件を整理する\nAが最初に終えるのは全体の3/12。残りを2人で分担します。\n\n2. 式を立てる理由\n残量÷2人の1日分で、合流後の日数を求めます。最初の3日は答えに含めません。\n\n3. 順番に計算する\n残り：1−3/12 = 3/4\n2人の1日分：1/12+1/6 = 1/4\n合流後：3/4 ÷ 1/4 = 3日\n\n4. 答えを確かめる\n3/12 + 3×(1/12+1/6) = 1となり、全体が完成します。", "tip": "誰がいつ参加するか、時間軸を分けて整理します。", "steps": [{"title": "条件を整理する", "text": "Aが最初に終えるのは全体の3/12。残りを2人で分担します。"}, {"title": "式を立てる理由", "text": "残量÷2人の1日分で、合流後の日数を求めます。最初の3日は答えに含めません。"}, {"title": "順番に計算する", "text": "残り：1−3/12 = 3/4\n2人の1日分：1/12+1/6 = 1/4\n合流後：3/4 ÷ 1/4 = 3日"}, {"title": "答えを確かめる", "text": "3/12 + 3×(1/12+1/6) = 1となり、全体が完成します。"}]}, {"id": "q482", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "Aだけなら12日、AとBの2人なら4日で終わる仕事があります。Bだけなら何日で終わりますか。", "choices": ["7日", "8日", "6日", "5日"], "answer": 2, "explanation": "1. 条件を整理する\n分かるのはA単独の速さと、2人の合計の速さです。\n\n2. 式を立てる理由\nBの1日分＝2人の1日分−Aの1日分。日数同士を引くのではありません。\n\n3. 順番に計算する\nBの1日分：1/4−1/12 = 1/6\nBの日数：1 ÷ 1/6 = 6日\n\n4. 答えを確かめる\n1/12+1/6 = 1/4となり、2人で4日の条件に戻ります。", "tip": "引くのは必要日数ではなく、1日あたりの仕事量です。", "steps": [{"title": "条件を整理する", "text": "分かるのはA単独の速さと、2人の合計の速さです。"}, {"title": "式を立てる理由", "text": "Bの1日分＝2人の1日分−Aの1日分。日数同士を引くのではありません。"}, {"title": "順番に計算する", "text": "Bの1日分：1/4−1/12 = 1/6\nBの日数：1 ÷ 1/6 = 6日"}, {"title": "答えを確かめる", "text": "1/12+1/6 = 1/4となり、2人で4日の条件に戻ります。"}]}, {"id": "q483", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "6人で10日かかる仕事を、最初の4日は6人で行い、残りを9人で行います。増員後は何日必要ですか。全員の効率は同じとします。", "choices": ["5日", "4日", "6日", "3日"], "answer": 1, "explanation": "1. 条件を整理する\n全体は60人日。最初の4日に24人日を終えています。\n\n2. 式を立てる理由\n残った人日を新しい人数で割ります。初めから増員していたわけではありません。\n\n3. 順番に計算する\n残量：60−24 = 36人日\n増員後：36 ÷ 9 = 4日\n\n4. 答えを確かめる\n最初の24人日＋増員後の9×4人日＝全体60人日です。", "tip": "途中で人数が変わるときは、残った仕事量から再計算します。", "steps": [{"title": "条件を整理する", "text": "全体は60人日。最初の4日に24人日を終えています。"}, {"title": "式を立てる理由", "text": "残った人日を新しい人数で割ります。初めから増員していたわけではありません。"}, {"title": "順番に計算する", "text": "残量：60−24 = 36人日\n増員後：36 ÷ 9 = 4日"}, {"title": "答えを確かめる", "text": "最初の24人日＋増員後の9×4人日＝全体60人日です。"}]}, {"id": "q484", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "Aだけなら12日、Bだけなら6日、Cだけなら4日で終わる仕事があります。3人で同時に始めると何日かかりますか。", "choices": ["2日", "3日", "4日", "1日"], "answer": 0, "explanation": "1. 条件を整理する\n各人の1日分は1/12、1/6、1/4です。\n\n2. 式を立てる理由\n同時に働くので、1日分を3人分足してから全体1を割ります。\n\n3. 順番に計算する\n1日分：1/12+1/6+1/4 = 1/2\n日数：1 ÷ 1/2 = 2日\n\n4. 答えを確かめる\n2×(1/12+1/6+1/4)＝1。最も速い1人だけのときより短くなります。", "tip": "人数が増えても、足すのは日数ではなく作業速度です。", "steps": [{"title": "条件を整理する", "text": "各人の1日分は1/12、1/6、1/4です。"}, {"title": "式を立てる理由", "text": "同時に働くので、1日分を3人分足してから全体1を割ります。"}, {"title": "順番に計算する", "text": "1日分：1/12+1/6+1/4 = 1/2\n日数：1 ÷ 1/2 = 2日"}, {"title": "答えを確かめる", "text": "2×(1/12+1/6+1/4)＝1。最も速い1人だけのときより短くなります。"}]}, {"id": "q485", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "データ120件を処理します。Aは1時間に20件、Bは1時間に10件を処理できます。重複なく同時に作業すると何時間で終わりますか。", "choices": ["5時間", "6時間", "3時間", "4時間"], "answer": 3, "explanation": "1. 条件を整理する\n全体120件、合計速度は1時間30件です。\n\n2. 式を立てる理由\n仕事量が件数で与えられているので、全体を1に置き直さなくても計算できます。\n\n3. 順番に計算する\n合計速度：20+10 = 30件/時\n時間：120 ÷ 30 = 4時間\n\n4. 答えを確かめる\nAの処理80件とBの処理40件の合計が120件です。", "tip": "具体的な処理数があるときはそのまま利用できます。", "steps": [{"title": "条件を整理する", "text": "全体120件、合計速度は1時間30件です。"}, {"title": "式を立てる理由", "text": "仕事量が件数で与えられているので、全体を1に置き直さなくても計算できます。"}, {"title": "順番に計算する", "text": "合計速度：20+10 = 30件/時\n時間：120 ÷ 30 = 4時間"}, {"title": "答えを確かめる", "text": "Aの処理80件とBの処理40件の合計が120件です。"}]}, {"id": "q486", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "通常は1人で8時間かかる作業があります。作業効率が通常の1.5倍になった場合、何時間かかりますか。", "choices": ["17/3時間", "6時間", "16/3時間", "5時間"], "answer": 2, "explanation": "1. 条件を整理する\n仕事量は一定で、1時間あたりに進む量が1.5倍になります。\n\n2. 式を立てる理由\n速さが1.5倍なら時間は1/1.5倍です。時間を1.5倍にしないようにします。\n\n3. 順番に計算する\n新しい時間：8 ÷ 1.5\n= 8 × 2/3 = 16/3時間\n\n4. 答えを確かめる\n新時間16/3 × 速度倍率1.5 = 8で、元と同じ仕事量になります。", "tip": "効率と時間は反比例します。", "steps": [{"title": "条件を整理する", "text": "仕事量は一定で、1時間あたりに進む量が1.5倍になります。"}, {"title": "式を立てる理由", "text": "速さが1.5倍なら時間は1/1.5倍です。時間を1.5倍にしないようにします。"}, {"title": "順番に計算する", "text": "新しい時間：8 ÷ 1.5\n= 8 × 2/3 = 16/3時間"}, {"title": "答えを確かめる", "text": "新時間16/3 × 速度倍率1.5 = 8で、元と同じ仕事量になります。"}]}, {"id": "q487", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "空の水槽を満たすのに給水管1本で6時間かかります。同じ速さで給水すると、水槽の3/4までためるには何時間ですか。", "choices": ["5時間", "9/2時間", "11/2時間", "4時間"], "answer": 1, "explanation": "1. 条件を整理する\n満水を1とすると、目標はその3/4です。\n\n2. 式を立てる理由\n給水速度が一定なら、水量に比例して時間も変わります。満水までの時間に3/4を掛けます。\n\n3. 順番に計算する\n必要時間：6 × 3/4 = 9/2（4.5）時間\n\n4. 答えを確かめる\n9/2 ÷ 6 = 3/4なので、満水の3/4まで給水できます。", "tip": "必要量が全体の何倍かで時間を調整します。", "steps": [{"title": "条件を整理する", "text": "満水を1とすると、目標はその3/4です。"}, {"title": "式を立てる理由", "text": "給水速度が一定なら、水量に比例して時間も変わります。満水までの時間に3/4を掛けます。"}, {"title": "順番に計算する", "text": "必要時間：6 × 3/4 = 9/2（4.5）時間"}, {"title": "答えを確かめる", "text": "9/2 ÷ 6 = 3/4なので、満水の3/4まで給水できます。"}]}, {"id": "q488", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "給水だけなら4時間、排水だけなら8時間で満水・空になる水槽です。空から給水を始め、1時間後に排水も始めます。排水を始めてから満水まで何時間かかりますか。", "choices": ["6時間", "7時間", "8時間", "5時間"], "answer": 0, "explanation": "1. 条件を整理する\n排水開始時には全体の1/4がたまっています。それ以降の正味給水量は1/4−1/8です。\n\n2. 式を立てる理由\n開始前と開始後で水の増え方が違います。残量を開始後の速度で割ります。\n\n3. 順番に計算する\n残量：1−1/4 = 3/4\n正味速度：1/4−1/8 = 1/8\n時間：3/4 ÷ (1/8) = 6時間\n\n4. 答えを確かめる\n先にためた1/4と、その後の6×1/8を足すと1で満水です。", "tip": "後から排水が加わる場合も、時間帯を分けます。", "steps": [{"title": "条件を整理する", "text": "排水開始時には全体の1/4がたまっています。それ以降の正味給水量は1/4−1/8です。"}, {"title": "式を立てる理由", "text": "開始前と開始後で水の増え方が違います。残量を開始後の速度で割ります。"}, {"title": "順番に計算する", "text": "残量：1−1/4 = 3/4\n正味速度：1/4−1/8 = 1/8\n時間：3/4 ÷ (1/8) = 6時間"}, {"title": "答えを確かめる", "text": "先にためた1/4と、その後の6×1/8を足すと1で満水です。"}]}, {"id": "q489", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "同じ効率の作業員が、合計180人日分の作業を6日以内に終えたいと考えています。毎日同じ人数なら最低何人必要ですか。", "choices": ["40人", "50人", "20人", "30人"], "answer": 3, "explanation": "1. 条件を整理する\n全作業量は180人日、期限は6日です。\n\n2. 式を立てる理由\n人数×日数＝人日。全人日を使える日数で割ると必要人数が分かります。\n\n3. 順番に計算する\n必要人数：180 ÷ 6 = 30人\n\n4. 答えを確かめる\n30人なら6日で180人日。1人減らすと6人日不足するので最低人数です。", "tip": "人日は「何人が何日働く量か」を表します。", "steps": [{"title": "条件を整理する", "text": "全作業量は180人日、期限は6日です。"}, {"title": "式を立てる理由", "text": "人数×日数＝人日。全人日を使える日数で割ると必要人数が分かります。"}, {"title": "順番に計算する", "text": "必要人数：180 ÷ 6 = 30人"}, {"title": "答えを確かめる", "text": "30人なら6日で180人日。1人減らすと6人日不足するので最低人数です。"}]}, {"id": "q490", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "Aだけなら10日、Bだけなら15日かかる仕事を、2人で2日行いました。残っている仕事は全体のどれだけですか。分数で選んでください。", "choices": ["1", "4/3", "2/3", "1/3"], "answer": 2, "explanation": "1. 条件を整理する\n全体を1と置きます。求めるのは日数ではなく残りの割合です。\n\n2. 式を立てる理由\n1日の合計仕事量に作業日数を掛け、全体1から引きます。\n\n3. 順番に計算する\n1日分：1/10+1/15 = 1/6\n完了：2×1/6 = 1/3\n残り：1−1/3 = 2/3\n\n4. 答えを確かめる\n完了割合1/3と残り2/3を足して1になります。", "tip": "「終えた量」と「残った量」を取り違えないようにします。", "steps": [{"title": "条件を整理する", "text": "全体を1と置きます。求めるのは日数ではなく残りの割合です。"}, {"title": "式を立てる理由", "text": "1日の合計仕事量に作業日数を掛け、全体1から引きます。"}, {"title": "順番に計算する", "text": "1日分：1/10+1/15 = 1/6\n完了：2×1/6 = 1/3\n残り：1−1/3 = 2/3"}, {"title": "答えを確かめる", "text": "完了割合1/3と残り2/3を足して1になります。"}]}, {"id": "q491", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "Aだけなら18日、Bだけなら9日かかる仕事です。Aが先に3日作業し、その後はAとBが一緒に作業します。2人での作業には何日かかりますか。", "choices": ["6日", "5日", "7日", "4日"], "answer": 1, "explanation": "1. 条件を整理する\nAが最初に終えるのは全体の3/18。残りを2人で分担します。\n\n2. 式を立てる理由\n残量÷2人の1日分で、合流後の日数を求めます。最初の3日は答えに含めません。\n\n3. 順番に計算する\n残り：1−3/18 = 5/6\n2人の1日分：1/18+1/9 = 1/6\n合流後：5/6 ÷ 1/6 = 5日\n\n4. 答えを確かめる\n3/18 + 5×(1/18+1/9) = 1となり、全体が完成します。", "tip": "誰がいつ参加するか、時間軸を分けて整理します。", "steps": [{"title": "条件を整理する", "text": "Aが最初に終えるのは全体の3/18。残りを2人で分担します。"}, {"title": "式を立てる理由", "text": "残量÷2人の1日分で、合流後の日数を求めます。最初の3日は答えに含めません。"}, {"title": "順番に計算する", "text": "残り：1−3/18 = 5/6\n2人の1日分：1/18+1/9 = 1/6\n合流後：5/6 ÷ 1/6 = 5日"}, {"title": "答えを確かめる", "text": "3/18 + 5×(1/18+1/9) = 1となり、全体が完成します。"}]}, {"id": "q492", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "Aだけなら18日、AとBの2人なら6日で終わる仕事があります。Bだけなら何日で終わりますか。", "choices": ["9日", "10日", "11日", "8日"], "answer": 0, "explanation": "1. 条件を整理する\n分かるのはA単独の速さと、2人の合計の速さです。\n\n2. 式を立てる理由\nBの1日分＝2人の1日分−Aの1日分。日数同士を引くのではありません。\n\n3. 順番に計算する\nBの1日分：1/6−1/18 = 1/9\nBの日数：1 ÷ 1/9 = 9日\n\n4. 答えを確かめる\n1/18+1/9 = 1/6となり、2人で6日の条件に戻ります。", "tip": "引くのは必要日数ではなく、1日あたりの仕事量です。", "steps": [{"title": "条件を整理する", "text": "分かるのはA単独の速さと、2人の合計の速さです。"}, {"title": "式を立てる理由", "text": "Bの1日分＝2人の1日分−Aの1日分。日数同士を引くのではありません。"}, {"title": "順番に計算する", "text": "Bの1日分：1/6 はそのまま利用できます。", "steps": [{"title": "条件を整理する", "text": "全体180件、合計速度は1時間30件です。"}, {"title": "式を立てる理由", "text": "仕事量が件数で与えられているので、全体を1に置き直さなくても計算できます。"}, {"title": "順番に計算する", "text": "合計速度：20+10 = 30件/時\n時間：180 ÷ 30 = 6時間"}, {"title": "答えを確かめる", "text": "Aの処理120件とBの処理60件の合計が180件です。"}]}, {"id": "q496", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "通常は1人で12時間かかる作業があります。作業効率が通常の1.5倍になった場合、何時間かかりますか。", "choices": ["8時間", "9時間", "10時間", "7時間"], "answer": 0, "explanation": "1. 条件を整理する\n仕事量は一定で、1時間あたりに進む量が1.5倍になります。\n\n2. 式を立てる理由\n速さが1.5倍なら時間は1/1.5倍です。時間を1.5倍にしないようにします。\n\n3. 順番に計算する\n新しい時間：12 ÷ 1.5\n= 12 × 2/3 = 8時間\n\n4. 答えを確かめる\n新時間8 × 速度倍率1.5 = 12で、元と同じ仕事量になります。", "tip": "効率と時間は反比例します。", "steps": [{"title": "条件を整理する", "text": "仕事量は一定で、1時間あたりに進む量が1.5倍になります。"}, {"title": "式を立てる理由", "text": "速さが1.5倍なら時間は1/1.5倍です。時間を1.5倍にしないようにします。"}, {"title": "順番に計算する", "text": "新しい時間：12 ÷ 1.5\n= 12 × 2/3 = 8時間"}, {"title": "答えを確かめる", "text": "新時間8 × 速度倍率1.5 = 12で、元と同じ仕事量になります。"}]}, {"id": "q497", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "空の水槽を満たすのに給水管1本で8時間かかります。同じ速さで給水すると、水槽の3/4までためるには何時間ですか。", "choices": ["7時間", "8時間", "5時間", "6時間"], "answer": 3, "explanation": "1. 条件を整理する\n満水を1とすると、目標はその3/4です。\n\n2. 式を立てる理由\n給水速度が一定なら、水量に比例して時間も変わります。満水までの時間に3/4を掛けます。\n\n3. 順番に計算する\n必要時間：8 × 3/4 = 6時間\n\n4. 答えを確かめる\n6 ÷ 8 = 3/4なので、満水の3/4まで給水できます。", "tip": "必要量が全体の何倍かで時間を調整します。", "steps": [{"title": "条件を整理する", "text": "満水を1とすると、目標はその3/4です。"}, {"title": "式を立てる理由", "text": "給水速度が一定なら、水量に比例して時間も変わります。満水までの時間に3/4を掛けます。"}, {"title": "順番に計算する", "text": "必要時間：8 × 3/4 = 6時間"}, {"title": "答えを確かめる", "text": "6 ÷ 8 = 3/4なので、満水の3/4まで給水できます。"}]}, {"id": "q498", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "給水だけなら4時間、排水だけなら8時間で満水・空になる水槽です。空から給水を始め、2時間後に排水も始めます。排水を始めてから満水まで何時間かかりますか。", "choices": ["5時間", "6時間", "4時間", "3時間"], "answer": 2, "explanation": "1. 条件を整理する\n排水開始時には全体の2/4がたまっています。それ以降の正味給水量は1/4−1/8です。\n\n2. 式を立てる理由\n開始前と開始後で水の増え方が違います。残量を開始後の速度で割ります。\n\n3. 順番に計算す "30人"], "answer": 3, "explanation": "1. 条件を整理する\n全体は「片方だけ」「両方」「どちらもなし」の重ならない3つに分かれます。\n\n2. 式を立てる理由\n全体から、分かっている2つのグループを引くと両方が残ります。\n\n3. 順番に計算する\n両方：100−50−20 = 30人\n\n4. 答えを確かめる\n50+30+20 = 100人で全体を再現します。", "tip": "重ならない内訳なら、そのまま足したり引いたりできます。", "steps": [{"title": "条件を整理する", "text": "全体は「片方だけ」「両方」「どちらもなし」の重ならない3つに分かれます。"}, {"title": "式を立てる理由", "text": "全体から、分かっている2つのグループを引くと両方が残ります。"}, {"title": "順番に計算する", "text": "両方：100−50−20 = 30人"}, {"title": "答えを確かめる", "text": "50+30+20 = 100人で全体を再現します。"}]}, {"id": "q502", "category": "非言語", "topic": "集合", "level": "標準", "prompt": "Aに30人、Bに25人、Cに20人が参加しています。AとB両方10人、BとC両方8人、CとA両方7人で、これらには3つすべてに参加する3人を含みます。少なくとも1つに参加する人は何人ですか。", "choices": ["63人", "73人", "53人", "43人"], "answer": 2, "explanation": "1. 条件を整理する\n3つの集合の合計から、2集合の重なりを引き、3集合の重なりを戻します。\n\n2. 式を立てる理由\n3つ全部の人は初め3回数え、2集合の重複を引くと3回引かれて0回になります。最後に1回足し戻します。\n\n3. 順番に計算する\n30+25+20−10−8−7+3\n= 53人\n\n4. 答えを確かめる\n3つ全部の1人の係数は3−3+1＝1。2つだけの人も2−1＝1で、全員1回ずつ数えています。", "tip": "2集合の重なりが3集合の人を含むか確認します。", "steps": [{"title": "条件を整理する", "text": "3つの集合の合計から、2集合の重なりを引き、3集合の重なりを戻します。"}, {"title": "式を立てる理由", "text": "3つ全部の人は初め3回数え、2集合の重複を引くと3回引かれて0回になります。最後に1回足し戻します。"}, {"title": "順番に計算する", "text": "30+25+20−10−8−7+3\n= 53人"}, {"title": "答えを確かめる", "text": "3つ全部の1人の係数は3−3+1＝1。2つだけの人も2−1＝1で、全員1回ずつ数えています。"}]}, {"id": "q503", "category": "非言語", "topic": "集合", "level": "標準", "prompt": "A講座に40人、AとBの両方に15人、AとCの両方に12人が参加しています。両方の人数には3講座すべての5人を含みます。Aだけに参加する人は何人ですか。", "choices": ["19人", "18人", "20人", "17人"], "answer": 1, "explanation": "1. 条件を整理する\nA全体から、Bにも属する人とCにも属する人を取り除きます。\n\n2. 式を立てる理由\n両方の重なりをそれぞれ引くと3講座の人を2回引きます。A全体には1回しか含まれないので、1回足し戻します。\n\n3. 順番に計算する\nAだけ：40−15−12+5 = 18人\n\n4. 答えを確かめる\nA内の内訳はAだけ18人、ABだけ10人、ACだけ7人、全部5人。合計40人です。", "tip": "3集合では「引きすぎ」を足し戻す必要があります。", "steps": [{"title": "条件を整理する", "text": "A全体から、Bにも属する人とCにも属する人を取り除きます。"}, {"title": "式を立てる理由", "text": "両方の重なりをそれぞれ引くと3講座の人を2回引きます。A全体には1回しか含まれないので、1回足し戻します。"}, {"title": "順番に計算する", "text": "Aだけ：40−15−12+5 = 18人"}, {"title": "答えを確かめる", "text": "A内の内訳はAだけ18人、ABだけ10人、ACだけ7人、全部5人。合計40人です。"}]}, {"id": "q504", "category": "非言語", "topic": "集合", "level": "標準", "prompt": "100人の集団でAが好きな人は70人、Bが好きな人は60人です。両方好きな人は少なくとも何人いますか。", "choices": ["30人", "40人", "50人", "20人"], "answer": 0, "explanation": "1. 条件を整理する\nAとBを足した人数は全体人数を超えています。超過分は必ず重なります。\n\n2. 式を立てる理由\n重なりが最小になるのは、一方以上が全体いっぱいを占める場合です。A+B−重なり≦全体を使います。\n\n3. 順番に計算する\n重なり ≧ 70+60−100 = 30人\n\n4. 答えを確かめる\n両方30人ならAだけ40人、Bだけ30人で合計100人。実現できるので最小値です。", "tip": "人数の最小・最大は、実現できる内訳も確かめます。", "steps": [{"title": "条件を整理する", "text": "AとBを足した人数は全体人数を超えています。超過分は必ず重なります。"}, {"title": "式を立てる理由", "text": "重なりが最小になるのは、一方以上が全体いっぱいを占める場合です。A+B−重なり≦全体を使います。"}, {"title": "順番に計算する", "text": "重なり ≧ 70+60−100 = 30人"}, {"title": "答えを確かめる", "text": "両方30人ならAだけ40人、Bだけ30人で合計100人。実現できるので最小値です。"}]}, {"id": "q505", "category": "非言語", "topic": "集合", "level": "標準", "prompt": "Aを利用する人は35人、Bを利用する人は50人です。全体人数に十分な余裕があるとき、両方利用する人は最大何人ですか。", "choices": ["45人", "55人", "25人", "35人"], "answer": 3, "explanation": "1. 条件を整理する\n両方の人数は、A全体もB全体も超えられません。\n\n2. 式を立てる理由\n小さい方の集合全員が大きい方にも含まれれば、重なりは最大になります。\n\n3. 順番に計算する\n最大重複 = 小さい方の人数 = 35人\n\n4. 答えを確かめる\nAの35人全員をBの50人の中に入れられます。それ以上はAの人数を超えるので不可能です。", "tip": "2集合の共通部分は小さい方の人数以下です。", "steps": [{"title": "条件を整理する", "text": "両方の人数は、A全体もB全体も超えられません。"}, {"title": "式を立てる理由", "text": "小さい方の集合全員が大きい方にも含まれれば、重なりは最大になります。"}, {"title": "順番に計算する", "text": "最大重複 = 小さい方の人数 = 35人"}, {"title": "答えを確かめる", "text": "Aの35人全員をBの50人の中に入れられます。それ以上はAの人数を超えるので不可能です。"}]}, {"id": "q506", "category": "非言語", "topic": "集合", "level": "標準", "prompt": "120人中、A利用者は60人、AとB両方の利用者は10人、どちらも利用しない人は20人です。B利用者は何人ですか。", "choices": ["60人", "70人", "50人", "40人"], "answer": 2, "explanation": "1. 条件を整理する\n一方以上の人数は全体−どちらもなしです。Bには両方の人も含みます。\n\n2. 式を立てる理由\n一方以上＝A+B−両方をBについて解きます。\n\n3. 順番に計算する\n一方以上：120−20 = 100人\nB：100−60+10 = 50人\n\n4. 答えを確かめる\nA+B−両方＝60+50−10 = 100人。どちらもなしを足すと全体120人です。", "tip": "未知の集合人数も、和集合の式から逆算できます。", "steps": [{"title": "条件を整理する", "text": "一方以上の人数は全体−どちらもなしです。Bには両方の人も含みます。"}, {"title": "式を立てる理由", "text": "一方以上＝A+B−両方をBについて解きます。"}, {"title": "順番に計算する", "text": "一方以上：120−20 = 100人\nB：100−60+10 = 50人"}, {"title": "答えを確かめる", "text": "A+B−両方＝60+50−10 = 100人。どちらもなしを足すと全体120人です。"}]}, {"id": "q507", "category": "非言語", "topic": "集合", "level": "標準", "prompt": "3講座についてAとB両方が14人、BとC両方が12人、CとA両方が10人です。いずれも3講座すべての4人を含みます。ちょうど2講座だけ受ける人は何人ですか。", "choices": ["25人", "24人", "26人", "23人"], "answer": 1, "explanation": "1. 条件を整理する\n各2集合の人数から、全部に属する人数をそれぞれ引きます。\n\n2. 式を立てる理由\n3講座の人はAB・BC・CAの3か所に数えられています。「ちょうど2つ」からは3回とも除きます。\n\n3. 順番に計算する\nABだけ：14−4 = 10人\nBCだけ：12−4 = 8人\nCAだけ：10−4 = 6人\n合計：24人\n\n4. 答えを確かめる\n3つの両方人数の合計36は、2講座だけ24人＋全部4人の3倍で再現できます。", "tip": "「ちょうど2つ」と「少なくとも2つ」は異なります。", "steps": [{"title": "条件を整理する", "text": "各2集合の人数から、全部に属する人数をそれぞれ引きます。"}, {"title": "式を立てる理由", "text": "3講座の人はAB・BC・CAの3か所に数えられています。「ちょうど2つ」からは3回とも除きます。"}, {"title": "順番に計算する", "text": "ABだけ：14−4 = 10人\nBCだけ：12−4 = 8人\nCAだけ：10−4 = 6人\n合計：24人"}, {"title": "答えを確かめる", "text": "3つの両方人数の合計36は、2講座だけ24人＋全部4人の3倍で再現できます。"}]}, {"id": "q508", "category": "非言語", "topic": "集合", "level": "標準", "prompt": "80人のうちA購読者が45人、B購読者が35人、両方が20人です。Aを購読していない人は何人ですか。", "choices": ["35人", "45人", "55人", "25人"], "answer": 0, "explanation": "1. 条件を整理する\nAを購読しない人には、Bだけの人と、どちらも購読しない人が含まれます。\n\n2. 式を立てる理由\nAかどうかだけを問うので、A全体を全体人数から引けば求まります。Bの数値は不要です。\n\n3. 順番に計算する\nA以外：80−45 = 35人\n\n4. 答えを確かめる\nBだけ15人と、どちらもなし20人を足しても35人です。", "tip": "すべての数値を使う必要はありません。", "steps": [{"title": "条件を整理する", "text": "Aを購読しない人には、Bだけの人と、どちらも購読しない人が含まれます。"}, {"title": "式を立てる理由", "text": "Aかどうかだけを問うので、A全体を全体人数から引けば求まります。Bの数値は不要です。"}, {"title": "順番に計算する", "text": "A以外：80−45 = 35人"}, {"title": "答えを確かめる", "text": "Bだけ15人と、どちらもなし20人を足しても35人です。"}]}, {"id": "q509", "category": "非言語", "topic": "集合", "level": "標準", "prompt": "60人のアンケートで、Aに賛成が40％、Bに賛成が50％、両方に賛成が20％でした。少なくとも一方に賛成する人は全体の何％ですか。", "choices": ["80％", "90％", "60％", "70％"], "answer": 3, "explanation": "1. 条件を整理する\n割合も人数と同じように、重複を1回引いて計算できます。\n\n2. 式を立てる理由\nAの割合＋Bの割合−両方の割合です。すべて同じ全体を基準としていることが条件です。\n }, {"id": "q538", "category": "非言語", "topic": "場合の数", "level": "標準", "prompt": "赤玉3個と青玉2個を一列に並べます。同じ色の玉は区別しません。色の並び方は何通りですか。", "choices": ["11通り", "12通り", "10通り", "9通り"], "answer": 2, "explanation": "1. 条件を整理する\n5個の位置のうち、赤を置く3か所が決まれば残りは青です。\n\n2. 式を立てる理由\n同じ色を入れ替えても同じ並びなので、色ごとの位置を組み合わせで数えます。\n\n3. 順番に計算する\n5個の位置から3か所を選ぶ\n= 5! ÷ (3!×2!) = 10通り\n\n4. 答えを確かめる\n青の2か所を選んでも同じ数になります。", "tip": "同じものを含む順列は、同じものの入れ替えを重複として除きます。", "steps": [{"title": "条件を整理する", "text": "5個の位置のうち、赤を置く3か所が決まれば残りは青です。"}, {"title": "式を立てる理由", "text": "同じ色を入れ替えても同じ並びなので、色ごとの位置を組み合わせで数えます。"}, {"title": "順番に計算する", "text": "5個の位置から3か所を選ぶ\n= 5! ÷ (3!×2!) = 10通り"}, {"title": "答えを確かめる", "text": "青の2か所を選んでも同じ数になります。"}]}, {"id": "q539", "category": "非言語", "topic": "場合の数", "level": "標準", "prompt": "6チームが総当たりで1回ずつ対戦します。試合は全部で何試合ですか。", "choices": ["16試合", "15試合", "17試合", "14試合"], "answer": 1, "explanation": "1. 条件を整理する\n1試合は異なる2チームの組です。ホーム・アウェーの区別はありません。\n\n2. 式を立てる理由\n各チームがn−1試合すると数えると同じ試合を両チーム側から2回数えるので2で割ります。\n\n3. 順番に計算する\n6×5 ÷ 2 = 15試合\n\n4. 答えを確かめる\n2チームの組み合わせを直接数える方法と一致します。", "tip": "相手との組だけなら順序を区別しません。", "steps": [{"title": "条件を整理する", "text": "1試合は異なる2チームの組です。ホーム・アウェーの区別はありません。"}, {"title": "式を立てる理由", "text": "各チームがn−1試合すると数えると同じ試合を両チーム側から2回数えるので2で割ります。"}, {"title": "順番に計算する", "text": "6×5 ÷ 2 = 15試合"}, {"title": "答えを確かめる", "text": "2チームの組み合わせを直接数える方法と一致します。"}]}, {"id": "q540", "category": "非言語", "topic": "場合の数", "level": "標準", "prompt": "7人から3人の代表グループを1つ選びます。ただしAとBを同時に含めません。選び方は何通りですか。", "choices": ["30通り", "40通り", "50通り", "20通り"], "answer": 0, "explanation": "1. 条件を整理する\n制限なしの3人の選び方から、AとBを両方含む場合を除きます。\n\n2. 式を立てる理由\nAとBが両方選ばれる場合、残り1人だけをn−2人から選べます。\n\n3. 順番に計算する\n全体：35通り\nA・B両方：5通り\n差：35−5 = 30通り\n\n4. 答えを確かめる\nAだけ・Bだけ・どちらもなしは残し、両方のケースだけを取り除いています。", "tip": "禁止条件のある選び方は、禁止される場合を全体から引きます。", "steps": [{"title": "条件を整理する", "text": "制限なしの3人の選び方から、AとBを両方含む場合を除きます。"}, {"title": "式を立てる理由", "text": "AとBが両方選ばれる場合、残り1人だけをn−2人から選べます。"}, {"title": "順番に計算する", "text": "全体：35通り\nA・B両方：5通り\n差：35−5 = 30通り"}, {"title": "答えを確かめる", "text": "Aだけ・Bだけ・どちらもなしは残し、両方のケースだけを取り除いています。"}]}, {"id": "q541", "category": "非言語", "topic": "確率", "level": "標準", "prompt": "公平な硬貨を3枚投げます。表がちょうど1枚になる確率はどれですか。", "choices": ["1/2", "5/8", "1/4", "3/8"], "answer": 3, "explanation": "1. 条件を整理する\n全部の出方は2の枚数乗。表の位置を1か所選びます。\n\n2. 式を立てる理由\n表が1枚という条件を満たすのは、どの硬貨だけが表かのn通りです。\n\n3. 順番に計算する\n全出方：2の3乗 = 8\n表1枚：3通り\n確率：3/8 = 3/8\n\n4. 答えを確かめる\nちょうど1枚では、表が2枚以上の出方は含めません。", "tip": "少なくとも1枚と、ちょうど1枚を区別します。", "steps": [{"title": "条件を整理する", "text": "全部の出方は2の枚数乗。表の位置を1か所選びます。"}, {"title": "式を立てる理由", "text": "表が1枚という条件を満たすのは、どの硬貨だけが表かのn通りです。"}, {"title": "順番に計算する", "text": "全出方：2の3乗 = 8\n表1枚：3通り\n確率：3/8 = 3/8"}, {"title": "答えを確かめる", "text": "ちょうど1枚では、表が2枚以上の出方は含めません。"}]}, {"id": "q542", "category": "非言語", "topic": "確率", "level": "標準", "prompt": "公平な硬貨を3枚投げます。少なくとも1枚が表になる確率はどれですか。", "choices": ["1", "3/4", "7/8", "5/8"], "answer": 2, "explanation": "1. 条件を整理する\n条件の反対は、全硬貨が裏になる場合だけです。\n\n2. 式を立てる理由\n全体の確率1から、すべて裏の確率を引きます。\n\n3. 順番に計算する\nすべて裏：1/8\n求める確率：1−1/8 = 7/8\n\n4. 答えを確かめる\n表が1枚・2枚・…・全枚の場合をまとめて含めています。", "tip": "少なくとも、の条件は余事象が短くなることがあります。", "steps": [{"title": "条件を整理する", "text": "条件の反対は、全硬貨が裏になる場合だけです。"}, {"title": "式を立てる理由", "text": "全体の確率1から、すべて裏の確率を引きます。"}, {"title": "順番に計算する", "text": "すべて裏：1/8\n求める確率：1−1/8 = 7/8"}, {"title": "答えを確かめる", "text": "表が1枚・2枚・…・全枚の場合をまとめて含めています。"}]}, {"id": "q543", "category": "非言語", "topic": "確率", "level": "標準", "prompt": "公平な6面サイコロを2個振ります。和が7以上になる確率はどれですか。", "choices": ["2/3", "7/12", "3/4", "1/2"], "answer": 1, "explanation": "1. 条件を整理する\n全部は36通り。「以上」なので和が指定値ちょうどの場合も含めます。\n\n2. 式を立てる理由\n和ごとの組数を数えて足し、36で割ります。\n\n3. 順番に計算する\n条件に合う組数：6 + 5 + 4 + 3 + 2 + 1 = 21\n確率：21/36 = 7/12\n\n4. 答えを確かめる\n条件に合わない和の組は15通り。足すと36通りになります。", "tip": "以上・超えるの違いで境界の組数が変わります。", "steps": [{"title": "条件を整理する", "text": "全部は36通り。「以上」なので和が指定値ちょうどの場合も含めます。"}, {"title": "式を立てる理由", "text": "和ごとの組数を数えて足し、36で割ります。"}, {"title": "順番に計算する", "text": "条件に合う組数：6 + 5 + 4 + 3 + 2 + 1 = 21\n確率：21/36 = 7/12"}, {"title": "答えを確かめる", "text": "条件に合わない和の組は15通り。足すと36通りになります。"}]}, {"id": "q544", "category": "非言語", "topic": "確率", "level": "標準", "prompt": "当たり2本を含む6本のくじから、戻さずに2本引きます。ちょうど1本が当たりの確率はどれですか。", "choices": ["8/15", "3/5", "2/3", "7/15"], "answer": 0, "explanation": "1. 条件を整理する\n当たり2本、はずれ4本です。片方が当たり、もう片方がはずれの組を数えます。\n\n2. 式を立てる理由\n順序を区別しない2本の組でそろえて、当たり1本×はずれ1本を数えます。\n\n3. 順番に計算する\n全2本組：15通り\n条件に合う組：2×4 = 8通り\n確率：8/15 = 8/15\n\n4. 答えを確かめる\n2本とも当たり・2本ともはずれの組を含まないことを確認します。", "tip": "取り出す順序を分子と分母でそろえます。", "steps": [{"title": "条件を整理する", "text": "当たり2本、はずれ4本です。片方が当たり、もう片方がはずれの組を数えます。"}, {"title": "式を立てる理由", "text": "順序を区別しない2本の組でそろえて、当たり1本×はずれ1本を数えます。"}, {"title": "順番に計算する", "text": "全2本組：15通り\n条件に合う組：2×4 = 8通り\n確率：8/15 = 8/15"}, {"title": "答えを確かめる", "text": "2本とも当たり・2本ともはずれの組を含まないことを確認します。"}]}, {"id": "q545", "category": "非言語", "topic": "確率", "level": "標準", "prompt": "赤玉2個、青玉3個の袋から1個取り出して色を確認し、袋に戻します。もう一度取り出すとき、2回とも赤の確率はどれですか。", "choices": ["1/5", "6/25", "3/25", "4/25"], "answer": 3, "explanation": "1. 条件を整理する\n毎回戻すので、2回目も袋の内訳は最初と同じです。\n\n2. 式を立てる理由\n各回の赤の確率はr/(r+b)で変化しません。その確率を2回掛けます。\n\n3. 順番に計算する\n2/5 × 2/5\n= 4/25 = 4/25\n\n4. 答えを確かめる\n戻さない場合と違い、2回目の分母や赤の個数を1減らしません。", "tip": "戻すか戻さないかで条件が変わります。", "steps": [{"title": "条件を整理する", "text": "毎回戻すので、2回目も袋の内訳は最初と同じです。"}, {"title": "式を立てる理由", "text": "各回の赤の確率はr/(r+b)で変化しません。その確率を2回掛けます。"}, {"title": "順番に計算する", "text": "2/5 × 2/5\n= 4/25 = 4/25"}, {"title": "答えを確かめる", "text": "戻さない場合と違い、2回目の分母や赤の個数を1減らしません。"}]}, {"id": "q546", "category": "非言語", "topic": "確率", "level": "標準", "prompt": "8本のくじに当たりが3本あります。戻さずに3本引くとき、少なくとも1本当たる確率はどれですか。", "choices": ["6/7", "25/28", "23/28", "11/14"], "answer": 2, "explanation": "1. 条件を整理する\nはずれは5本。逆の条件は3本ともはずれです。\n\n2. 式を立てる理由\n当たり本数を1・2・3と分けるより、全体から3本ともはずれを引きます。\n\n3. 順番に計算する\n全3本組：56通り\n全部はずれ：10通り\n確率：1−10/56 = 23/28\n\n4. 答えを確かめる\n当たりを含む組と含まない組は重ならず、全体を二分します。", "tip": "本数が増えた少なくとも、にも余事象が有効です。", "steps": [{"title": "条件を整理する", "text": "はずれは5本。逆の条件は3本ともはずれです。"}, {"title": "式を立てる理由", "text": "当たり本数を1・2・3と分けるより、全体から3本ともはずれを引き , "4位"], "answer": 3, "explanation": "1. 条件を整理する\n上位から矢印で関係をつなげます。部分的な関係を一つにまとめます。\n\n2. 式を立てる理由\n順序条件がすべてつながると、5人の位置が一意に定まります。\n\n3. 順番に計算する\n上位から：D → A → B → C → E\nCは先頭から4番目なので4位です。\n\n4. 答えを確かめる\nこの並びで各条件の左右を確認すると、指定されたすべての上下関係を満たします。", "tip": "同順位なしという条件を確認します。", "steps": [{"title": "条件を整理する", "text": "上位から矢印で関係をつなげます。部分的な関係を一つにまとめます。"}, {"title": "式を立てる理由", "text": "順序条件がすべてつながると、5人の位置が一意に定まります。"}, {"title": "順番に計算する", "text": "上位から：D → A → B → C → E\nCは先頭から4番目なので4位です。"}, {"title": "答えを確かめる", "text": "この並びで各条件の左右を確認すると、指定されたすべての上下関係を満たします。"}]}, {"id": "q562", "category": "非言語", "topic": "推論", "level": "標準", "prompt": "文化祭で、A・B・Cが広報・会計・受付を1つずつ担当し、兼任も重複もありません。Aは会計でも受付でもなく、Bは受付ではありません。Cの担当はどれですか。", "choices": ["広報", "会計", "受付", "条件だけでは決まらない"], "answer": 2, "explanation": "1. 条件を整理する\n1人1担当で、各仕事も1人だけです。\n\n2. 式を立てる理由\nAには2つの禁止条件があるため、まずAの担当を決めます。\n\n3. 順番に計算する\nAは広報。残りは会計と受付ですが、Bは受付ではないので会計。したがってCは受付です。\n\n4. 答えを確かめる\nA・B・Cに異なる3仕事が割り当てられ、すべての禁止条件を満たします。", "tip": "担当者と仕事の表を作り、不可能な組に×をつけると整理できます。", "steps": [{"title": "条件を整理する", "text": "1人1担当で、各仕事も1人だけです。"}, {"title": "式を立てる理由", "text": "Aには2つの禁止条件があるため、まずAの担当を決めます。"}, {"title": "順番に計算する", "text": "Aは広報。残りは会計と受付ですが、Bは受付ではないので会計。したがってCは受付です。"}, {"title": "答えを確かめる", "text": "A・B・Cに異なる3仕事が割り当てられ、すべての禁止条件を満たします。"}]}, {"id": "q563", "category": "非言語", "topic": "推論", "level": "標準", "prompt": "2点のカードと4点のカードを合わせて12枚持っています。合計は42点です。2点のカードは何枚ですか。", "choices": ["4枚", "3枚", "5枚", "2枚"], "answer": 1, "explanation": "1. 条件を整理する\n2点カードをx枚とすると4点カードは12−x枚です。\n\n2. 式を立てる理由\n枚数の合計と点数の合計を同時に満たす式を作ります。\n\n3. 順番に計算する\n2x + 4(12−x) = 42\n48−2x = 42\n2x = 6\nx = 3枚\n\n4. 答えを確かめる\n2点3枚と4点9枚で、枚数12枚・点数42点を再現します。", "tip": "一方をxと置くと、もう一方は全体−xです。", "steps": [{"title": "条件を整理する", "text": "2点カードをx枚とすると4点カードは12−x枚です。"}, {"title": "式を立てる理由", "text": "枚数の合計と点数の合計を同時に満たす式を作ります。"}, {"title": "順番に計算する", "text": "2x + 4(12−x) = 42\n48−2x = 42\n2x = 6\nx = 3枚"}, {"title": "答えを確かめる", "text": "2点3枚と4点9枚で、枚数12枚・点数42点を再現します。"}]}, {"id": "q564", "category": " tle": "順番に計算する", "text": "追加運賃：700−500 = 200円\n短縮時間：30−20 = 10分\n1分あたり：200 ÷ 10 = 20円"}, {"title": "答えを確かめる", "text": "1分あたり20円×短縮10分＝200円です。"}]}, {"id": "q586", "category": "非言語", "topic": "表の読み取り", "level": "標準", "prompt": "表は店舗の売上と売上に対する利益率です。2店舗の利益合計は何万円ですか。", "choices": ["140万円", "150万円", "130万円", "120万円"], "answer": 2, "explanation": "1. 条件を整理する\n売上そのものではなく、各店舗の売上に利益率を掛けた金額を合計します。\n\n2. 式を立てる理由\n利益＝売上×売上基準の利益率。利益率の単純平均では合計利益になりません。\n\n3. 順番に計算する\nX店：200×0.20 = 40万円\nY店：300×0.30 = 90万円\n合計：130万円\n\n4. 答えを確かめる\n売上基準と明記されているため、原価を逆算せず売上に掛けられます。", "tip": "利益率の表は、何を分母にした率か確認します。", "table": {"headers": ["店舗", "売上（万円）", "利益率（％・売上基準）"], "rows": [["X店", 200, 20], ["Y店", 300, 30]]}, "steps": [{"title": "条件を整理する", "text": "売上そのものではなく、各店舗の売上に利益率を掛けた金額を合計します。"}, {"title": "式を立てる理由", "text": "利益＝売上×売上基準の利益率。利益率の単純平均では合計利益になりません。"}, {"title": "順番に計算する", "text": "X店：200×0.20 = 40万円\nY店：300×0.30 = 90万円\n合計：130万円"}, {"title": "答えを確かめる", "text": "売上基準と明記されているため、原価を逆算せず売上に掛けられます。"}]}, {"id": "q587", "category": "非言語", "topic": "表の読み取り", "level": "標準", "prompt": "表の3か月の月平均生産数は何台ですか。", "choices": ["150台", "140台", "160台", "130台"], "answer": 1, "explanation": "1. 条件を整理する\n月ごとの生産数をすべて足し、月数3で割ります。\n\n2. 式を立てる理由\n各月を同じ1か月として扱う平均なので、個数の合計÷3です。\n\n3. 順番に計算する\n合計：100+140+180 = 420台\n平均：420 ÷ 3 = 140台\n\n4. 答えを確かめる\n3か月分をすべて140台とすると合計420台で元の合計と同じです。", "tip": "平均の対象となる期間数も確かめます。", "table": {"headers": ["月", "生産数（台）"], "rows": [["1月", 100], ["2月", 140], ["3月", 180]]}, "steps": [{"title": "条件を整理する", "text": "月ごとの生産数をすべて足し、月数3で割ります。"}, {"title": "式を立てる理由", "text": "各月を同じ1か月として扱う平均なので、個数の合計÷3です。"}, {"title": "順番に計算する", "text": "合計：100+140+180 = 420台\n平均：420 ÷ 3 = 140台"}, {"title": "答えを確かめる", "text": "3か月分をすべて140台とすると合計420台で元の合計と同じです。"}]}, {"id": "q588", "category": "非言語", "topic": "表の読み取り", "level": "標準", "prompt": "表は学校別の受験者と合格者です。A校の合格率は何％ですか。", "choices": ["75％", "85％", "95％", "65％"], "answer": 0, "explanation": "1. 条件を整理する\nA校の受験者は40人、合格者は30人です。\n\n2. 式を立てる理由\n合格率の基準はその学校の受験者数です。2校の受験者を足す必要は <script>
'use strict';
const Core = (() => {
  const VERSION = 1;
  const fresh = () => ({version: VERSION, records: {}, days: {}});
  const dayKey = (date = new Date()) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  const shuffle = (items, random = Math.random) => {
    const out = [...items];
    for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(random()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
    return out;
  };
  const needsReview = r => !!r && (!r.lastCorrect || r.unsure);
  const reviewPool = (questions, state) => questions.filter(q => needsReview(state.records[q.id]));
  function varied(pool, count, records, random) {
    const out=[], rest=shuffle(pool,random).sort((a,b)=>(records[a.id]?.attempts||0)-(records[b.id]?.attempts||0));
    const used=new Set();
    while(rest.length && out.length<count) {
      let i=rest.findIndex(q=>!used.has(q.topic));
      if(i<0) { used.clear(); i=0; }
      const [q]=rest.splice(i,1); used.add(q.topic); out.push(q);
    }
    return out;
  }
  function select(questions, state, {count=10, topic=null, mode='normal', ids=null}={}, random=Math.random) {
    let pool=topic ? questions.filter(q=>q.topic===topic) : [...questions];
    if(ids) { const set=new Set(ids); pool=pool.filter(q=>set.has(q.id)); }
    const n=count==='all'?pool.length:Math.min(Number(count),pool.length);
    if(mode==='review') return shuffle(reviewPool(pool,state),random).sort((a,b)=>(state.records[a.id].lastAt.localeCompare(state.records[b.id].lastAt))).slice(0,n);
    function choose(p,k) {
      const review=shuffle(reviewPool(p,state),random).sort((a,b)=>state.records[a.id].lastAt.localeCompare(state.records[b.id].lastAt));
      const chosen=review.slice(0,Math.min(Math.max(k>=3?1:0,Math.floor(k*.2)),review.length));
      const picked=new Set(chosen.map(q=>q.id));
      const unseen=p.filter(q=>!state.records[q.id]);
      chosen.push(...varied(unseen,k-chosen.length,state.records,random));
      chosen.forEach(q=>picked.add(q.id));
      chosen.push(...varied(p.filter(q=>!picked.has(q.id)),k-chosen.length,state.records,random));
      return chosen;
    }
    if(topic || ids) return shuffle(choose(pool,n),random);
    const verbal=pool.filter(q=>q.category==='言語'), math=pool.filter(q=>q.category==='非言語');
    const vn=Math.min(Math.round(n*.4),verbal.length), mn=Math.min(n-vn,math.length);
    const result=[...choose(verbal,vn),...choose(math,mn)];
    if(result.length<n) { const picked=new Set(result.map(q=>q.id)); result.push(...choose(pool.filter(q=>!picked.has(q.id)),n-result.length)); }
    return shuffle(result,random);
  }
  function record(state, id, correct, unsure, date=new Date()) {
    const old=state.records[id]||{attempts:0,correct:0};
    state.records[id]={attempts:old.attempts+1,correct:old.correct+(correct?1:0),lastCorrect:correct,unsure:!!unsure,lastAt:date.toISOString()};
    const key=dayKey(date), day=state.days[key]||{attempts:0,correct:0};
    state.days[key]={attempts:day.attempts+1,correct:day.correct+(correct?1:0)};
  }
  function totals(state, questions=null) {
    const keys=questions?questions.map(q=>q.id):Object.keys(state.records);
    return keys.reduce((a,id)=>{const r=state.records[id];if(r){a.attempts+=r.attempts;a.correct+=r.correct;a.seen++;if(needsReview(r))a.review++;}return a;},{attempts:0,correct:0,seen:0,review:0});
  }
  function validate(input, questions) {
    const isObject=x=>x!==null && typeof x==='object' && !Array.isArray(x);
    if(!isObject(input)||input.version!==VERSION||!isObject(input.records)||!isObject(input.days)) throw new Error('対応していない記録ファイルです。');
    const clean=fresh(), known=new Set(questions.map(q=>q.id));
    const int=n=>Number.isSafeInteger(n)&&n>=0&&n<=1e9;
    for(const [id,r] of Object.entries(input.records)) {
      if(!known.has(id)||!isObject(r)||!int(r.attempts)||r.attempts<1||!int(r.correct)||r.correct>r.attempts||typeof r.lastCorrect!=='boolean'||typeof r.unsure!=='boolean'||typeof r.lastAt!=='string'||!Number.isFinite(Date.parse(r.lastAt))) throw new Error('問題ごとの記録に不正な値があります。');
      if((r.lastCorrect && r.correct===0)||(!r.lastCorrect && r.correct===r.attempts)) throw new Error('正誤の記録が一致しません。');
      clean.records[id]={attempts:r.attempts,correct:r.correct,lastCorrect:r.lastCorrect,unsure:r.unsure,lastAt:r.lastAt};
    }
    for(const [day,r] of Object.entries(input.days)) {
      const d=new Date(day+'T12:00:00');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||!Number.isFinite(d.getTime())||dayKey(d)!==day||!isObject(r)||!int(r.attempts)||r.attempts<1||!int(r.correct)||r.correct>r.attempts) throw new Error('日ごとの記録に不正な値があります。');
      clean.days[day]={attempts:r.attempts,correct:r.correct};
    }
    const total=totals(clean), days=Object.values(clean.days).reduce((a,r)=>({attempts:a.attempts+r.attempts,correct:a.correct+r.correct}),{attempts:0,correct:0});
    if(total.attempts!==days.attempts||total.correct!==days.correct) throw new Error('問題別と日別の合計が一致しません。');
    return clean;
  }
  return {fresh,dayKey,shuffle,needsReview,reviewPool,select,record,totals,validate};
})();
if(typeof module!=='undefined' && module.exports) module.exports=Core;

</script>
<script>
'use strict';
(() => {
  const KEY='spi-practice-v1', app=document.getElementById('app');
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const paths={home:'M3 10l9-7 9 7v10H3z M9 20v-7h6v7',book:'M12 5v15 M3 4c4-1 6 0 9 2 3-2 5-3 9-2v14c-4-1-6 0-9 2-3-2-5-3-9-2z',chart:'M4 20V12 M12 20V4 M20 20V8',arrow:'M5 12h14 M13 6l6 6-6 6',refresh:'M20 7V3l-4 4a8 8 0 1 0 3 11 M20 7h-5',leaf:'M20 3C8 2 2 8 5 15s14 8 15-12z M5 20L16 8',check:'M5 12l4 4L19 6',back:'M19 12H5 M11 6l-6 6 6 6',cross:'M6 6l12 12 M18 6L6 18',download:'M12 3v12 M7 10l5 5 5-5 M4 16v5h16v-5'};
  const icon=name=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.book}"/></svg>`;
  let state=Core.fresh(), screen='home', count=10, category='all', session=null, blocked=false, storageIssue='', toastTimer;
  try { const raw=localStorage.getItem(KEY); if(raw) { try {state=Core.validate(JSON.parse(raw),QUESTIONS);} catch { blocked=true;storageIssue='保存されている記録を読み取れません。元の記録は上書きしていません。続けるには「記録」でリセットしてください。';} } }
  catch {storageIssue='このブラウザでは記録を保存できません。練習はできますが、今回の記録は残りません。';}
  function save() {if(blocked)return;try{localStorage.setItem(KEY,JSON.stringify(state));storageIssue='';}catch{storageIssue='記録を保存できません。練習はできますが、今回の記録は残りません。';}showNotice();}
  function showNotice(){document.getElementById('notice').innerHTML=storageIssue?`<div class="notice" role="status"><p>${esc(storageIssue)}</p></div>`:'';}
  function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.add('hidden'),4500);}
  const rate=t=>t.attempts?`${Math.round(t.correct/t.attempts*100)}%`:'—';
  function focusPage(){requestAnimationFrame(()=>{const h=app.querySelector('[data-focus]');h?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});});}
  function nav(){document.getElementById('nav').innerHTML=[['home','home','ホーム'],['topics','book','分野別'],['records','chart','記録']].map(([key,i,label])=>`<button data-action="${key}" class="${screen===key?'active':''}" ${screen===key?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('');}
  function picker(){return `<div class="count-picker" role="group" aria-label="1回に解く問題数">${[5,10,20,'all'].map(n=>`<button data-action="count" data-value="${n}" aria-pressed="${count===n}">${n==='all'?'全問':n+'問'}</button>`).join('')}</div>`;}
  function week(){const today=new Date(), start=new Date(today.getFullYear(),today.getMonth(),today.getDate());start.setDate(start.getDate()-((start.getDay()+6)%7));return `<div class="week">${['月','火','水','木','金','土','日'].map((d,i)=>{const date=new Date(start);date.setDate(start.getDate()+i);const key=Core.dayKey(date),done=!!state.days[key]?.attempts;return `<div class="weekday">${d}<div class="day-circle ${done?'done':''} ${key===Core.dayKey(today)?'today':''}" aria-label="${date.getMonth()+1}月${date.getDate()}日 ${done?'学習あり':'学習記録なし'}${key===Core.dayKey(today)?' 今日':''}">${done?'✓':date.getDate()}</div></div>`;}).join('')}</div>`;}
  function stats(){const t=Core.totals(state),today=state.days[Core.dayKey()]?.attempts||0;return `<div class="stats-line"><div class="stat"><div class="stat-label">今日解いた数</div><div class="stat-number">${today}<small>問</small></div></div><div class="stat"><div class="stat-label">累計の回答数</div><div class="stat-number">${t.attempts}<small>回</small></div></div><div class="stat"><div class="stat-label">これまでの正答率</div><div class="stat-number">${rate(t)}</div></div></div>`;}
  function home(){const r=Core.reviewPool(QUESTIONS,state).length,t=Core.totals(state);app.innerHTML=`<div class="grid-home"><section class="card hero"><div class="hero-top"><span class="tag">SPI PRACTICE · 600問版</span><span class="leafmark">${icon('leaf')}</span></div><h1 tabindex="-1" data-focus>好きなだけ、<br>少しずつ。</h1><p class="lead">言葉を考える。数字をひもとく。<br>あなたのペースで、ひとつずつ身につけよう。</p><span class="section-label">今回は何問解きますか？</span>${picker()}<button class="button primary full" data-action="start">練習をはじめる ${icon('arrow')}</button><p class="hero-note">言語・非言語をバランスよく。途中で終えても大丈夫。</p></section><div class="stack"><section class="card side-card"><div class="row"><span class="side-icon">${icon('refresh')}</span><h2>もう一度、確かめる</h2><div class="review-count">${r}<small>問</small></div></div><p>間違えた問題と「自信なし」の問題を、<br>納得できるまでゆっくり復習。</p><button class="button soft full" data-action="review" ${r?'':'disabled'}>${r?'復習をはじめる':'復習する問題はまだありません'} ${r?icon('arrow'):''}</button></section><section class="card week-card"><div class="row between"><h2>今週の学習</h2><span class="small muted">ノルマなし</span></div>${week()}<p class="small muted" style="margin:17px 0 0">取り組んだ日を、そっと記録します。</p></section></div></div>${stats()}<div class="section-heading row between"><h2>気になる分野から</h2><button class="text-button" data-action="topics">すべての単元を見る →</button></div><div class="quick-grid">${[['言語','book','言葉の意味・文章の理解',240],['非言語','chart','計算・条件の整理',360]].map(([cat,i,sub,total])=>`<button class="quick-card" data-action="category" data-value="${cat}"><span class="side-icon">${icon(i)}</span><span><strong>${cat}<span class="small muted"> ｜ ${total}問</span></strong><small>${sub}</small></span><span class="arrow">${icon('arrow')}</span></button>`).join('')}</div><p class="small muted" style="margin-top:20px">600問中 ${t.seen}問に取り組みました。未回答を優先して出題します。</p>`;}
  function topics(){app.innerHTML=`<div class="page-intro"><p class="eyebrow">PRACTICE BY TOPIC</p><h1 tabindex="-1" data-focus>分野を選んで練習</h1><p class="muted small">気になる単元から、じっくり取り組めます。</p></div><span class="section-label">1回に解く問題数</span>${picker()}<div class="row wrap" role="group" aria-label="領域を絞り込み">${['all','言語','非言語'].map(c=>`<button class="button ${category===c?'soft':''}" data-action="filter" data-value="${c}" aria-pressed="${category===c}">${c==='all'?'すべて':c}</button>`).join('')}</div>${['言語','非言語'].filter(c=>category==='all'||category===c).map(cat=>`<h2 class="category-title">${cat} <span class="small muted">${QUESTIONS.filter(q=>q.category===cat).length}問</span></h2><div class="topics">${[...new Set(QUESTIONS.filter(q=>q.category===cat).map(q=>q.topic))].map(topic=>{const qs=QUESTIONS.filter(q=>q.topic===topic),t=Core.totals(state,qs);return `<section class="topic-card"><h3>${esc(topic)}</h3><div class="topic-meta"><span>取り組み ${t.seen} / ${qs.length}問</span><span>正答率 ${rate(t)}</span></div><div class="bar" aria-hidden="true"><span style="width:${t.seen/qs.length*100}%"></span></div><button class="button" data-action="topic" data-value="${esc(topic)}">この単元を解く ${icon('arrow')}</button></section>`;}).join('')}</div>`).join('')}`;}
  function records(){const t=Core.totals(state);app.innerHTML=`<div class="page-intro"><p class="eyebrow">YOUR PROGRESS</p><h1 tabindex="-1" data-focus>少しずつの積み重ね</h1><p class="muted small">正答率は、復習を含むすべての回答から計算しています。</p></div>${stats()}<p class="small muted">異なる問題の取り組み：${t.seen} / 600問　・　復習対象：${t.review}問</p><div class="settings-layout"><section class="card"><h2>分野別の記録</h2><table class="record-table"><thead><tr><th scope="col">単元</th><th scope="col">取り組み</th><th scope="col">正答率</th></tr></thead><tbody>${[...new Set(QUESTIONS.map(q=>q.topic))].map(topic=>{const qs=QUESTIONS.filter(q=>q.topic===topic),v=Core.totals(state,qs);return `<tr><th scope="row">${esc(topic)}</th><td>${v.seen} / ${qs.length}</td><td>${rate(v)}</td></tr>`;}).join('')}</tbody></table></section><div class="stack"><section class="card"><h2>記録について</h2><p>回答数・正答率・復習対象は、この端末のブラウザに保存します。ログインや端末間の同期はありません。</p><p>ブラウザのデータを削除すると記録も消えます。別の端末やブラウザでは、新しい記録から始まります。</p></section><section class="card"><h2>記録のリセット</h2><p>回答履歴と学習日の記録をすべて削除します。この操作は取り消せません。</p><button class="button danger full" data-action="reset">すべての記録をリセット</button></section></div></div>`;}
  function table(q){return q.table?`<div class="table-wrap"><table class="data-table"><caption class="sr-only">問題の資料</caption><thead><tr>${q.table.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${q.table.rows.map(row=>`<tr>${row.map((v,i)=>i?`<td>${esc(v)}</td>`:`<th scope="row">${esc(v)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';}
  function explanation(q){return q.steps?`<ol class="solution-steps">${q.steps.map((step,i)=>`<li><div class="step-heading"><span>${i+1}</span><h3>${esc(step.title)}</h3></div><p>${esc(step.text)}</p></li>`).join('')}</ol>${q.steps.some(step=>/\d+\/\d+/.test(step.text))?'<p class="fraction-note">分数の読み方：たとえば 3/4 は「3 ÷ 4」、全体を4つに分けたうちの3つ分です。</p>':''}`:`<p>${esc(q.explanation)}</p>`;}
  function question(){const s=session,q=s.queue[s.index],done=s.answered;app.innerHTML=`<div class="practice"><div class="practice-top"><button class="text-button" data-action="leave">${icon('back')} 練習を終える</button><span class="small muted">${s.index+1} / ${s.queue.length}問</span></div><div class="progress" role="progressbar" aria-label="回答の進み具合" aria-valuemin="0" aria-valuemax="${s.queue.length}" aria-valuenow="${s.index+(done?1:0)}"><span style="width:${(s.index+(done?1:0))/s.queue.length*100}%"></span></div><section class="card question-card"><div class="q-meta"><span class="tag">${esc(q.category)}</span><span class="tag neutral">${esc(q.level)}</span><span class="number">${esc(q.topic)} · ${esc(q.id.toUpperCase())}</span></div><h1 class="question-title" tabindex="-1" data-focus>問題 ${s.index+1}</h1><p class="prompt">${esc(q.prompt)}</p>${table(q)}<fieldset class="answers"><legend>答えを1つ選んでください</legend>${q.choices.map((c,i)=>`<label class="answer ${done?'disabled ':''}${done&&i===q.answer?'correct':done&&i===s.selected?'incorrect':''}"><input type="radio" name="answer" value="${i}" ${s.selected===i?'checked':''} ${done?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(c)}</span>${done&&(i===q.answer||i===s.selected)?`<span class="answer-flag">${i===q.answer?'✓ 正解':'選んだ答え'}</span>`:''}</label>`).join('')}</fieldset><label class="check-label"><input type="checkbox" id="unsure" ${s.unsure?'checked':''}>自信なし・あとで復習したい</label>${done?`<section class="explanation" aria-label="正解と解説"><div class="verdict ${s.selected===q.answer?'':'wrong'}" role="status" tabindex="-1" id="verdict">${icon(s.selected===q.answer?'check':'refresh')}${s.selected===q.answer?'正解です！':'ここで覚えていきましょう'}</div><p class="correct-text">正解：${String.fromCharCode(65+q.answer)}　${esc(q.choices[q.answer])}</p><h2 style="font-size:15px;margin:20px 0 8px">考え方と解き方</h2>${explanation(q)}<div class="tip"><strong>覚えておきたいポイント</strong>${esc(q.tip)}</div><button class="button primary full" data-action="next">${s.index+1===s.queue.length?'結果を見る':'次の問題へ'} ${icon('arrow')}</button></section>`:`<button class="button primary full" id="submit-answer" data-action="answer" ${s.selected===null?'disabled':''}>回答する ${icon('check')}</button>`}</section><p class="session-note">時間制限はありません。採点した回答は、そのつど記録されます。</p></div>`;}
  function result(){const answers=session.results,n=answers.length,correct=answers.filter(r=>r.correct).length,review=answers.filter(r=>!r.correct||r.unsure);app.innerHTML=`<div class="practice"><section class="card results-hero"><div class="result-mark">${icon('check')}</div><h1 tabindex="-1" data-focus>おつかれさまでした！</h1><p class="small muted">${n?'今日の積み重ねを、ひとつずつ。':'気が向いたときに、いつでもどうぞ。'}</p><div class="score">${correct}<small>/ ${n}問 正解</small></div><div class="result-actions"><button class="button" data-action="home">今日はおわる</button><button class="button primary" data-action="start">続けて練習 ${icon('arrow')}</button></div></section>${review.length?`<button class="button soft full" data-action="session-review" style="margin-top:18px">今回の${review.length}問を復習する ${icon('refresh')}</button>`:''}${n?`<div class="section-heading"><h2>今回のふりかえり</h2><p class="small muted">タップすると問題と解説を読み返せます。</p></div><ul class="result-list">${answers.map((r,i)=>{const q=QUESTIONS.find(q=>q.id===r.id);return `<li><details><summary><span class="${r.correct?'result-good':'result-bad'}">${r.correct?'✓ 正解':'↻ 復習'}</span>　${i+1}. ${esc(q.topic)} ${r.unsure?'・自信なし':''}</summary><p>${esc(q.prompt)}</p>${table(q)}<p class="muted">あなたの回答：${esc(q.choices[r.selected])}</p><p class="correct-text">正解：${esc(q.choices[q.answer])}</p>${explanation(q)}<div class="tip">${esc(q.tip)}</div></details></li>`;}).join('')}</ul>`:''}</div>`;}
  function help(){app.innerHTML=`<article class="help card"><p class="eyebrow">HOW TO USE</p><h1 tabindex="-1" data-focus style="font-size:27px">使い方・参考情報</h1><h2>好きなときに、好きなだけ</h2><p>ホームで5問・10問・20問・全問から選び、「練習をはじめる」を押してください。毎日のノルマも時間制限もありません。途中で終えても、採点した回答は記録に残ります。途中の練習の再開機能はありません。</p><h2>出題と復習</h2><p>通常練習は言語40％・非言語60％を目安に、未回答を優先して出題します。復習対象があれば一部を混ぜます。分野別では単元を選べます。全問を選ぶと、通常は600問、単元別は40問を出題します。</p><p>間違えた問題と「自信なし」の問題が復習対象です。正解し、自信なしを外すと対象から外れます。復習は選択した問題数まで、前回の回答が古いものから出します。</p><h2>記録の保存</h2><p>回答履歴はこの端末のブラウザ内に保存されます。ログイン・端末間の同期・記録の移行機能はありません。ブラウザのデータを削除すると記録も消えます。</p><h2>サイトの利用</h2><p>オンラインでこのサイトを開いて使います。オフライン起動には対応していません。画面を更新すると未完了の練習は終了しますが、採点済みの回答はブラウザに保存されます。</p><h2>データの扱い</h2><p>このアプリには、回答履歴をサーバーへ送る機能やアクセス解析を組み込んでいません。サイトの配信にはGitHub Pagesを利用しています。配信時のアクセス情報の取り扱いは<a href="https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages#data-collection" target="_blank" rel="noopener noreferrer">GitHubの説明</a>を確認してください。</p><h2>問題について</h2><p>言語240問・非言語360問のオリジナル練習問題です。公開例題の分野や形式を参考に作成しています。SPIの公式問題・過去問ではなく、本番の出題や得点・合否を再現するものではありません。性格検査・英語・構造的把握力は含みません。</p><h2>参考にした公開情報</h2><p>出題分野・形式や、考え方を整理する際に参考にした公開情報です。</p><ul><li><a href="https://www.recruit-ms.co.jp/freshers/spi-003.html" target="_blank" rel="noopener noreferrer">リクルートマネジメントソリューションズ：SPIの能力検査とは</a> — 語彙・文章読解・計算・推論の形式</li><li><a href="https://www.spi-online.net/exam/" target="_blank" rel="noopener noreferrer">SPIオンライン：練習問題</a> — 単元別学習と回答後の解説</li><li><a href="https://spi.careermine.jp/higengo/questions" target="_blank" rel="noopener noreferrer">キャリアマイン：非言語の練習問題</a> — 単元構成</li><li><a href="https://www.theport.jp/portcareer/article/206646/" target="_blank" rel="noopener noreferrer">PORTキャリア：仕事算の練習問題と解説</a> — 全体量と1日分の関係</li><li><a href="https://spi.careermine.jp/gengo/sort-sentences" target="_blank" rel="noopener noreferrer">キャリアマイン：文章整序</a> — 接続語・指示語の追い方</li><li><a href="https://noahs-ark.co.jp/spi-bun/" target="_blank" rel="noopener noreferrer">就活マップ：文章整序の過去問例題・練習問題</a> — 公開学習資料の形式</li></ul><p class="small muted">参照日：2026年10月17日</p><button class="button" data-action="home">${icon('back')} ホームへ</button></article>`;}
  function render(focus=true){nav();showNotice();({home,topics,records,question,result,help}[screen]||home)();if(focus)focusPage();}
  function go(next){clearTimeout(toastTimer);document.getElementById('toast').classList.add('hidden');screen=next;render();}
  function begin(options={}){const queue=Core.select(QUESTIONS,state,{count,...options});if(!queue.length){toast('復習する問題はありません。');return;}session={queue,index:0,selected:null,answered:false,unsure:false,results:[]};go('question');}
  function leave(){if(!session?.results.length){go('home');return;}go('result');}
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,value=el.dataset.value;
    if(['home','topics','records','help'].includes(action)){if(screen==='question'){if(!confirm('練習を終了して移動しますか？ 採点済みの回答は記録されています。'))return;}go(action);}
    else if(action==='count'){count=value==='all'?'all':Number(value);render(false);}
    else if(action==='filter'){category=value;topics();}
    else if(action==='category'){category=value;go('topics');}
    else if(action==='start')begin();
    else if(action==='review')begin({mode:'review'});
    else if(action==='topic')begin({topic:value});
    else if(action==='session-review'){const ids=session.results.filter(r=>!r.correct||r.unsure).map(r=>r.id);begin({ids,count:'all'});}
    else if(action==='leave')leave();
    else if(action==='answer'){const s=session;if(s.answered||s.selected===null)return;const q=s.queue[s.index],correct=s.selected===q.answer;Core.record(state,q.id,correct,s.unsure);s.results.push({id:q.id,correct,unsure:s.unsure,selected:s.selected});s.answered=true;save();render(false);requestAnimationFrame(()=>document.getElementById('verdict')?.focus({preventScroll:false}));}
    else if(action==='next'){const s=session;if(!s.answered)return;if(s.index+1===s.queue.length){go('result');}else{s.index++;s.answered=false;s.selected=null;s.unsure=false;render();}}
    else if(action==='reset'){if(!confirm('回答履歴と学習日をすべて削除します。よろしいですか？'))return;state=Core.fresh();blocked=false;save();render(false);toast('記録をリセットしました。');}
  });
  document.addEventListener('change',event=>{const el=event.target;
    if(el.name==='answer'&&session&&!session.answered){session.selected=Number(el.value);document.getElementById('submit-answer').disabled=false;}
    else if(el.id==='unsure'&&session){session.unsure=el.checked;if(session.answered){const id=session.queue[session.index].id;state.records[id].unsure=el.checked;session.results[session.results.length-1].unsure=el.checked;save();}}

  });
  // Expose a read-only snapshot for the local regression checks.
  window.SPI={snapshot:()=>JSON.parse(JSON.stringify(state))};
  render(false);
})();

</script>
</body>
</html>
