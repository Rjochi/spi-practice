nA：その意見を受け、配置を修正した。\nB：完成した案をチームに見せた。\nC：すると、文字が読みにくいという意見が出た。", "choices": ["C → A → B", "A → B → C", "B → A → C", "B → C → A"], "answer": 3, "explanation": "案を見せると意見が出て、その意見を受けて修正する順です。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q106", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：この方法なら、紙の使用量を減らせる。\nB：配布資料を電子化することにした。\nC：たとえば、毎週の会議資料を画面で共有する。", "choices": ["A → C → B", "C → B → A", "B → A → C", "B → C → A"], "answer": 2, "explanation": "電子化の方針→この方法の効果→具体例、と一般から具体へ進みます。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q107", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：その原因を調べると、案内表示が不足していた。\nB：利用者が入口で迷う事例が相次いだ。\nC：そこで、入口までの矢印を追加した。", "choices": ["A → C → B", "B → A → C", "C → A → B", "B → C → A"], "answer": 1, "explanation": "問題の発生→原因の確認→対策、の順です。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q108", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：ただし、一度に覚えようとすると負担が大きい。\nB：そのため、毎日少しずつ取り組むのがよい。\nC：新しい言葉を学ぶことは表現の幅を広げる。", "choices": ["C → A → B", "A → B → C", "B → C → A", "C → B → A"], "answer": 0, "explanation": "学習の利点→ただし負担への注意→そのため少しずつ、という論理です。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q109", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：一方、午後の部にはまだ空きがある。\nB：参加を希望するなら、午後の部に申し込める。\nC：午前の部は定員に達した。", "choices": ["A → B → C", "B → A → C", "C → B → A", "C → A → B"], "answer": 3, "explanation": "午前は満員→対して午後には空き→午後への申し込みが可能、の順です。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q110", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：その結果、待ち時間は前年より短くなった。\nB：受付の担当者を混雑する時間帯に増やした。\nC：この改善を続けるため、来月も同じ配置にする。", "choices": ["A → C → B", "C → B → A", "B → A → C", "B → C → A"], "answer": 2, "explanation": "人員配置の変更→結果→改善を続ける方針、の順です。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q111", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "町の図書館は、来館が難しい人に本を届けるサービスを始めた。利用には事前登録が必要で、配送は月に一度行う。貸出冊数の上限は、来館時と同じである。\n\n本文と一致するものを選んでください。", "choices": ["配送は毎週行われる", "配送を利用するには事前登録が必要である", "配送では何冊でも借りられる", "図書館への来館は禁止された"], "answer": 1, "explanation": "第2文で事前登録が必要と明示されています。配送は月1回で、冊数に上限もあります。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q112", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "ある工場は工程ごとの作業時間を記録した。最も時間がかかっていたのは加工ではなく、部品を探す工程だった。そこで保管場所を統一したところ、全体の作業時間が短くなった。\n\n改善に直接つながった取り組みはどれですか。", "choices": ["部品の保管場所を統一したこと", "加工機械を増やしたこと", "作業時間の記録をやめたこと", "部品の種類を増やしたこと"], "answer": 0, "explanation": "時間がかかる原因を把握し、保管場所を統一することで改善したと書かれています。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q113", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "この公園では、落ち葉の一部を集めずに残している。落ち葉が昆虫のすみかとなるためだ。ただし、通路上の落ち葉は、滑って転ぶ危険を減らすため回収している。\n\n落ち葉への対応として正しいものはどれですか。", "choices": ["すべての落ち葉を残している", "昆虫を減らすために落ち葉を残している", "通路の落ち葉だけを残している", "場所によって残すか回収するかを分けている"], "answer": 3, "explanation": "生き物のため一部を残す一方、安全のため通路では回収しています。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q114", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "調査では、通勤に自転車を使う人の多くが、健康よりも所要時間の短さを理由に挙げた。ただし、この調査は駅から離れた地域の住民を対象としており、市全体の傾向と同じとは限らない。\n\n本文から言えることはどれですか。", "choices": ["市民全員が自転車を使っている", "健康を理由にする人はいなかった", "調査結果を市全体に当てはめるには注意が必要である", "自転車はすべての交通手段より速い"], "answer": 2, "explanation": "対象地域が限られているので、市全体へ一般化できるとは限りません。「多く」は全員でもありません。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q115", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "新しい予約システムでは、受付時間外にも申し込みができる。ただし、内容の確認と予約の確定は翌営業日に担当者が行う。申し込みの送信だけで予約が確定するわけではない。\n\n本文の要点として適切なのはどれですか。", "choices": ["営業時間外の予約は必ず無効になる", "いつでも申し込めるが、確定には担当者の確認が必要である", "送信直後に予約が確定する", "担当者は予約内容を確認しない"], "answer": 1, "explanation": "申し込み可能な時間と、予約が確定する時点を区別することが要点です。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q116", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "店は容器の持参を呼びかけている。使い捨て容器を減らすためだが、衛生上の理由から、持参容器が使えない商品もある。対象商品は店頭に表示している。\n\n本文と一致するものはどれですか。", "choices": ["持参容器を利用できるかは商品によって異なる", "どの商品でも持参容器が使える", "店は使い捨て容器を全面禁止した", "対象商品は購入後にしか分からない"], "answer": 0, "explanation": "使えない商品があり、対象商品を店頭表示していると述べています。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q117", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "オンライン会議は移動時間を減らせる一方、細かな表情が伝わりにくい場合がある。この部署では、定例報告はオンラインで、初めて共同作業をする際の打ち合わせは対面で行っている。\n\nこの部署の方針として適切なのはどれですか。", "choices": ["すべての会議を対面にする", "オンライン会議を廃止する", "初対面の打ち合わせを省略する", "目的に応じて会議の方法を使い分ける"], "answer": 3, "explanation": "移動時間と伝わり方の特徴を踏まえ、会議の目的で方法を変えています。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q118", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "売上は前月より増えたが、広告費も増えたため、利益は減った。売上だけで事業の状態を判断すると、こうした変化を見落とすおそれがある。\n\n筆者が伝えたいことはどれですか。", "choices": ["売上が増えると利益は必ず減る", "広告を出すと必ず損失になる", "事業の状態を見るには費用や利益にも注目する必要がある", "売上を把握する必要はない"], "answer": 2, "explanation": "売上と利益が異なる方向に変化する例から、複数の指標を見る必要を述べています。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q119", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "実験で一度よい結果が得られても、それだけで方法の有効性が確定するわけではない。同じ条件で結果を繰り返し確認し、偶然の影響を検討する必要がある。\n\n本文に沿う考え方はどれですか。", "choices": ["一度の成功だけで有効と断定する", "よい結果が再び得られるかを確認する", "条件を毎回すべて変える", "期待と違う結果は記録しない"], "answer": 1, "explanation": "結果の再現を確認し、偶然による成功ではないか検討することが重要です。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q120", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "案内文を短くすると読みやすくなることが多い。しかし、必要な条件まで省くと誤解を招く。大切なのは文字数を最小にすることではなく、必要な情報を分かりやすく伝えることである。\n\n本文の主張として適切なのはどれですか。", "choices": ["必要な情報を保ちながら分かりやすくする", "案内文は短いほど必ずよい", "条件はすべて省略すべきである", "文字数を増やせば必ず伝わる"], "answer": 0, "explanation": "短さ自体を目的にせず、必要な情報と理解のしやすさを両立することを主張しています。", "tip": "指示語・接続語・時間の順序を追い、本文に書かれていない内容は推測で補わないようにしましょう。"}, {"id": "q121", "category": "非言語", "topic": "割合・比", "level": "基礎", "prompt": "研修の参加者80人のうち、オンライン参加は15％です。オンライン参加者は何人ですか。", "choices": ["13人", "14人", "11人", "12人"], "answer": 3, "explanation": "1. 条件を整理する\n全体は80人。求めるのは、その15％にあたる人数です。\n\n2. 式を立てる理由\n％は100人あたりの人数を表します。15％を15/100に直し、基準の80人に掛けます。\n\n3. 順番に計算する\n80 × 15/100\n= 1200/100\n= 12人\n\n4. 答えを確かめる\n12 ÷ 80 × 100 = 15％。全体80人より少ないので、人数の大きさも妥当です。", "tip": "割合の基準になる量が何かを先に確かめましょう。", "steps": [{"title": "条件を整理する", "text": "全体は80人。求めるのは、その15％にあたる人数です。"}, {"title": "式を立てる理由", "text": "％は100人あたりの人数を表します。15％を15/100に直し、基準の80人に掛けます。"}, {"title": "順番に計算する", "text": "80 × 15/100\n= 1200/100\n= 12人"}, {"title": "答えを確かめる", "text": "12 ÷ 80 × 100 = 15％。全体80人より少ないので、人数の大きさも妥当です。"}]}, {"id": "q122", "category": "非言語", "topic": "割合・比", "level": "基礎", "prompt": "長さ60cmのリボンを、A用とB用に2：3の比で分けます。A用は何cmですか。", "choices": ["25cm", "26cm", "24cm", "23cm"], "answer": 2, "explanation": "1. 条件を整理する\nA用：B用は2：3。合わせて60cmで、A用の長さを求めます。\n\n2. 式を立てる理由\n全体は比の5個分です。まず1個分を求めてからA用の2個分を取ります。\n\n3. 順番に計算する\n比1個分 = 60 ÷ (2+3) = 12cm\nA用 = 12 × 2 = 24cm\n\n4. 答えを確かめる\nB用は12 × 3 = 36cm。合計24+36 = 60cmで、比も2：3になります。", "tip": "割合の基準になる量が何かを先に確かめましょう。", "steps": [{"title": "条件を整理する", "text": "A用：B用は2：3。合わせて60cmで、A用の長さを求めます。"}, {"title": "式を立てる理由", "text": "全体は比の5個分です。まず1個分を求めてからA用の2個分を取ります。"}, {"title": "順番に計算する", "text": "比1個分 = 60 ÷ (2+3) = 12cm\nA用 = 12 × 2 = 24cm"}, {"title": "答えを確かめる", "text": "B用は12 × 3 = 36cm。合計24+36 = 60cmで、比も2：3になります。"}]}, {"id": "q123", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "今月の利用者は220人で、先月より10％増えました。先月の利用者は何人ですか。", "choices": ["210人", "200人", "220人", "190人"], "answer": 1, "explanation": "1. 条件を整理する\n今月220人は、先月の人数に10％を上乗せした結果です。求めるのは増える前の人数です。\n\n2. 式を立てる理由\n先月を100％とすると、今月は110％です。増えた後の人数を1.1で割って元に戻します。\n\n3. 順番に計算する\n先月 × 1.1 = 220\n先月 = 220 ÷ 1.1\n= 200人\n\n4. 答えを確かめる\n200人の10％は20人。200+20 = 220人になり、条件と一致します。", "tip": "割合の基準になる量が何かを先に確かめましょう。", "steps": [{"title": "条件を整理する", "text": "今月220人は、先月の人数に10％を上乗せした結果です。求めるのは増える前の人数です。"}, {"title": "式を立てる理由", "text": "先月を100％とすると、今月は110％です。増えた後の人数を1.1で割って元に戻します。"}, {"title": "順番に計算する", "text": "先月 × 1.1 = 220\n先月 = 220 ÷ 1.1\n= 200人"}, {"title": "答えを確かめる", "text": "200人の10％は20人。200+20 = 220人になり、条件と一致します。"}]}, {"id": "q124", "category": "非言語", "topic": "割合・比", "level": "基礎", "prompt": "資料の枚数を400枚から300枚に減らしました。元の枚数に対して何％減りましたか。", "choices": ["25％", "26％", "27％", "24％"], "answer": 0, "explanation": "1. 条件を整理する\n元は400枚、変更後は300枚です。減った枚数ではなく、元に対する減少率を求めます。\n\n2. 式を立てる理由\n減少率の基準は変更前の400枚です。減った枚数を元の枚数で割り、100を掛けて％にします。\n\n3. 順番に計算する\n減少枚数 = 400 − 300 = 100枚\n減少率 = 100 ÷ 400 × 100\n= 25％\n\n4. 答えを確かめる\n元の75％が残るので、400 × 0.75 = 300枚です。変更後の枚数と一致します。", "tip": "割合の基準になる量が何かを先に確かめましょう。", "steps": [{"title": "条件を整理する", "text": "元は400枚、変更後は300枚です。減った枚数ではなく、元に対する減少率を求めます。"}, {"title": "式を立てる理由", "text": "減少率の基準は変更前の400枚です。減った枚数を元の枚数で割り、100を掛けて％にします。"}, {"title": "順番に計算する", "text": "減少枚数 = 400 − 300 = 100枚\n減少率 = 100 ÷ 400 × 100\n= 25％"}, {"title": "答えを確かめる", "text": "元の75％が残るので、400 × 0.75 = 300枚です。変更後の枚数と一致します。"}]}, {"id": "q125", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "容器Aに24個、容器Bに36個の玉があります。AからBへ何個移すと、Bの個数がAの2倍になりますか。", "choices": ["5個", "6個", "3個", "4個"], "answer": 3, "explanation": "1. 条件を整理する\n移す前はAが24個、Bが36個です。AからBへ移す個数をx個とします。\n\n2. 式を立てる理由\n移すとAはx個減り、Bはx個増えます。「移した後のB＝移した後のAの2倍」と式にします。\n\n3. 順番に計算する\n36 + x = 2 × (24 − x)\n36 + x = 48 − 2x\n3x = 12\nx = 4個\n\n4. 答えを確かめる\n移した後はAが20個、Bが40個。40 = 2 × 20で、合計も60個のままです。", "tip": "割合の基準になる量が何かを先に確かめましょう。", "steps": [{"title": "条件を整理する", "text": "移す前はAが24個、Bが36個です。AからBへ移す個数をx個とします。"}, {"title": "式を立てる理由", "text": "移すとAはx個減り、Bはx個増えます。「移した後のB＝移した後のAの2倍」と式にします。"}, {"title": "順番に計算する", "text": "36 + x = 2 × (24 − x)\n36 + x = 48 − 2x\n3x = 12\nx = 4個"}, {"title": "答えを確かめる", "text": "移した後はAが20個、Bが40個。40 = 2 × 20で、合計も60個のままです。"}]}, {"id": "q126", "category": "非言語", "topic": "割合・比", "level": "基礎", "prompt": "研修の参加者120人のうち、オンライン参加は20％です。オンライン参加者は何人ですか。", "choices": ["25人", "26人" teps": [{"title": "条件を整理する", "text": "全体は200人。求めるのは、その30％にあたる人数です。"}, {"title": "式を立てる理由", "text": "％は100人あたりの人数を表します。30％を30/100に直し、基準の200人に掛けます。"}, {"title": "順番に計算する", "text": "200 × 30/100\n= 6000/100\n= 60人"}, {"title": "答えを確かめる", "text": "60 ÷ 200 × 100 = 30％。全体200人より少ないので、人数の大きさも妥当です。"}]}, {"id": "q137", "category": "非言語", "topic": "割合・比", "level": "基礎", "prompt": "長さ96cmのリボンを、A用とB用に5：3の比で分けます。A用は何cmですか。", "choices": ["70cm", "80cm", "50cm", "60cm"], "answer": 3, "explanation": "1. 条件を整理する\nA用：B用は5：3。合わせて96cmで、A用の長さを求めます。\n\n2. 式を立てる理由\n全体は比の8個分です。まず1個分を求めてからA用の5個分を取ります。\n\n3. 順番に計算する\n比1個分 = 96 ÷ (5+3) = 12cm\nA用 = 12 × 5 = 60cm\n\n4. 答えを確かめる\nB用は12 × 3 = 36cm。合計60+36 = 96cmで、比も5：3になります。", "tip": "割合の基準になる量が何かを先に確かめましょう。", "steps": [{"title": "条件を整理する", "text": "A用：B用は5：3。合わせて96cmで、A用の長さを求めます。"}, {"title": "式を立てる理由", "text": "全体は比の8個分です。まず1個分を求めてからA用の5個分を取ります。"}, {"title": "順番に計算する", "text": "比1個分 = 96 ÷ (5+3) = 12cm\nA用 = 12 × 5 = 60cm"}, {"title": "答えを確かめる", "text": "B用は12 × 3 = 36cm。合計60+36 = 96cmで、比も5：3になります。"}]}, {"id": "q138", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "今月の利用者は625人で、先月より25％増えました。先月の利用者は何人ですか。", "choices": ["600人", "700人", "500人", "400人"], "answer": 2, "explanation": "1. 条件を整理する\n今月625人は、先月の人数に25％を上乗せした結果です。求めるのは増える前の人数です。\n\n2. 式を立てる理由\n先月を100％とすると、今月は125％です。増えた後の人数を1.25で割って元に戻します。\n\n3. 順番に計算する\n先月 × 1.25 = 625\n先月 = 625 ÷ 1.25\n= 500人\n\n4. 答えを確かめる\n500人の25％は125人。500+125 = 625人になり、条件と一致します。", "tip": "割合の基準になる量が何かを先に確かめましょう。", "steps": [{"title": "条件を整理する", "text": "今月625人は、先月の人数に25％を上乗せした結果です。求めるのは増える前の人数です。"}, {"title": "式を立てる理由", "text": "先月を100％とすると、今月は125％です。増えた後の人数を1.25で割って元に戻します。"}, {"title": "順番に計算する", "text": "先月 × 1.25 = 625\n先月 = 625 ÷ 1.25\n= 500人"}, {"title": "答えを確かめる", "text": "500人の25％は125人。500+125 = 625人になり、条件と一致します。"}]}, {"id": "q139", "category": "非言語", "topic": "割合・比", "level": "基礎", "prompt": "資料の枚数を700枚から525枚に減らしました。元の枚数に対して何％減りましたか。", "choices": ["26％", "25％", "27％", "24％"], "answer": 1, "explanation": "1. 条件を整理する\n元は700枚、変更後は525枚です。減った枚数ではなく、元に対する減少率を求めます。\n\n2. 式を立てる理由\n減少率の基準は変更前の700枚です。減った枚数を元の枚数で割り、100を掛けて％にします。\n\n3. 順番に計算する\n減少枚数 = 700 − 525 = 175枚\n減少率 = 175 ÷ 700 × 100\n= 25％\n\n4. 答えを確かめる\n元の75％が残るので、700 × 0.75 = 525枚です。変更後の枚数と一致します。", "tip": "割合の基準になる量が何かを先に確かめましょう。", "steps": [{"title": "条件を整理する", "text": "元は700枚、変更後は525枚です。減った枚数ではなく、元に対する減少率を求めます。"}, {"title": "式を立てる理由", "text": "減少率の基準は変更前の700枚です。減った枚数を元の枚数で割り、100を掛けて％にします。"}, {"title": "順番に計算する", "text": "減少枚数 = 700 − 525 = 175枚\n減少率 = 175 ÷ 700 × 100\n= 25％"}, {"title": "答えを確かめる", "text": "元の75％が残るので、700 × 0.75 = 525枚です。変更後の枚数と一致します。"}]}, {"id": "q140", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "容器Aに42個、容器Bに63個の玉があります。AからBへ何個移すと、Bの個数がAの2倍になりますか。", "choices": ["7個", "8個", "9個", "6個"], "answer": 0, "explanation": "1. 条件を整理する\n移す前はAが42個、Bが63個です。AからBへ移す個数をx個とします。\n\n2. 式を立てる理由\n移すとAはx個減り、Bはx個増えます。「移した後のB＝移した後のAの2倍」と式にします。\n\n3. 順番に計算する\n63 + x = 2 × (42 − x)\n63 + x = 84 − 2x\n3x = 21\nx = 7個\n\n4. 答えを確かめる\n移した後はAが35個、Bが70個。70 = 2 × 35で、合計も105個のままです。", "tip": "割合の基準になる量が何かを先に確かめましょう。", "steps": [{"title": "条件を整理する", "text": "移す前はAが42個、Bが63個です。AからBへ移す個数をx個とします。"}, {"title": "式を立てる理由", "text": "移すとAはx個減り、Bはx個増えます。「移した後のB＝移した後のAの2倍」と式にします。"}, {"title": "順番に計算する", "text": "63 + x = 2 × (42 − x)\n63 + x = 84 − 2x\n3x = 21\nx = 7個"}, {"title": "答えを確かめる", "text": "移した後はAが35個、Bが70個。70 = 2 × 35で、合計も105個のままです。"}]}, {"id": "q141", "category": "非言語", "topic": "損益算", "level": "基礎", "prompt": "原価800円の商品に、原価の25％の利益を見込んで定価をつけます。定価はいくらですか。", "choices": ["1100円", "1200円", "900円", "1000円"], "answer": 3, "explanation": "1. 条件を整理する\n仕入れに掛かった原価は800円。利益は原価の25％です。定価は原価と利益の合計です。\n\n2. 式を立てる理由\n利益率の基準は原価です。原価×0.25で利益を求め、それを原価に足します。\n\n3. 順番に計算する\n利益 = 800 × 0.25 = 200円\n定価 = 800 + 200 = 1000円\n\n4. 答えを確かめる\n定価から原価を引くと200円。200 ÷ 800 × 100 = 25％です。", "tip": "原価・定価・売価を分け、何を基準にした割合か整理しましょう。", "steps": [{"title": "条件を整理する", "text": "仕入れに掛かった原価は800円。利益は原価の25％です。定価は原価と利益の合計です。"}, {"title": "式を立てる理由", "text": "利益率の基準は原価です。原価×0.25で利益を求め、それを原価に足します。"}, {"title": "順番に計算する", "text": "利益 = 800 × 0.25 = 200円\n定価 = 800 + 200 = 1000円"}, {"title": "答えを確かめる", "text": "定価から原価を引くと200円。200 ÷ 800 × 100 = 25％です。"}]}, {"id": "q142", "category": "非言語", "topic": "損益算", "level": "基礎", "prompt": "定価2000円のバッグを20％引きで売ります。売価はいくらですか。", "choices": ["1700円", "1800円", "1600円", "1500円"], "answer": 2, "explanation": "1. 条件を整理する\n定価は2000円、値引きは20％です。求めるのは値引き後に支払う金額です。\n\n2. 式を立てる理由\n20％引きなら、残る売価は100−20＝80％。定価の80％を計算します。\n\n3. 順番に計算する\n80％ = 0.8\n売価 = 2000 × 0.8 = 1600円\n\n4. 答えを確かめる\n値引き額は2000 × 0.2 = 400円。2000−400 = 1600円となり同じ答えです。", "tip": "原価・定価・売価を分け、何を基準にした割合か整理しましょう。", "steps": [{"title": "条件を整理する", "text": "定価は2000円、値引きは20％です。求めるのは値引き後に支払う金額です。"}, {"title": "式を立てる理由", "text": "20％引きなら、残る売価は100−20＝80％。定価の80％を計算します。"}, {"title": "順番に計算する", "text": "80％ = 0.8\n売価 = 2000 × 0.8 = 1600円"}, {"title": "答えを確かめる", "text": "値引き額は2000 × 0.2 = 400円。2000−400 = 1600円となり同じ答えです。"}]}, {"id": "q143", "category": "非言語", "topic": "損益算", "level": "基礎", "prompt": "原価1200円の商品を1500円で売りました。原価に対する利益率は何％ですか。", "choices": ["26％", "25％", "27％", "24％"], "answer": 1, "explanation": "1. 条件を整理する\n原価1200円、売価1500円です。原価に対して利益が何％かを求めます。\n\n2. 式を立てる理由\n利益は売価−原価です。「原価に対する」割合なので、利益を売価ではなく原価で割ります。\n\n3. 順番に計算する\n利益 = 1500 − 1200 = 300円\n利益率 = 300 ÷ 1200 × 100 = 25％\n\n4. 答えを確かめる\n1200 × 1.25 = 1500円。原価に25％を加えると、問題の売価を再現できます。", "tip": "原価・定価・売価を分け、何を基準にした割合か整理しましょう。", "steps": [{"title": "条件を整理する", "text": "原価1200円、売価1500円です。原価に対して利益が何％かを求めます。"}, {"title": "式を立てる理由", "text": "利益は売価−原価です。「原価に対する」割合なので、利益を売価ではなく原価で割ります。"}, {"title": "順番に計算する", "text": "利益 = 1500 − 1200 = 300円\n利益率 = 300 ÷ 1200 × 100 = 25％"}, {"title": "答えを確かめる", "text": "1200 × 1.25 = 1500円。原価に25％を加えると、問題の売価を再現できます。"}]}, {"id": "q144", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "原価1000円の商品に原価の50％を上乗せして定価をつけ、その定価の20％引きで販売しました。利益はいくらですか。", "choices": ["200円", "210円", "220円", "190円"], "answer": 0, "explanation": "1. 条件を整理する\n原価1000円から定価をつけ、その定価を20％引きします。最後に利益を求めます。\n\n2. 式を立てる理由\n50％上乗せの基準は原価、20％引きの基準は定価です。違う基準なので50−20＝30％とはできません。\n\n3. 順番に計算する\n定価 = 1000 × 1.5 = 1500円\n売価 = 1500 × 0.8 = 1200円\n利益 = 1200 − 1000 = 200円\n\n4. 答えを確かめる\n1.5 × 0.8 = 1.2なので、売価は原価の120％。原価の20％にあたる200円が利益です。", "tip": "原価・定価・売価を分け、何を基準にした割合か整理しましょう。", "steps": [{"title": "条件を整理する", "text": "原価1000円から定価をつけ、その定価を20％引きします。最後に利益を求めます。"}, {"title": "式を立てる理由", "text": "50％上乗せの基準は原価、20％引きの基準は定価です。違う基準なので50−20＝30％とはできません。"}, {"title": "順番に計算する", "text": "定価 = 1000 × 1.5 = 1500円\n売価 = 1500 × 0.8 = 1200円\n利益 = 1200 − 1000 = 200円"}, {"title": "答えを確かめる", "text": "1.5 × 0.8 = 1.2なので、売価は原価の120％。原価の20％にあたる200円が利益です。"}]}, {"id": "q145", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "パンを1個100円で40個仕入れ、1個200円で25個売りました。残りは廃棄します。仕入れ全体に対する利益はいくらですか。", "choices": ["1100円", "1200円", "900円", "1000円"], "answer": 3, "explanation": "1. 条件を整理する\n40個すべてを1個100円で仕入れ、25個を1個200円で販売しています。廃棄分には売上がありません。\n\n2. 式を立てる理由\n費用は売れた個数ではなく、仕入れた全個数に掛かります。全体の利益＝売上総額−仕入総額です。\n\n3. 順番に計算する\n売上 = 200 × 25 = 5000円\n仕入総額 = 100 × 40 = 4000円\n利益 = 5000 − 4000 = 1000円\n\n4. 答えを確かめる\n売れた分の利益2500円から、廃棄した分の原価1500円を引いても1000円になります。", "tip": "原価・定価・売価を分け、何を基準にした割合か整理しましょう。", "steps": [{"title": "条件を整理する", "text": "40個すべてを1個100円で仕入れ、25個を1個200円で販売しています。廃棄分には売上がありません。"}, {"title": "式を立てる理由", "text": "費用は売れた個数ではなく、仕入れた全個数に掛かります。全体の利益＝売上総額−仕入総額です。"}, {"title": "順番に計算する", "text": "売上 = 200 × 25 = 5000円\n仕入総額 = 100 × 40 = 4000円\n利益 = 5000 − 4000 = 1000円"}, {"title": "答えを確かめる", "text": "売れた分の利益2500円から、廃棄した分の原価1500円を引いても1000円になります。"}]}, {"id": "q146", "category": "非言語", "topic": "損益算", "level": "基礎", "prompt": "原価1000円の商品に、原価の25％の利益を見込んで定価をつけます。定価はいくらですか。", "choices": ["1350円", "1450円", "1250円", "1150円"], "answer": 2, "explanation": "1. 条件を整理する\n仕入れに掛かった原価は1000円。利益は原価の25％です。定価は原価と利益の合計です。\n\n2. 式を立てる理由\n利益率の基準は原価です。原価×0.25で利益を求め、それを原価に足します。\n\n3. 順番に計算する\n利益 = 1000 × 0.25 = 250円\n定価 = 1000 + 250 = 1250円\n\n4. 答えを確かめる\n定価から原価を引くと250円。250 ÷ 1000 × 100 = 25％です。", "tip": "原価・定価・売価を分け、何を基準にした割合か整理しましょう。", む距離は何kmですか。", "choices": ["21km", "22km", "19km", "20km"], "answer": 3, "explanation": "1. 条件を整理する\n速さは時速48km、時間は25分。時速は1時間あたりなので、時間の単位をそろえます。\n\n2. 式を立てる理由\n1時間＝60分。25分は25/60時間です。距離＝速さ×時間を使います。\n\n3. 順番に計算する\n25分 = 25 ÷ 60 = 5/12時間\n距離 = 48 × 5/12 = 20km\n\n4. 答えを確かめる\n25分は1時間より短いので、距離は48kmより小さくなります。20 ÷ 48 = 5/12時間です。", "tip": "距離＝速さ×時間。分と時間、mとkmの単位をそろえましょう。", "steps": [{"title": "条件を整理する", "text": "速さは時速48km、時間は25分。時速は1時間あたりなので、時間の単位をそろえます。"}, {"title": "式を立てる理由", "text": "1時間＝60分。25分は25/60時間です。距離＝速さ×時間を使います。"}, {"title": "順番に計算する", "text": "25分 = 25 ÷ 60 = 5/12時間\n距離 = 48 × 5/12 = 20km"}, {"title": "答えを確かめる", "text": "25分は1時間より短いので、距離は48kmより小さくなります。20 ÷ 48 = 5/12時間です。"}]}, {"id": "q162", "category": "非言語", "topic": "速さ", "level": "基礎", "prompt": "18kmの道のりを時速6kmで歩きます。休憩なしなら何時間かかりますか。", "choices": ["4時間", "5時間", "3時間", "2時間"], "answer": 2, "explanation": "1. 条件を整理する\n距離18kmを、1時間に6kmずつ進みます。所要時間を求めます。\n\n2. 式を立てる理由\n距離の中に「1時間分の6km」がいくつあるかを調べるので、距離÷速さです。\n\n3. 順番に計算する\n時間 = 18 ÷ 6 = 3時間\n\n4. 答えを確かめる\n6 × 3 = 18kmとなり、進む距離を再現できます。", "tip": "距離＝速さ×時間。分と時間、mとkmの単位をそろえましょう。", "steps": [{"title": "条件を整理する", "text": "距離18kmを、1時間に6kmずつ進みます。所要時間を求めます。"}, {"title": "式を立てる理由", "text": "距離の中に「1時間分の6km」がいくつあるかを調べるので、距離÷速さです。"}, {"title": "順番に計算する", "text": "時間 = 18 ÷ 6 = 3時間"}, {"title": "答えを確かめる", "text": "6 × 3 = 18kmとなり、進む距離を再現できます。"}]}, {"id": "q163", "category": "非言語", "topic": "速さ", "level": "標準", "prompt": "30km離れた2地点から、AとBが同時に向かい合って出発します。Aは時速4km、Bは時速2kmです。何時間後に出会いますか。", "choices": ["6時間", "5時間", "7時間", "4時間"], "answer": 1, "explanation": "1. 条件を整理する\n最初の間隔は30km。向かい合って進む2人の速さは時速4kmと2kmです。\n\n2. 式を立てる理由\n向かい合うと1時間で両方が進んだ距離の合計だけ間隔が縮まります。速さを足してから距離を割ります。\n\n3. 順番に計算する\n間隔が縮む速さ = 4+2 = 6km/時\n出会うまでの時間 = 30 ÷ 6 = 5時間\n\n4. 答えを確かめる\nAの進む距離20kmとBの進む距離10kmを足すと、30kmになります。", "tip": "距離＝速さ×時間。分と時間、mとkmの単位をそろえましょう。", "steps": [{"title": "条件を整理する", "text": "最初の間隔は30km。向かい合って進む2人の速さは時速4kmと2kmです。"}, {"title": "式を立てる理由", "text": "向かい合うと1時間で両方が進んだ距離の合計だけ間隔が縮まります。速さを足してから距離を割ります。"}, {"titl  条件を整理する\nAは1日で全体の1/12、Bは1日で1/6を進めます。Aが先に3日作業し、その残りをBが担当します。\n\n2. 式を立てる理由\nAが終えた割合を1から引きます。その残量をBの1日分で割ります。Bが最初から全体を担当するわけではありません。\n\n3. 順番に計算する\nAの完了割合 = 3/12\n残り = 1−3/12 = 3/4\nBの必要日数 = 3/4 ÷ (1/6)\n= 3/4 × 6 = 9/2（4.5）日\n\n4. 答えを確かめる\nBが進める割合は9/2 ÷ 6 = 3/4。Aの3/12と足すと1になり、仕事がちょうど完成します。", "tip": "仕事全体を1とし、1日・1時間あたりの仕事量を足したり引いたりしましょう。", "steps": [{"title": "条件を整理する", "text": "Aは1日で全体の1/12、Bは1日で1/6を進めます。Aが先に3日作業し、その残りをBが担当します。"}, {"title": "式を立てる理由", "text": "Aが終えた割合を1から引きます。その残量をBの1日分で割ります。Bが最初から全体を担当するわけではありません。"}, {"title": "順番に計算する", "text": "Aの完了割合 = 3/12\n残り = 1−3/12 = 3/4\nBの必要日数 = 3/4 ÷ (1/6)\n= 3/4 × 6 = 9/2（4.5）日"}, {"title": "答えを確かめる", "text": "Bが進める割合は9/2 ÷ 6 = 3/4。Aの3/12と足すと1になり、仕事がちょうど完成します。"}]}, {"id": "q184", "category": "非言語", "topic": "仕事算", "level": "標準", "prompt": "空の水槽を給水管だけなら6時間で満たせます。満水の水槽は排水管だけなら12時間で空になります。空の状態で両方を開くと何時間で満水になりますか。", "choices": ["12時間", "13時間", "14時間", "11時間"], "answer": 0, "explanation": "1. 条件を整理する\n給水だけなら6時間、排水だけなら12時間です。水槽全体を12単位の水量として考えます。\n\n2. 式を立てる理由\n同時に開くと給水量から排水量を引いた分だけ増えます。満水量÷1時間の正味増加量で時間を求めます。\n\n3. 順番に計算する\n給水：12 ÷ 6 = 2単位/時\n排水：12 ÷ 12 = 1単位/時\n正味：2−1 = 1単位/時\n必要時間：12 ÷ 1 = 12時間\n\n4. 答えを確かめる\n給水量2×12から排水量1×12を引くと12単位。満水量と一致します。排水があるので給水だけの6時間より長くなります。", "tip": "仕事全体を1とし、1日・1時間あたりの仕事量を足したり引いたりしましょう。", "steps": [{"title": "条件を整理する", "text": "給水だけなら6時間、排水だけなら12時間です。水槽全体を12単位の水量として考えます。"}, {"title": "式を立てる理由", "text": "同時に開くと給水量から排水量を引いた分だけ増えます。満水量÷1時間の正味増加量で時間を求めます。"}, {"title": "順番に計算する", "text": "給水：12 ÷ 6 = 2単位/時\n排水：12 ÷ 12 = 1単位/時\n正味：2−1 = 1単位/時\n必要時間：12 ÷ 1 = 12時間"}, {"title": "答えを確かめる", "text": "給水量2×12から排水量1×12を引くと12単位。満水量と一致します。排水があるので給水だけの6時間より長くなります。"}]}, {"id": "q185", "category": "非言語", "topic": "仕事算", "level": "基礎", "prompt": "同じ性能の機械2台で4時間に部品240個を作れます。機械1台が1時間に作る部品は何個ですか。", "choices": ["40個", "50個", "20個", "30個"], "answer": 3, "explanation": "1. 条件を整理する\n2台で4時間に240個を作ります。1台・1時間あたりの生産数を求めます。\n\n2. 式を立てる理由\n1台ずつ同じ効率なので、総生産数を台数と時間の両方で割ります。台数だけで割ると1台4時間分の個数です。\n\n3. 順番に計算する\n1台が4時間で作る数 = 240 ÷ 2 = 1 間", "26時間", "23時間"], "answer": 1, "explanation": "1. 条件を整理する\n給水だけなら12時間、排水だけなら24時間です。水槽全体を24単位の水量として考えます。\n\n2. 式を立てる理由\n同時に開くと給水量から排水量を引いた分だけ増えます。満水量÷1時間の正味増加量で時間を求めます。\n\n3. 順番に計算する\n給水：24 ÷ 12 = 2単位/時\n排水：24 ÷ 24 = 1単位/時\n正味：2−1 = 1単位/時\n必要時間：24 ÷ 1 = 24時間\n\n4. 答えを確かめる\n給水量2×24から排水量1×24を引くと24単位。満水量と一致します。排水があるので給水だけの12時間より長くなります。", "tip": "仕事全体を1とし、1日・1時間あたりの仕事量を足したり引いたりしましょう。", "steps": [{"title": "条件を整理する", "text": "給水だけなら12時間、排水だけなら24時間です。水槽全体を24単位の水量として考えます。"}, {"title": "式を立てる理由", "text": "同時に開くと給水量から排水量を引いた分だけ増えます。満水量÷1時間の正味増加量で時間を求めます。"}, {"title": "順番に計算する", "text": "給水：24 ÷ 12 = 2単位/時\n排水：24 ÷ 24 = 1単位/時\n正味：2−1 = 1単位/時\n必要時間：24 ÷ 1 = 24時間"}, {"title": "答えを確かめる", "text": "給水量2×24から排水量1×24を引くと24単位。満水量と一致します。排水があるので給水だけの12時間より長くなります。"}]}, {"id": "q200", "category": "非言語", "topic": "仕事算", "level": "基礎", "prompt": "同じ性能の機械5台で4時間に部品600個を作れます。機械1台が1時間に作る部品は何個ですか。", "choices": ["30個", "40個", "50個", "20個"], "answer": 0, "explanation": "1. 条件を整理する\n5台で4時間に600個を作ります。1台・1時間あたりの生産数を求めます。\n\n2. 式を立てる理由\n1台ずつ同じ効率なので、総生産数を台数と時間の両方で割ります。台数だけで割ると1台4時間分の個数です。\n\n3. 順番に計算する\n1台が4時間で作る数 = 600 ÷ 5 = 120個\n1台1時間の数 = 120 ÷ 4 = 30個\n\n4. 答えを確かめる\n30 × 5台 × 4時間 = 600個。問題の総生産数と一致します。", "tip": "仕事全体を1とし、1日・1時間あたりの仕事量を足したり引いたりしましょう。", "steps": [{"title": "条件を整理する", "text": "5台で4時間に600個を作ります。1台・1時間あたりの生産数を求めます。"}, {"title": "式を立てる理由", "text": "1台ずつ同じ効率なので、総生産数を台数と時間の両方で割ります。台数だけで割ると1台4時間分の個数です。"}, {"title": "順番に計算する", "text": "1台が4時間で作る数 = 600 ÷ 5 = 120個\n1台1時間の数 = 120 ÷ 4 = 30個"}, {"title": "答えを確かめる", "text": "30 × 5台 × 4時間 = 600個。問題の総生産数と一致します。"}]}, {"id": "q201", "category": "非言語", "topic": "集合", "level": "基礎", "prompt": "60人に調査し、紅茶が好きな人は30人、コーヒーが好きな人は25人、両方好きな人は10人でした。少なくとも一方が好きな人は何人ですか。", "choices": ["55人", "65人", "35人", "45人"], "answer": 3, "explanation": "1. 条件を整理する\nAが30人、Bが25人、両方が10人。求めるのは少なくとも一方に属する人数です。\n\n2. 式を立てる理由\nA+Bでは両方の人を2回数えます。1回に直すため、重複を1回引きます。\n\n3. 順番に計算する\n30+25−10 = 45人\n\n4. 答えを確かめる\nAだけ20人、両方10人、Bだけ15人に分けると、重なりのない内訳になります。Aは20+10 = 30人、Bは15+10 = 25人です。", " ices": ["320冊", "330冊", "300冊", "310冊"], "answer": 3, "explanation": "1. 条件を整理する\n5月の3店舗合計を求めます。必要なのは5月の列だけです。\n\n2. 式を立てる理由\n同じ月の違う店舗の数は重なりなく足せます。\n\n3. 順番に計算する\n5月の列を足します。120+100+90 = 310冊です。\n\n4. 答えを確かめる\n東店以外は190冊。そこへ東店120冊を加えても310冊です。", "tip": "表の見出しと単位を確認し、必要な行・列だけを使いましょう。", "table": {"headers": ["店舗", "4月（冊）", "5月（冊）"], "rows": [["東店", 100, 120], ["西店", 80, 100], ["南店", 60, 90]]}, "steps": [{"title": "条件を整理する", "text": "5月の3店舗合計を求めます。必要なのは5月の列だけです。"}, {"title": "式を立てる理由", "text": "同じ月の違う店舗の数は重なりなく足せます。"}, {"title": "順番に計算する", "text": "5月の列を足します。120+100+90 = 310冊です。"}, {"title": "答えを確かめる", "text": "東店以外は190冊。そこへ東店120冊を加えても310冊です。"}]}, {"id": "q282", "category": "非言語", "topic": "表の読み取り", "level": "基礎", "prompt": "表は3店舗の書籍販売冊数です。\n\n南店の4月から5月への増加冊数は何冊ですか。", "choices": ["40冊", "50冊", "30冊", "20冊"], "answer": 2, "explanation": "1. 条件を整理する\n南店の増加数を求めます。必要なのは南店の4月・5月です。\n\n2. 式を立てる理由\n増加数は変更後−変更前です。増加率ではないので割り算は不要です。\n\n3. 順番に計算する\n南店の行から、5月 − 4月 = 90 − 60 = 30冊です。\n\n4. 答えを確かめる\n4月60冊に増加30冊を足すと5月90冊です。", "tip": "表の見出しと単位を確認し、必要な行・列だけを使いましょう。", "table": {"headers": ["店舗", "4月（冊）", "5月（冊）"], "rows": [["東店", 100, 120], ["西店", 80, 100], ["南店", 60, 90]]}, "steps": [{"title": "条件を整理する", "text": "南店の増加数を求めます。必要なのは南店の4月・5月です。"}, {"title": "式を立てる理由", "text": "増加数は変更後−変更前です。増加率ではないので割り算は不要です。"}, {"title": "順番に計算する", "text": "南店の行から、5月 − 4月 = 90 − 60 = 30冊です。"}, {"title": "答えを確かめる", "text": "4月60冊に増加30冊を足すと5月90冊です。"}]}, {"id": "q283", "category": "非言語", "topic": "表の読み取り", "level": "基礎", "prompt": "表は3店舗の書籍販売冊数です。\n\n西店の2か月分の合計は何冊ですか。", "choices": ["190冊", "180冊", "200冊", "170冊"], "answer": 1, "explanation": "1. 条件を整理する\n西店の2か月合計を求めます。西店の行に注目します。\n\n2. 式を立てる理由\n同じ店舗の違う月の販売数を足します。\n\n3. 順番に計算する\n西店の行を合計します。80+100 = 180冊です。\n\n4. 答えを確かめる\n合計180冊から4月80冊を引くと、5月100冊です。", "tip": "表の見出しと単位を確認し、必要な行・列だけを使いましょう。", "table": {"headers": ["店舗", "4月（冊）", "5月（冊）"], "rows": [["東店", 100, 120], ["西店", 80, 100], ["南店", 60, 90]]}, "steps": [{"title": "条件を整理する", "text": "西店の2か月合計を求めます。西店の行に注目します 関係", "level": "基礎", "prompt": "「海図：航海」と同じ関係の組を選んでください。", "choices": ["楽譜：作曲家", "旅行：切符", "登山地図：登山", "運動：疲労"], "answer": 2, "explanation": "活動を行う際の案内資料と、その活動です。海図は航海、登山地図は登山に用います。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q303", "category": "言語", "topic": "二語の関係", "level": "基礎", "prompt": "「昆虫：カブトムシ」と同じ関係の組を選んでください。", "choices": ["氷：水", "金属：銅", "松：樹木", "金：銀"], "answer": 1, "explanation": "上位の分類から、その分類に属する具体例への関係です。銅は金属の一種です。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q304", "category": "言語", "topic": "二語の関係", "level": "基礎", "prompt": "「繭：絹」と同じ関係の組を選んでください。", "choices": ["サトウキビ：砂糖", "紙：木材", "糸：針", "米：水田"], "answer": 0, "explanation": "原料と、その原料を加工して得られる製品です。製品から原料へ逆転した選択肢に注意します。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q305", "category": "言語", "topic": "二語の関係", "level": "基礎", "prompt": "「著者：読者」と同じ関係の組を選んでください。", "choices": ["先生：学校", "販売員：商品", "借り手：借家", "送り手：受け手"], "answer": 3, "explanation": "情報を発する側と受け取る側です。著者が書いた内容を読者が受け取ります。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q306", "category": "言語", "topic": "二語の関係", "level": "基礎", "prompt": "「羽ばたく：鳥」と同じ関係の組を選んでください。", "choices": ["走る：道路", "泳ぐ：水泳", "発芽する：種", "鳴く：声"], "answer": 2, "explanation": "動作・変化と、それを行う主体です。鳥が羽ばたくように、種が発芽します。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q307", "category": "言語", "topic": "二語の関係", "level": "基礎", "prompt": "「楽団：楽団員」と同じ関係の組を選んでください。", "choices": ["研究者：研究室", "委員会：委員", "森：登山者", "楽器：演奏"], "answer": 1, "explanation": "集団と、それを構成する人です。委員会は委員から構成されます。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q308", "category": "言語", "topic": "二語の関係", "level": "基礎", "prompt": "「辞書：意味」と同じ関係の組を選んでください。", "choices": ["時刻表：発車時刻", "切符：運賃", "手帳：紙", "時計：電池"], "answer": 0, "explanation": "資料と、その資料を引いて調べる情報です。時刻表で発車時刻を調べます。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q309", "category": "言語", "topic": "二語の関係", "level": "基礎", "prompt": "「粘土：彫像」と同じ関係の組を選んでください。", "choices": ["机：木材", "工場：製品", "彫刻刀：木彫り", "木材：木製の椅子"], "answer": 3, "explanation": "材料から製作品への関係です。道具や生産場所と作品の関係ではありません。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q310", "category": "言語", "topic": "二語の関係", "level": "基礎", "prompt": "「聴覚：音」と同じ関係の組を選んでください。", "choices": ["視覚：眼鏡", "味覚：舌", "嗅覚：におい", "触覚：手袋"], "answer": 2, "explanation": "感覚と、それで受け取る刺激です。嗅覚はにおいを感じ取ります。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q311", "category": "言語", "topic": "二語の関係", "level": "標準", "prompt": "「暁：夜明け」と同じ関係の組を選んでください。", "choices": ["正午：真夜中", "黄昏：夕暮れ", "昨日：明日", "夕日：太陽"], "answer": 1, "explanation": "二つの語が同じ時間帯を指す関係です。黄昏は夕暮れを意味します。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q312", "category": "言語", "topic": "二語の関係", "level": "標準", "prompt": "「需要：供給」と同じく、経済活動の対になる側面を表す組はどれですか。", "choices": ["生産：消費", "原価：費用", "店舗：建物", "販売：売却"], "answer": 0, "explanation": "需要と供給は求める側と提供する側、生産と消費は作る側と使う側という対になる概念です。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q313", "category": "言語", "topic": "二語の関係", "level": "標準", "prompt": "「序論：結論」と同じ関係の組を選んでください。", "choices": ["文章：段落", "見出し：本文", "挨拶：礼儀", "開幕：閉幕"], "answer": 3, "explanation": "全体の始まりと終わりに対応する部分・出来事です。開幕と閉幕も始まりと終わりです。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q314", "category": "言語", "topic": "二語の関係", "level": "標準", "prompt": "「鉛筆：筆記」と同じ関係の組を選んでください。", "choices": ["消火：消防士", "絵画：美術館", "双眼鏡：観察", "印刷：紙"], "answer": 2, "explanation": "道具と、その道具を使って行う活動です。双眼鏡は遠くを観察するための道具です。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q315", "category": "言語", "topic": "二語の関係", "level": "標準", "prompt": "「細胞：組織」と同じ関係の組を選んでください。", "choices": ["本：ページ", "単語：文", "車：車輪", "森：木"], "answer": 1, "explanation": "小さな構成要素が集まり、より大きいまとまりを作ります。単語が組み合わさって文になります。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q316", "category": "言語", "topic": "二語の関係", "level": "標準", "prompt": "「発注：受注」と同じ関係の組を選んでください。", "choices": ["貸与：借用", "出発：旅行", "減少：縮小", "売買：商取引"], "answer": 0, "explanation": "同じ取引を相手側から見る関係です。貸す側の貸与に対し、借りる側は借用です。", "tip": "二語の間にある関係を言葉にし、順序も含めて一致する組を選びましょう。"}, {"id": "q317", "categor ion": "一緒に変化する相関と、一方が他方を起こす因果関係は区別します。", "tip": "前後が追加・対比・理由・結論のどれかを考え、文として自然か読み直しましょう。"}, {"id": "q399", "category": "言語", "topic": "空欄補充", "level": "標準", "prompt": "空欄に入る最も適切な語句を選んでください。\n\n状況の変化に応じて、計画を（　）に見直す。", "choices": ["頑固", "柔軟", "画一的", "一律"], "answer": 1, "explanation": "状況に合わせて変えることを柔軟に見直すといいます。", "tip": "前後が追加・対比・理由・結論のどれかを考え、文として自然か読み直しましょう。"}, {"id": "q400", "category": "言語", "topic": "空欄補充", "level": "標準", "prompt": "空欄に入る最も適切な語句を選んでください。\n\n提案の実現性を確かめるため、小規模な試行で（　）する。", "choices": ["検証", "断念", "黙殺", "回避"], "answer": 0, "explanation": "試して正しいか・実行できるか確かめることが検証です。", "tip": "前後が追加・対比・理由・結論のどれかを考え、文として自然か読み直しましょう。"}, {"id": "q401", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：その不具合を直すため、設定を変更した。\nB：変更後に再テストすると、正常に動いた。\nC：新しい機器を試したところ、接続が切れる不具合が見つかった。", "choices": ["A → B → C", "A → C → B", "B → A → C", "C → A → B"], "answer": 3, "explanation": "不具合の発見→その修正→修正後の確認です。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q402", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：その写真を整理して、旅行記に添えた。\nB：休暇中に山を歩き、景色を撮影した。\nC：完成した旅行記を友人に送った。", "choices": ["A → B → C", "A → C → B", "B → A → C", "B → C → A"], "answer": 2, "explanation": "撮影した写真→旅行記に添える→完成した旅行記を送る、の順です。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q403", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：そこで、初めての人向けの案内を増やした。\nB：参加者から手続きが分かりにくいという声が寄せられた。\nC：その結果、受付での問い合わせが減った。", "choices": ["A → B → C", "B → A → C", "A → C → B", "B → C → A"], "answer": 1, "explanation": "問題の声→それへの対策→対策の結果という順です。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q404", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：一方で、初期費用は高くなる。\nB：導入するかどうかは、その両面を考えて判断したい。\nC：この設備は毎月の電気代を抑えられる。", "choices": ["C → A → B", "A → B → C", "A → C → B", "B → A → C"], "answer": 0, "explanation": "運用上の利点→一方で初期費用の欠点→両面を踏まえる、となります。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q405", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：しかし、毎回同じやり方が最適とは限らない。\nB：だからこそ、目的に応じた使い分けが必要だ。\nC：慣れた手順なら、作業を早く進められる。", "choices": ["A → B → C", "A → C → B", "B → A → C", "C → A → B"], "answer": 3, "explanation": "慣れた手順の利点を述べ、それを制限し、使い分けの結論へ進みます。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q406", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：具体的には、利用者が迷った箇所を記録してもらう。\nB：その記録を基に、表示の順番を改善する。\nC：画面の使いやすさを確かめるため、操作テストを行う。", "choices": ["A → B → C", "A → C → B", "C → A → B", "B → A → C"], "answer": 2, "explanation": "テストの方針→具体的方法→そこで得た記録の利用、の順です。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q407", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：このように、必ずしも販売数の増加が利益の増加につながるとはいえない。\nB：ところが、値引きと配送費が増え、利益は減った。\nC：今期は販売数が前年を上回った。", "choices": ["A → B → C", "C → B → A", "A → C → B", "B → A → C"], "answer": 1, "explanation": "販売数の増加→予想に反する利益減少→この例からのまとめ、です。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q408", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：そのため、参加予定者に代替日を尋ねた。\nB：会場の設備点検が決まり、予定日に使えなくなった。\nC：回答が最も多かった日を、新しい開催日にした。", "choices": ["B → A → C", "A → B → C", "A → C → B", "B → C → A"], "answer": 0, "explanation": "開催不可→代替日の調査→その回答による日程決定、です。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q409", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：第二に、集めた情報がいつのものかも重要である。\nB：第一に、情報の発信元を確かめる必要がある。\nC：情報の信頼性を判断するには、複数の観点が必要だ。", "choices": ["A → B → C", "A → C → B", "B → A → C", "C → B → A"], "answer": 3, "explanation": "全体の主張を先に置き、第一、第二と具体的な観点を列挙します。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q410", "category": "言語", "topic": "文章整序・読解", "level": "基礎", "prompt": "A〜Cを自然な順に並べたものを選んでください。\n\nA：最後に、その修正版が目的に合うか確かめる。\nB：はじめに、誰に何を伝える文章かを決める。\nC：それに沿って下書きを作り、不要な部分を削って修正する。", "choices": ["A → B → C", "A → C → B", "B → C → A", "B → A → C"], "answer": 2, "explanation": "目的の設定→それに沿う下書きと修正→その修正版の確認、です。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q411", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "商品への不満を調べるとき、問い合わせ件数だけを比べると誤ることがある。販売数が増えれば、不満を持つ割合が同じでも件数は増えうるからだ。改善を判断するには、販売数に対する問い合わせの割合も併せて見る必要がある。\n\n筆者の主張に合うものはどれですか。", "choices": ["件数が増えれば品質は必ず悪化している", "問い合わせの件数と販売数に対する割合の両方を見る", "販売数は調査に必要ない", "割合さえ分かれば問い合わせの内容は無意味だ"], "answer": 1, "explanation": "件数の変化が販売数の変化による可能性を示し、割合も確認することを勧めています。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q412", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "街路樹の木陰は夏の歩道の暑さを和らげる。一方で、枝の落下を防ぐ点検や、根による舗装の傷みへの対応も必要だ。街路樹を維持するには、植えた後の管理まで含めて計画しなければならない。\n\n本文から適切に導けるものはどれですか。", "choices": ["街路樹の計画では植栽後の管理も考える必要がある", "街路樹はすべて撤去するべきだ", "植えればその後の費用はかからない", "木陰ができれば安全対策は不要だ"], "answer": 0, "explanation": "効用だけでなく管理上の課題も示しており、最後の文が結論です。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q413", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "専門用語は、知識を共有する仲間同士なら説明を短く正確にできる。しかし、その分野に詳しくない相手には理解の妨げにもなる。同じ内容でも、相手に応じて言い換えや説明を補うことが大切だ。\n\n専門用語について本文が述べていることはどれですか。", "choices": ["どんな相手にも使うべきではない", "専門用語だけで必ず正確に伝わる", "一般的な言葉への言い換えは不可能だ", "相手の知識によって役立ち方が変わる"], "answer": 3, "explanation": "専門家同士では有効でも、知識のない相手には説明が必要と述べています。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q414", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "試作品の評価では、作り手が操作方法を教えながら使ってもらうと、分かりにくい箇所を見落とすことがある。初めて使う人が、説明なしでどこにつまずくかを観察すると、改善点を発見しやすい。\n\nこの文章で勧められている評価方法はどれですか。", "choices": ["作り手だけで使いやすさを判断する", "困る前にすべての手順を説明する", "初めての人が説明なしで操作する様子を観察する", "操作時間だけで合否を決める"], "answer": 2, "explanation": "支援があると隠れてしまう問題を、説明なしの観察で見つけるという趣旨です。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q415", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "ある店舗で、閉店間際の値引きを始めると廃棄量が減った。ただし、定価で買う客が値引きを待つようになれば、利益が下がる可能性もある。廃棄量だけでなく、売上や利益への影響も継続して確認している。\n\n本文からは判断できないものはどれですか。", "choices": ["値引き開始後に廃棄量が減ったこと", "値引き開始後に利益が実際に増えたか", "店舗が利益への影響を確認していること", "値引き待ちが利益を下げる可能性があること"], "answer": 1, "explanation": "利益への影響を確認中とあるだけで、実際の増減の結果は示されていません。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q416", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "作業を細かく分担すれば、それぞれの担当者が専門性を高めやすい。ただし、担当間の引き継ぎが増えるため、情報共有の不足が全体の遅れにつながることもある。分担を増やす際は、連携の方法も見直す必要がある。\n\n本文の要旨として最も適切なのはどれですか。", "choices": ["分担による専門化と担当間の連携を両立させる必要がある", "分担は必ず全体の作業を遅らせる", "専門性が高ければ情報共有は不要だ", "すべての作業を一人で行うべきだ"], "answer": 0, "explanation": "分担の利点と引き継ぎの課題を挙げ、連携を併せて設計する必要を述べています。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q417", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "調査への回答者の多くが新制度を支持していたとしても、回答しなかった人も同じ意見とは限らない。回答者と未回答者の属性に偏りがある場合、得られた割合をそのまま全体の支持率とみなすのは適切ではない。\n\n全体の支持率を考える際に注意すべき点はどれですか。", "choices": ["回答者の意見をすべて無視すること", "回答数が1以上なら偏りはないこと", "回答しない人は必ず反対だということ", "回答者と未回答者の違い"], "answer": 3, "explanation": "未回答者の意見を断定せず、属性の偏りを検討する必要を述べています。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q418", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "予定を細かく決めると作業の見通しが立つ。一方、変更のたびに計画全体を作り直す必要があるなら、その管理自体が負担になる。変化の多い仕事では、大きな目標を保ちつつ、近い期間の作業を具体化する方法も有効だ。\n\n変化の多い仕事に対する提案はどれですか。", "choices": ["長期の細部を固定して変更を認めない", "目標も予定も決めない", "目標を保ちながら直近の作業を具体的にする", "管理作業を常に最優先する"], "answer": 2, "explanation": "遠い期間まで固定する負担を避け、目標と直近の具体的計画を組み合わせる提案です。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q419", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "修理できる製品を選ぶことは、買い替え回数を減らす可能性がある。しかし、部品の供給が早く終われば、その利点を生かせない。購入時には構造だけでなく、部品の供給期間や修理窓口の有無も確認したい。\n\n本文に沿った購入時の確認事項はどれですか。", "choices": ["見た目の新しさだけ", "部品の供給期間や修理窓口", "価格が高いかどうかだけ", "修理できる構造なら供給体制は不要ということ"], "answer": 1, "explanation": "修理可能な構造を実際に生かすには、部品や窓口の体制も必要だと述べています。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q420", "category": "言語", "topic": "文章整序・読解", "level": "標準", "prompt": "意見が一致していても、その理由が同じとは限らない。ある人は費用の安さから、別の人は導入の早さから賛成しているかもしれない。条件が変わったときの判断を考えるには、賛否だけでなく理由を共有しておくことが役立つ。\n\n理由を共有する利点として本文が挙げているものはどれですか。", "choices": ["条件の変化による判断の違いを考えやすくなる", "全員の理由を一つに統一できる", "一度決めた方針を永久に固定できる", "反対意見を出させなくできる"], "answer": 0, "explanation": "賛成の理由が異なれば、費用や導入速度の条件変更で意見が変わり得ます。その理解に理由の共有が役立ちます。", "tip": "指示語の参照先と接続語の働きを追い、可能性と断定、本文の事実と推測を区別しましょう。"}, {"id": "q421", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "5％の食塩水200gと10％の食塩水300gを混ぜます。混合後の濃度は何％ですか。", "choices": ["9％", "10％", "7％", "8％"], "answer": 3, "explanation": "1. 条件を整理する\n水溶液の合計は500g。食塩の重さを別々に求めます。\n\n2. 式を立てる理由\n濃度は食塩の重さ÷食塩水全体の重さ。濃度を単純平均すると、重さの違いを無視してしまいます。\n\n3. 順番に計算する\n食塩：200×0.05 + 300×0.10 = 40g\n濃度：40 ÷ 500 × 100 = 8％\n\n4. 答えを確かめる\n混合後の濃度は5％と10％の間です。500 × 8/100 = 40gで、食塩の総量も一致します。", "tip": "濃度の平均は、それぞれの重さで重みをつけて考えます。", "steps": [{"title": "条件を整理する", "text": "水溶液の合計は500g。食塩の重さを別々に求めます。"}, {"title": "式を立てる理由", "text": "濃度は食塩の重さ÷食塩水全体の重さ。濃度を単純平均すると、重さの違いを無視してしまいます。"}, {"title": "順番に計算する", "text": "食塩：200×0.05 + 300×0.10 = 40g\n濃度：40 ÷ 500 × 100 = 8％"}, {"title": "答えを確かめる", "text": "混合後の濃度は5％と10％の間です。500 × 8/100 = 40gで、食塩の総量も一致します。"}]}, {"id": "q422", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "8％の食塩水300gに水だけを加え、4％にします。加える水は何gですか。", "choices": ["310g", "320g", "300g", "290g"], "answer": 2, "explanation": "1. 条件を整理する\n食塩は300×0.08 = 24g。水を加えても食塩の量は変わりません。\n\n2. 式を立てる理由\n濃度が半分になるには、食塩水全体の重さが2倍必要です。まず最終的な重さを求め、元の重さを引きます。\n\n3. 順番に計算する\n最終重量 = 24 ÷ 0.04 = 600g\n加える水 = 600−300 = 300g\n\n4. 答えを確かめる\n食塩の重さ÷最終重量は24 ÷ 600 = 0.04で4％です。", "tip": "加える量と、加えた後の全体量は別です。", "steps": [{"title": "条件を整理する", "text": "食塩は300×0.08 = 24g。水を加えても食塩の量は変わりません。"}, {"title": "式を立てる理由", "text": "濃度が半分になるには、食塩水全体の重さが2倍必要です。まず最終的な重さを求め、元の重さを引きます。"}, {"title": "順番に計算する", "text": "最終重量 = 24 ÷ 0.04 = 600g\n加える水 = 600−300 = 300g"}, {"title": "答えを確かめる", "text": "食塩の重さ÷最終重量は24 ÷ 600 = 0.04で4％です。"}]}, {"id": "q423", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "利用料金1000円を20％値上げし、翌年に値上げ後の料金を10％値下げしました。最初と比べて何％増えましたか。", "choices": ["9％", "8％", "10％", "7％"], "answer": 1, "explanation": "1. 条件を整理する\n最初の料金は1000円。値下げの基準は値上げ後の料金です。\n\n2. 式を立てる理由\n連続する割合変化は倍率を掛けます。20−10＝10％と引くことはできません。\n\n3. 順番に計算する\n値上げ後：1000×1.2 = 1200円\n値下げ後：1200×0.9 = 1080円\n増加率：(1080−1000) ÷ 1000 × 100 = 8％\n\n4. 答えを確かめる\n1.2×0.9 = 1.08。最初の108％なので8％増です。", "tip": "増減のたびに、割合の基準が変わります。", "steps": [{"title": "条件を整理する", "text": "最初の料金は1000円。値下げの基準は値上げ後の料金です。"}, {"title": "式を立てる理由", "text": "連続する割合変化は倍率を掛けます。20−10＝10％と引くことはできません。"}, {"title": "順番に計算する", "text": "値上げ後：1000×1.2 = 1200円\n値下げ後：1200×0.9 = 1080円\n増加率：(1080−1000) ÷ 1000 × 100 = 8％"}, {"title": "答えを確かめる", "text": "1.2×0.9 = 1.08。最初の108％なので8％増です。"}]}, {"id": "q424", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "A：B＝2：3、B：C＝3：4です。Cが60個のときAは何個ですか。", "choices": ["30個", "40個", "50個", "20個"], "answer": 0, "explanation": "1. 条件を整理する\n二つの比のBはどちらも3。A：B：C＝2：3：4とつなげられます。\n\n2. 式を立てる理由\n共通するBの比をそろえると、AとCの対応も分かります。Cの{c}個分にあたる実数から比1個分を求めます。\n\n3. 順番に計算する\n比1個分：60 ÷ 4 = 15個\nA：15×2 = 30個\n\n4. 答えを確かめる\nBは45個。A：Bは30：45＝2：3、B：Cも条件と一致します。", "tip": "比をつなげるときは共通する項をそろえます。", "steps": [{"title": "条件を整理する", "text": "二つの比のBはどちらも3。A：B：C＝2：3：4とつなげられます。"}, {"title": "式を立てる理由", "text": "共通するBの比をそろえると、AとCの対応も分かります。Cの{c}個分にあたる実数から比1個分を求めます。"}, {"title": "順番に計算する", "text": "比1個分：60 ÷ 4 = 15個\nA：15×2 = 30個"}, {"title": "答えを確かめる", "text": "Bは45個。A：Bは30：45＝2：3、B：Cも条件と一致します。"}]}, {"id": "q425", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "20人の平均点が60点、別の10人の平均点が80点でした。全員の平均点は何点ですか。", "choices": ["67点", "202/3点", "199/3点", "200/3点"], "answer": 3, "explanation": "1. 条件を整理する\n人数は20人と10人で同数ではありません。全員の合計点を求めます。\n\n2. 式を立てる理由\n平均の平均を取るのではなく、平均×人数で各組の合計点に戻して合計人数で割ります。\n\n3. 順番に計算する\n合計点：60×20 + 80×10 = 2000点\n人数：30人\n全体平均：2000 ÷ 30 = 200/3点\n\n4. 答えを確かめる\n人数が多い60点の組に近い値になり、60点と80点の間に入ります。", "tip": "人数が違う集団の平均は、合計点と合計人数に戻します。", "steps": [{"title": "条件を整理する", "text": "人数は20人と10人で同数ではありません。全員の合計点を求めます。"}, {"title": "式を立てる理由", "text": "平均の平均を取るのではなく、平均×人数で各組の合計点に戻して合計人数で割ります。"}, {"title": "順番に計算する", "text": "合計点：60×20 + 80×10 = 2000点\n人数：30人\n全体平均：2000 ÷ 30 = 200/3点"}, {"title": "答えを確かめる", "text": "人数が多い60点の組に近い値になり、60点と80点の間に入ります。"}]}, {"id": "q426", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "あるクラスでは当初200人のうち40％がA講座を選んでいました。その後50人が全員A講座に加わりました。全体でA講座を選ぶ割合は何％ですか。", "choices": ["62％", "72％", "52％", "42％"], "answer": 2, "explanation": "1. 条件を整理する\n当初のA講座は200×0.4＝80人。追加後は分子も分母も増えます。\n\n2. 式を立てる理由\n参加者数だけでなく全体人数にも追加人数を足し、新しい割合を計算します。\n\n3. 順番に計算する\nAの人数：80+50 = 130人\n全体：200+50 = 250人\n割合：130 ÷ 250 × 100 = 52％\n\n4. 答えを確かめる\n新しい全体250人の52％は130人。Aの人数と一致します。", "tip": "人数の追加では分母も変化します。", "steps": [{"title": "条件を整理する", "text": "当初のA講座は200×0.4＝80人。追加後は分子も分母も増えます。"}, {"title": "式を立てる理由", "text": "参加者数だけでなく全体人数にも追加人数を足し、新しい割合を計算します。"}, {"title": "順番に計算する", "text": "Aの人数：80+50 = 130人\n全体：200+50 = 250人\n割合：130 ÷ 250 × 100 = 52％"}, {"title": "答えを確かめる", "text": "新しい全体250人の52％は130人。Aの人数と一致します。"}]}, {"id": "q427", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "Aの所持金とBの所持金の比は3：5で、BがAより24円多く持っています。2人の合計はいくらですか。", "choices": ["106円", "96円", "116円", "86円"], "answer": 1, "explanation": "1. 条件を整理する\n差の比は5−3＝2個分で、実際の差は24円です。\n\n2. 式を立てる理由\n差から比1個分を求め、和の比a+bを掛けます。\n\n3. 順番に計算する\n比1個分：24 ÷ 2 = 12円\n合計：12×(3+5) = 96円\n\n4. 答えを確かめる\nAは36円、Bは60円で、差は24円です。", "tip": "差が与えられた比では、比の差を使います。", "steps": [{"title": "条件を整理する", "text": "差の比は5−3＝2個分で、実際の差は24円です。"}, {"title": "式を立てる理由", "text": "差から比1個分を求め、和の比a+bを掛けます。"}, {"title": "順番に計算する", "text": "比1個分：24 ÷ 2 = 12円\n合計：12×(3+5) = 96円"}, {"title": "答えを確かめる", "text": "Aは36円、Bは60円で、差は24円です。"}]}, {"id": "q428", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "10％の食塩水500gから、水だけを100g蒸発させました。残った食塩水の濃度は何％ですか。", "choices": ["25/2％", "13％", "27/2％", "12％"], "answer": 0, "explanation": "1. 条件を整理する\n食塩の重さは50gのままで、全体の重さだけが減ります。\n\n2. 式を立てる理由\n蒸発するのは水だけなので、食塩量を変えず、新しい全体重量で割ります。\n\n3. 順番に計算する\n残る重さ：500−100 = 400g\n濃度：50 ÷ 400 × 100 = 25/2（12.5）％\n\n4. 答えを確かめる\n水が減って食塩が同じなので、元の10％より濃くなります。", "tip": "蒸発後も食塩の量は保存されます。", "steps": [{"title": "条件を整理する", "text": "食塩の重さは50gのままで、全体の重さだけが減ります。"}, {"title": "式を立てる理由", "text": "蒸発するのは水だけなので、食塩量を変えず、新しい全体重量で割ります。"}, {"title": "順番に計算する", "text": "残る重さ：500−100 = 400g\n濃度：50 ÷ 400 × 100 = 25/2（12.5）％"}, {"title": "答えを確かめる", "text": "水が減って食塩が同じなので、元の10％より濃くなります。"}]}, {"id": "q429", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "5個の荷物の平均重量は12kgです。そこへ18kgの荷物を1個加えます。新しい平均重量は何kgですか。", "choices": ["14kg", "15kg", "12kg", "13kg"], "answer": 3, "explanation": "1. 条件を整理する\n元の合計重量は5×12＝60kgです。追加後は6個になります。\n\n2. 式を立てる理由\n合計重量に新しい荷物を足し、追加後の個数で割ります。\n\n3. 順番に計算する\n新しい合計：60+18 = 78kg\n新しい平均：78 ÷ 6 = 13kg\n\n4. 答えを確かめる\n追加した荷物は元の平均より重いので、新平均は12kgより大きく18kgより小さくなります。", "tip": "平均値ではなく合計量に追加します。", "steps": [{"title": "条件を整理する", "text": "元の合計重量は5×12＝60kgです。追加後は6個になります。"}, {"title": "式を立てる理由", "text": "合計重量に新しい荷物を足し、追加後の個数で割ります。"}, {"title": "順番に計算する", "text": "新しい合計：60+18 = 78kg\n新しい平均：78 ÷ 6 = 13kg"}, {"title": "答えを確かめる", "text": "追加した荷物は元の平均より重いので、新平均は12kgより大きく18kgより小さくなります。"}]}, {"id": "q430", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "単価を20％値上げしました。売上総額を以前と同じにするには、販売個数を以前より何％減らせばよいですか。", "choices": ["17％", "52/3％", "50/3％", "49/3％"], "answer": 2, "explanation": "1. 条件を整理する\n売上＝単価×個数です。売上を変えず、単価だけ高くするので、個数を減らします。\n\n2. 式を立てる理由\n以前の単価を100、個数を100と置くと売上は10000。新単価120に対する新個数を求めます。\n\n3. 順番に計算する\n新個数：10000 ÷ 120 = 250/3\n減少率：(100−250/3) ÷ 100 × 100\n= 50/3％\n\n4. 答えを確かめる\n単価倍率6/5 × 個数倍率5/6 = 1なので売上は一定です。", "tip": "値上げ率と、必要な個数の減少率は同じではありません。", "steps": [{"title": "条件を整理する", "text": "売上＝単価×個数です。売上を変えず、単価だけ高くするので、個数を減らします。"}, {"title": "式を立てる理由", "text": "以前の単価を100、個数を100と置くと売上は10000。新単価120に対する新個数を求めます。"}, {"title": "順番に計算する", "text": "新個数：10000 ÷ 120 = 250/3\n減少率：(100−250/3) ÷ 100 × 100\n= 50/3％"}, {"title": "答えを確かめる", "text": "単価倍率6/5 × 個数倍率5/6 = 1なので売上は一定です。"}]}, {"id": "q431", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "5％の食塩水300gと10％の食塩水400gを混ぜます。混合後の濃度は何％ですか。", "choices": ["8％", "55/7％", "57/7％", "54/7％"], "answer": 1, "explanation": "1. 条件を整理する\n水溶液の合計は700g。食塩の重さを別々に求めます。\n\n2. 式を立てる理由\n濃度は食塩の重さ÷食塩水全体の重さ。濃度を単純平均すると、重さの違いを無視してしまいます。\n\n3. 順番に計算する\n食塩：300×0.05 + 400×0.10 = 55g\n濃度：55 ÷ 700 × 100 = 55/7％\n\n4. 答えを確かめる\n混合後の濃度は5％と10％の間です。700 × 55/7/100 = 55gで、食塩の総量も一致します。", "tip": "濃度の平均は、それぞれの重さで重みをつけて考えます。", "steps": [{"title": "条件を整理する", "text": "水溶液の合計は700g。食塩の重さを別々に求めます。"}, {"title": "式を立てる理由", "text": "濃度は食塩の重さ÷食塩水全体の重さ。濃度を単純平均すると、重さの違いを無視してしまいます。"}, {"title": "順番に計算する", "text": "食塩：300×0.05 + 400×0.10 = 55g\n濃度：55 ÷ 700 × 100 = 55/7％"}, {"title": "答えを確かめる", "text": "混合後の濃度は5％と10％の間です。700 × 55/7/100 = 55gで、食塩の総量も一致します。"}]}, {"id": "q432", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "8％の食塩水400gに水だけを加え、4％にします。加える水は何gですか。", "choices": ["400g", "410g", "420g", "390g"], "answer": 0, "explanation": "1. 条件を整理する\n食塩は400×0.08 = 32g。水を加えても食塩の量は変わりません。\n\n2. 式を立てる理由\n濃度が半分になるには、食塩水全体の重さが2倍必要です。まず最終的な重さを求め、元の重さを引きます。\n\n3. 順番に計算する\n最終重量 = 32 ÷ 0.04 = 800g\n加える水 = 800−400 = 400g\n\n4. 答えを確かめる\n食塩の重さ÷最終重量は32 ÷ 800 = 0.04で4％です。", "tip": "加える量と、加えた後の全体量は別です。", "steps": [{"title": "条件を整理する", "text": "食塩は400×0.08 = 32g。水を加えても食塩の量は変わりません。"}, {"title": "式を立てる理由", "text": "濃度が半分になるには、食塩水全体の重さが2倍必要です。まず最終的な重さを求め、元の重さを引きます。"}, {"title": "順番に計算する", "text": "最終重量 = 32 ÷ 0.04 = 800g\n加える水 = 800−400 = 400g"}, {"title": "答えを確かめる", "text": "食塩の重さ÷最終重量は32 ÷ 800 = 0.04で4％です。"}]}, {"id": "q433", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "利用料金2000円を20％値上げし、翌年に値上げ後の料金を10％値下げしました。最初と比べて何％増えましたか。", "choices": ["9％", "10％", "7％", "8％"], "answer": 3, "explanation": "1. 条件を整理する\n最初の料金は2000円。値下げの基準は値上げ後の料金です。\n\n2. 式を立てる理由\n連続する割合変化は倍率を掛けます。20−10＝10％と引くことはできません。\n\n3. 順番に計算する\n値上げ後：2000×1.2 = 2400円\n値下げ後：2400×0.9 = 2160円\n増加率：(2160−2000) ÷ 2000 × 100 = 8％\n\n4. 答えを確かめる\n1.2×0.9 = 1.08。最初の108％なので8％増です。", "tip": "増減のたびに、割合の基準が変わります。", "steps": [{"title": "条件を整理する", "text": "最初の料金は2000円。値下げの基準は値上げ後の料金です。"}, {"title": "式を立てる理由", "text": "連続する割合変化は倍率を掛けます。20−10＝10％と引くことはできません。"}, {"title": "順番に計算する", "text": "値上げ後：2000×1.2 = 2400円\n値下げ後：2400×0.9 = 2160円\n増加率：(2160−2000) ÷ 2000 × 100 = 8％"}, {"title": "答えを確かめる", "text": "1.2×0.9 = 1.08。最初の108％なので8％増です。"}]}, {"id": "q434", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "A：B＝2：4、B：C＝4：5です。Cが75個のときAは何個ですか。", "choices": ["40個", "50個", "30個", "20個"], "answer": 2, "explanation": "1. 条件を整理する\n二つの比のBはどちらも4。A：B：C＝2：4：5とつなげられます。\n\n2. 式を立てる理由\n共通するBの比をそろえると、AとCの対応も分かります。Cの{c}個分にあたる実数から比1個分を求めます。\n\n3. 順番に計算する\n比1個分：75 ÷ 5 = 15個\nA：15×2 = 30個\n\n4. 答えを確かめる\nBは60個。A：Bは30：60＝2：4、B：Cも条件と一致します。", "tip": "比をつなげるときは共通する項をそろえます。", "steps": [{"title": "条件を整理する", "text": "二つの比のBはどちらも4。A：B：C＝2：4：5とつなげられます。"}, {"title": "式を立てる理由", "text": "共通するBの比をそろえると、AとCの対応も分かります。Cの{c}個分にあたる実数から比1個分を求めます。"}, {"title": "順番に計算する", "text": "比1個分：75 ÷ 5 = 15個\nA：15×2 = 30個"}, {"title": "答えを確かめる", "text": "Bは60個。A：Bは30：60＝2：4、B：Cも条件と一致します。"}]}, {"id": "q435", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "30人の平均点が60点、別の15人の平均点が80点でした。全員の平均点は何点ですか。", "choices": ["67点", "200/3点", "202/3点", "199/3点"], "answer": 1, "explanation": "1. 条件を整理する\n人数は30人と15人で同数ではありません。全員の合計点を求めます。\n\n2. 式を立てる理由\n平均の平均を取るのではなく、平均×人数で各組の合計点に戻して合計人数で割ります。\n\n3. 順番に計算する\n合計点：60×30 + 80×15 = 3000点\n人数：45人\n全体平均：3000 ÷ 45 = 200/3点\n\n4. 答えを確かめる\n人数が多い60点の組に近い値になり、60点と80点の間に入ります。", "tip": "人数が違う集団の平均は、合計点と合計人数に戻します。", "steps": [{"title": "条件を整理する", "text": "人数は30人と15人で同数ではありません。全員の合計点を求めます。"}, {"title": "式を立てる理由", "text": "平均の平均を取るのではなく、平均×人数で各組の合計点に戻して合計人数で割ります。"}, {"title": "順番に計算する", "text": "合計点：60×30 + 80×15 = 3000点\n人数：45人\n全体平均：3000 ÷ 45 = 200/3点"}, {"title": "答えを確かめる", "text": "人数が多い60点の組に近い値になり、60点と80点の間に入ります。"}]}, {"id": "q436", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "あるクラスでは当初300人のうち40％がA講座を選んでいました。その後75人が全員A講座に加わりました。全体でA講座を選ぶ割合は何％ですか。", "choices": ["52％", "62％", "72％", "42％"], "answer": 0, "explanation": "1. 条件を整理する\n当初のA講座は300×0.4＝120人。追加後は分子も分母も増えます。\n\n2. 式を立てる理由\n参加者数だけでなく全体人数にも追加人数を足し、新しい割合を計算します。\n\n3. 順番に計算する\nAの人数：120+75 = 195人\n全体：300+75 = 375人\n割合：195 ÷ 375 × 100 = 52％\n\n4. 答えを確かめる\n新しい全体375人の52％は195人。Aの人数と一致します。", "tip": "人数の追加では分母も変化します。", "steps": [{"title": "条件を整理する", "text": "当初のA講座は300×0.4＝120人。追加後は分子も分母も増えます。"}, {"title": "式を立てる理由", "text": "参加者数だけでなく全体人数にも追加人数を足し、新しい割合を計算します。"}, {"title": "順番に計算する", "text": "Aの人数：120+75 = 195人\n全体：300+75 = 375人\n割合：195 ÷ 375 × 100 = 52％"}, {"title": "答えを確かめる", "text": "新しい全体375人の52％は195人。Aの人数と一致します。"}]}, {"id": "q437", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "Aの所持金とBの所持金の比は4：6で、BがAより24円多く持っています。2人の合計はいくらですか。", "choices": ["130円", "140円", "110円", "120円"], "answer": 3, "explanation": "1. 条件を整理する\n差の比は6−4＝2個分で、実際の差は24円です。\n\n2. 式を立てる理由\n差から比1個分を求め、和の比a+bを掛けます。\n\n3. 順番に計算する\n比1個分：24 ÷ 2 = 12円\n合計：12×(4+6) = 120円\n\n4. 答えを確かめる\nAは48円、Bは72円で、差は24円です。", "tip": "差が与えられた比では、比の差を使います。", "steps": [{"title": "条件を整理する", "text": "差の比は6−4＝2個分で、実際の差は24円です。"}, {"title": "式を立てる理由", "text": "差から比1個分を求め、和の比a+bを掛けます。"}, {"title": "順番に計算する", "text": "比1個分：24 ÷ 2 = 12円\n合計：12×(4+6) = 120円"}, {"title": "答えを確かめる", "text": "Aは48円、Bは72円で、差は24円です。"}]}, {"id": "q438", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "10％の食塩水600gから、水だけを120g蒸発させました。残った食塩水の濃度は何％ですか。", "choices": ["13％", "27/2％", "25/2％", "12％"], "answer": 2, "explanation": "1. 条件を整理する\n食塩の重さは60gのままで、全体の重さだけが減ります。\n\n2. 式を立てる理由\n蒸発するのは水だけなので、食塩量を変えず、新しい全体重量で割ります。\n\n3. 順番に計算する\n残る重さ：600−120 = 480g\n濃度：60 ÷ 480 × 100 = 25/2（12.5）％\n\n4. 答えを確かめる\n水が減って食塩が同じなので、元の10％より濃くなります。", "tip": "蒸発後も食塩の量は保存されます。", "steps": [{"title": "条件を整理する", "text": "食塩の重さは60gのままで、全体の重さだけが減ります。"}, {"title": "式を立てる理由", "text": "蒸発するのは水だけなので、食塩量を変えず、新しい全体重量で割ります。"}, {"title": "順番に計算する", "text": "残る重さ：600−120 = 480g\n濃度：60 ÷ 480 × 100 = 25/2（12.5）％"}, {"title": "答えを確かめる", "text": "水が減って食塩が同じなので、元の10％より濃くなります。"}]}, {"id": "q439", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "6個の荷物の平均重量は13kgです。そこへ19kgの荷物を1個加えます。新しい平均重量は何kgですか。", "choices": ["14kg", "97/7kg", "99/7kg", "96/7kg"], "answer": 1, "explanation": "1. 条件を整理する\n元の合計重量は6×13＝78kgです。追加後は7個になります。\n\n2. 式を立てる理由\n合計重量に新しい荷物を足し、追加後の個数で割ります。\n\n3. 順番に計算する\n新しい合計：78+19 = 97kg\n新しい平均：97 ÷ 7 = 97/7kg\n\n4. 答えを確かめる\n追加した荷物は元の平均より重いので、新平均は13kgより大きく19kgより小さくなります。", "tip": "平均値ではなく合計量に追加します。", "steps": [{"title": "条件を整理する", "text": "元の合計重量は6×13＝78kgです。追加後は7個になります。"}, {"title": "式を立てる理由", "text": "合計重量に新しい荷物を足し、追加後の個数で割ります。"}, {"title": "順番に計算する", "text": "新しい合計：78+19 = 97kg\n新しい平均：97 ÷ 7 = 97/7kg"}, {"title": "答えを確かめる", "text": "追加した荷物は元の平均より重いので、新平均は13kgより大きく19kgより小さくなります。"}]}, {"id": "q440", "category": "非言語", "topic": "割合・比", "level": "標準", "prompt": "単価を25％値上げしました。売上総額を以前と同じにするには、販売個数を以前より何％減らせばよいですか。", "choices": ["20％", "21％", "22％", "19％"], "answer": 0, "explanation": "1. 条件を整理する\n売上＝単価×個数です。売上を変えず、単価だけ高くするので、個数を減らします。\n\n2. 式を立てる理由\n以前の単価を100、個数を100と置くと売上は10000。新単価125に対する新個数を求めます。\n\n3. 順番に計算する\n新個数：10000 ÷ 125 = 80\n減少率：(100−80) ÷ 100 × 100\n= 20％\n\n4. 答えを確かめる\n単価倍率5/4 × 個数倍率4/5 = 1なので売上は一定です。", "tip": "値上げ率と、必要な個数の減少率は同じではありません。", "steps": [{"title": "条件を整理する", "text": "売上＝単価×個数です。売上を変えず、単価だけ高くするので、個数を減らします。"}, {"title": "式を立てる理由", "text": "以前の単価を100、個数を100と置くと売上は10000。新単価125に対する新個数を求めます。"}, {"title": "順番に計算する", "text": "新個数：10000 ÷ 125 = 80\n減少率：(100−80) ÷ 100 × 100\n= 20％"}, {"title": "答えを確かめる", "text": "単価倍率5/4 × 個数倍率4/5 = 1なので売上は一定です。"}]}, {"id": "q441", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "原価1600円の商品を定価の20％引きで売っても、原価の20％の利益を得たいと考えています。定価はいくらにすべきですか。", "choices": ["2500円", "2600円", "2300円", "2400円"], "answer": 3, "explanation": "1. 条件を整理する\n必要な売価は原価の120％、定価に対する売価は80％です。\n\n2. 式を立てる理由\nまず目標の売価を出し、その売価を0.8で割って値引き前の定価に戻します。\n\n3. 順番に計算する\n必要売価：1600×1.2 = 1920円\n定価：1920 ÷ 0.8 = 2400円\n\n4. 答えを確かめる\n2400×0.8−1600 = 320円の利益。原価の20％です。", "tip": "原価基準の利益率と、定価基準の割引率を分けます。", "steps": [{"title": "条件を整理する", "text": "必要な売価は原価の120％、定価に対する売価は80％です。"}, {"title": "式を立てる理由", "text": "まず目標の売価を出し、その売価を0.8で割って値引き前の定価に戻します。"}, {"title": "順番に計算する", "text": "必要売価：1600×1.2 = 1920円\n定価：1920 ÷ 0.8 = 2400円"}, {"title": "答えを確かめる", "text": "2400×0.8−1600 = 320円の利益。原価の20％です。"}]}, {"id": "q442", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "定価4000円の品を3000円で売りました。定価からの割引率は何％ですか。", "choices": ["26％", "27％", "25％", "24％"], "answer": 2, "explanation": "1. 条件を整理する\n値引き額は定価と売価の差です。割合の基準は定価4000円です。\n\n2. 式を立てる理由\n差額÷定価で、定価の何割を引いたかが分かります。\n\n3. 順番に計算する\n値引き額：4000−3000 = 1000円\n割引率：1000 ÷ 4000 × 100 = 25％\n\n4. 答えを確かめる\n売価は定価の75％。4000×0.75 = 3000円です。", "tip": "割引率を売価で割らないようにしましょう。", "steps": [{"title": "条件を整理する", "text": "値引き額は定価と売価の差です。割合の基準は定価4000円です。"}, {"title": "式を立てる理由", "text": "差額÷定価で、定価の何割を引いたかが分かります。"}, {"title": "順番に計算する", "text": "値引き額：4000−3000 = 1000円\n割引率：1000 ÷ 4000 × 100 = 25％"}, {"title": "答えを確かめる", "text": "売価は定価の75％。4000×0.75 = 3000円です。"}]}, {"id": "q443", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "品物を1個100円で30個仕入れました。1個200円で売り、売れ残りを廃棄するとき、全体で1000円以上の利益を出すには最低何個売る必要がありますか。", "choices": ["21個", "20個", "22個", "19個"], "answer": 1, "explanation": "1. 条件を整理する\n全体の仕入れ費は3000円。売れ残りも費用に含め、利益1000円を上乗せする売上が必要です。\n\n2. 式を立てる理由\n必要売上＝全仕入れ費＋目標利益。1個の売価で割って最低個数を求めます。\n\n3. 順番に計算する\n必要売上：3000+1000 = 4000円\n必要個数：4000 ÷ 200 = 20個\n\n4. 答えを確かめる\n19個では利益800円で不足。20個なら1000円になります。", "tip": "最低個数では、割り切れないときは切り上げます。", "steps": [{"title": "条件を整理する", "text": "全体の仕入れ費は3000円。売れ残りも費用に含め、利益1000円を上乗せする売上が必要です。"}, {"title": "式を立てる理由", "text": "必要売上＝全仕入れ費＋目標利益。1個の売価で割って最低個数を求めます。"}, {"title": "順番に計算する", "text": "必要売上：3000+1000 = 4000円\n必要個数：4000 ÷ 200 = 20個"}, {"title": "答えを確かめる", "text": "19個では利益800円で不足。20個なら1000円になります。"}]}, {"id": "q444", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "1個500円の商品は、6個セットなら2500円です。6個をばらで買う場合に比べ、セットは何％安いですか。", "choices": ["50/3％", "17％", "52/3％", "49/3％"], "answer": 0, "explanation": "1. 条件を整理する\nばら6個は3000円、セットは2500円です。\n\n2. 式を立てる理由\n安くなった額を、比較の基準であるばら購入の総額で割ります。\n\n3. 順番に計算する\n差額：3000−2500 = 500円\n割合：500 ÷ 3000 × 100 = 50/3％\n\n4. 答えを確かめる\nばら6個の代金のうち1個分が安くなるので、1/6＝50/3％です。", "tip": "比較の基準となる価格を先に決めます。", "steps": [{"title": "条件を整理する", "text": "ばら6個は3000円、セットは2500円です。"}, {"title": "式を立てる理由", "text": "安くなった額を、比較の基準であるばら購入の総額で割ります。"}, {"title": "順番に計算する", "text": "差額：3000−2500 = 500円\n割合：500 ÷ 3000 × 100 = 50/3％"}, {"title": "答えを確かめる", "text": "ばら6個の代金のうち1個分が安くなるので、1/6＝50/3％です。"}]}, {"id": "q445", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "原価2000円の商品に定価4000円をつけました。赤字を出さないための最大割引率は何％ですか。", "choices": ["60％", "70％", "40％", "50％"], "answer": 3, "explanation": "1. 条件を整理する\n赤字を出さない最低売価は原価2000円です。\n\n2. 式を立てる理由\n割引後の売価が原価と等しくなるところが限界です。定価から原価までの差を定価で割ります。\n\n3. 順番に計算する\n最大値引き額：4000−2000 = 2000円\n最大割引率：2000 ÷ 4000 × 100 = 50％\n\n4. 答えを確かめる\n50％引きなら売価は2000円で利益0円。それより割り引くと原価を下回ります。", "tip": "利益0円を赤字との境界として計算します。", "steps": [{"title": "条件を整理する", "text": "赤字を出さない最低売価は原価2000円です。"}, {"title": "式を立てる理由", "text": "割引後の売価が原価と等しくなるところが限界です。定価から原価までの差を定価で割ります。"}, {"title": "順番に計算する", "text": "最大値引き額：4000−2000 = 2000円\n最大割引率：2000 ÷ 4000 × 100 = 50％"}, {"title": "答えを確かめる", "text": "50％引きなら売価は2000円で利益0円。それより割り引くと原価を下回ります。"}]}, {"id": "q446", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "原価900円の商品を1500円で販売しました。販売手数料として売価の10％を支払うと、手数料も差し引いた利益はいくらですか。", "choices": ["460円", "470円", "450円", "440円"], "answer": 2, "explanation": "1. 条件を整理する\n売上1500円から、原価と手数料の両方を引きます。\n\n2. 式を立てる理由\n手数料は売価を基準に計算します。売上の90％が受取額で、そこから原価を引きます。\n\n3. 順番に計算する\n手数料：1500×0.1 = 150円\n受取額：1500−150 = 1350円\n利益：1350−900 = 450円\n\n4. 答えを確かめる\n原価900円＋手数料150円＋利益450円＝売価1500円です。", "tip": "費用が複数ある場合はすべて差し引きます。", "steps": [{"title": "条件を整理する", "text": "売上1500円から、原価と手数料の両方を引きます。"}, {"title": "式を立てる理由", "text": "手数料は売価を基準に計算します。売上の90％が受取額で、そこから原価を引きます。"}, {"title": "順番に計算する", "text": "手数料：1500×0.1 = 150円\n受取額：1500−150 = 1350円\n利益：1350−900 = 450円"}, {"title": "答えを確かめる", "text": "原価900円＋手数料150円＋利益450円＝売価1500円です。"}]}, {"id": "q447", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "1個300円で20個仕入れ、半分を500円、残り半分を350円で売り切りました。全体の利益はいくらですか。", "choices": ["2600円", "2500円", "2700円", "2400円"], "answer": 1, "explanation": "1. 条件を整理する\n販売価格が2種類です。各価格の売上を足し、仕入れ総額を引きます。\n\n2. 式を立てる理由\n個数が同じなので平均売価でも計算できますが、まず価格ごとに売上を求めると確実です。\n\n3. 順番に計算する\n500円の売上：10×500 = 5000円\n350円の売上：10×350 = 3500円\n利益：5000+3500−6000 = 2500円\n\n4. 答えを確かめる\n平均売価は425円。1個平均の利益125円×20個＝2500円です。", "tip": "価格が異なるグループの売上を分けます。", "steps": [{"title": "条件を整理する", "text": "販売価格が2種類です。各価格の売上を足し、仕入れ総額を引きます。"}, {"title": "式を立てる理由", "text": "個数が同じなので平均売価でも計算できますが、まず価格ごとに売上を求めると確実です。"}, {"title": "順番に計算する", "text": "500円の売上：10×500 = 5000円\n350円の売上：10×350 = 3500円\n利益：5000+3500−6000 = 2500円"}, {"title": "答えを確かめる", "text": "平均売価は425円。1個平均の利益125円×20個＝2500円です。"}]}, {"id": "q448", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "定価1000円の品を20％引きにし、その値引き後の価格からさらに10％引きにしました。最終価格はいくらですか。", "choices": ["720円", "820円", "920円", "620円"], "answer": 0, "explanation": "1. 条件を整理する\n2回目の10％は元の定価ではなく、最初の値引き後の価格に掛かります。\n\n2. 式を立てる理由\n値引き後に残る倍率0.8と0.9を順に掛けます。合計30％引きにはなりません。\n\n3. 順番に計算する\n1回目：1000×0.8 = 800円\n2回目：800×0.9 = 720円\n\n4. 答えを確かめる\n0.8×0.9＝0.72なので最終価格は定価の72％、合計では28％引きです。", "tip": "連続割引は割引率の足し算ではなく倍率の掛け算です。", "steps": [{"title": "条件を整理する", "text": "2回目の10％は元の定価ではなく、最初の値引き後の価格に掛かります。"}, {"title": "式を立てる理由", "text": "値引き後に残る倍率0.8と0.9を順に掛けます。合計30％引きにはなりません。"}, {"title": "順番に計算する", "text": "1回目：1000×0.8 = 800円\n2回目：800×0.9 = 720円"}, {"title": "答えを確かめる", "text": "0.8×0.9＝0.72なので最終価格は定価の72％、合計では28％引きです。"}]}, {"id": "q449", "category": "非言語", "topic": "損益算", "level": "標準", "prompt": "売価800円の品の利益は、売価の20％でした。この品の原価はいくらですか。", "choices": ["740円", "840円", "540円", "640円"], "answer": 3, "explanation": "1. 条件を整理する\n今回は「売価の20％」が利益です。原価の20％ではありません。\n\n2. 式を立てる理由\n売価＝原価＋利益なので、売価から利益を引きます。\n\n3. 順番に計算する\n利益：800×0.2 = 160円\n原価：800−160 = 640円\n\n4. 答えを確かめる\n原価640＋利益160＝売価800。原価基準なら利益率25％となり、基準の違いも確認できます。", "tip": "利益率の基準が売価か原価かを必ず読みます。", "s
